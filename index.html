nem honorários. A sucumbência só ocorre no recurso, contra o vencido, com honorários entre 10% e 20% do valor da condenação.", "Esponja em Áudio · aula 36"], ["O incidente de desconsideração da personalidade jurídica é admitido nos Juizados, art. 1.062 do CPC.", "Esponja em Áudio · aula 36"]]}, {"n": 14, "nome": "Mediação, arbitragem e negócios processuais com a Fazenda Pública", "sub": "", "a": [["Artigo 165 do CPC. O conciliador atua quando não há vínculo anterior e pode sugerir soluções. O mediador atua quando há vínculo anterior e ajuda as partes a identificar interesses e construir a solução, sem sugerir. A banca inverte: guarde: conciliador sugere, mediador não.", "Esponja em Áudio · aula 56"], ["Princípios da mediação, art. 2º da Lei 13.140: imparcialidade, isonomia, oralidade, informalidade, autonomia da vontade, busca do consenso, confidencialidade e boa-fé. Havendo cláusula de mediação, as partes comparecem à primeira reunião, mas ninguém é obrigado a permanecer.", "Esponja em Áudio · aula 56"], ["O objeto são direitos disponíveis ou indisponíveis que admitam transação. Sobre direito indisponível transigível, o acordo exige homologação judicial com oitiva do Ministério Público. O mediador aplica as regras de impedimento e suspeição do juiz.", "Esponja em Áudio · aula 56"], ["Fica impedido por um ano de assessorar ou representar qualquer das partes. A banca troca por dois anos. Errado. Não pode ser árbitro nem testemunha no mesmo conflito. A mediação judicial deve ser concluída em sessenta dias.", "Esponja em Áudio · aula 56"], ["Audiência do art. 334 do CPC: o juiz a designa com trinta dias de antecedência. Pode haver mais de uma sessão, em até dois meses. Só não se realiza se ambas as partes manifestarem desinteresse, ou se não se admitir autocomposição. O desinteresse de só uma parte não basta.", "Esponja em Áudio · aula 56"], ["No litisconsórcio, todos devem manifestar. A ausência injustificada é ato atentatório à dignidade da justiça. Câmaras de prevenção e resolução administrativa de conflitos, art. 32 da Lei 13.140.", "Esponja em Áudio · aula 56"], ["Os entes poderão criar câmaras na advocacia pública para dirimir conflitos entre órgãos, avaliar a admissibilidade de pedidos de composição entre particular e ente público e celebrar termo de ajustamento de conduta. A Lei diz poderão.", "Esponja em Áudio · aula 56"], ["O art. 174 do CPC diz criarão: a submissão do particular é facultativa e depende de regulamento. Ficam fora controvérsias que dependam de autorização do Legislativo. Artigo 34: a instauração do procedimento suspende a prescrição. Suspende, não interrompe.", "Esponja em Áudio · aula 56"], ["Retroage à data do pedido quando há juízo de admissibilidade. Arbitragem, Lei 9.307: a administração direta e indireta pode usar a arbitragem para direitos patrimoniais disponíveis.", "Esponja em Áudio · aula 56"], ["A arbitragem com a administração é sempre de direito, nunca por equidade, e respeita a publicidade. A banca fala em sigilo. Errado. A sentença arbitral não depende de homologação e não comporta recurso. Produz os efeitos da sentença judicial e, se condenatória, é título executivo.", "Esponja em Áudio · aula 56"], ["A nulidade se pede ao Judiciário em ação no prazo de noventa dias. Artigo 190 do CPC.", "Esponja em Áudio · aula 56"], ["Versando o processo sobre direitos que admitam autocomposição, partes plenamente capazes podem estipular mudanças no procedimento e convencionar sobre ônus, poderes, faculdades e deveres processuais, antes ou durante o processo.", "Esponja em Áudio · aula 56"], ["O juiz controla a validade e só recusa nos casos de nulidade, de inserção abusiva em contrato de adesão ou de manifesta vulnerabilidade. O negócio processual não pode afastar normas cogentes nem o interesse público. Artigo 191, calendário processual.", "Esponja em Áudio · aula 56"], ["Juiz e partes, de comum acordo, fixam calendário para os atos. O calendário vincula as partes e o juiz, e não só as partes. Os prazos só mudam em casos excepcionais, e fica dispensada a intimação para os atos com data prevista.", "Esponja em Áudio · aula 56"]]}, {"n": 15, "nome": "Juros, correção monetária e prescrição contra a Fazenda", "sub": "", "a": [["Decreto 20.910 de 1932: prescrevem em cinco anos as dívidas e ações contra a Fazenda, contados do ato ou fato. O Decreto-Lei 4.597 estende a regra às autarquias.", "Esponja em Áudio · aula 60"], ["O STJ, no Tema 553, decidiu que a indenização contra a Fazenda prescreve em cinco anos, e não em três como no Código Civil. A banca diz três. Errado. Trato sucessivo, súmula 85: se o direito em si não foi negado, prescrevem apenas as parcelas anteriores ao quinquênio.", "Esponja em Áudio · aula 60"], ["A prescrição se interrompe uma só vez e recomeça pela metade do prazo, sem ficar abaixo de cinco anos, súmula 383 do STF. Já a reclamação administrativa sem prazo fixado suspende por um ano. Suspensão: a demora da repartição em estudar ou pagar suspende a prescrição.", "Esponja em Áudio · aula 60"], ["A demora do credor em prestar esclarecimentos não suspende. A execução prescreve no mesmo prazo da ação, súmula 150 do STF.", "Esponja em Áudio · aula 60"], ["No Código de Processo Civil, art. 921, o termo inicial da prescrição intercorrente é a ciência da primeira tentativa infrutífera, a suspensão de um ano ocorre uma só vez, e citação, intimação ou constrição efetivas interrompem o prazo.", "Esponja em Áudio · aula 60"], ["Ressarcimento ao erário: improbidade dolosa: imprescritível, Tema 897 do STF. Ilícito civil: prescritível, Tema 666. Decisão de Tribunal de Contas: prescritível, Tema 899. A banca diz que todo ressarcimento é imprescritível. Errado. Correção monetária e juros, em três fases.", "Esponja em Áudio · aula 60"], ["Antes da Emenda 113 de 2021, o Supremo declarou inconstitucional a Taxa Referencial na correção, aplicando o IPCA-E, e manteve os juros da poupança nas condenações não tributárias, Tema 810. Nas tributárias, aplicam-se os critérios com que a Fazenda corrige seus créditos.", "Esponja em Áudio · aula 60"], ["Emenda 113 de 2021: a Selic é índice único para correção, remuneração do capital e mora, nas condenações da Fazenda. O Tema 1.419 do STF fixou isso para o período da redação original. Emenda 136 de 2025: nos requisitórios, IPCA mais 2% ao ano, juros simples, limitado à Selic.", "Esponja em Áudio · aula 60"], ["Para Estados, Distrito Federal e Municípios, vale desde primeiro de agosto de 2025, pelo art. 97, parágrafo dezesseis, do ADCT. Cuidado com a data da prova. A fase anterior à expedição do requisitório, depois da Emenda 136, está no Tema 1.484 do STF, ainda sem tese. Não afirme com certeza.", "Esponja em Áudio · aula 60"], ["Súmula vinculante 17: durante o prazo constitucional de pagamento do precatório, não incidem juros de mora. Tema 96 do STF: incidem juros entre a data da elaboração do cálculo e a expedição do requisitório. A banca diz que incidem juros no prazo constitucional. Errado.", "Esponja em Áudio · aula 60"]]}]}];
let m=null,t=null,i=0;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function tema(x){const r=document.documentElement.style;r.setProperty('--tema',x.c);r.setProperty('--tema-t',x.t);r.setProperty('--tema-t2',x.t2);r.setProperty('--tema-d',x.d)}
function home(){m=t=null;i=0;let h='<p class="muted" style="margin-bottom:16px">Escolha a matéria.</p>';
 D.forEach((x,k)=>{const n=x.topicos.reduce((s,y)=>s+y.a.length,0);
  h+='<button class="card topic" style="--tema:'+x.c+';--tema-t:'+x.t+'" data-m="'+k+'"><h3>'+esc(x.nome)+'</h3><p>'+n+' assertivas</p></button>'});
 app.innerHTML=h;app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=D[+b.dataset.m];tema(m);topics()});window.scrollTo(0,0)}
function topics(){t=null;i=0;let h='<button class="back" id="b">← Matérias</button><span class="chip">'+esc(m.nome)+'</span><p class="muted" style="margin-bottom:14px">Escolha a aula.</p>';
 m.topicos.forEach((x,k)=>{h+='<button class="card topic" data-t="'+k+'"><h3>'+x.n+'. '+esc(x.nome)+'</h3><p>'+(x.a.length?x.a.length+(x.a.length==1?' assertiva':' assertivas'):'sem assertivas')+'</p></button>'});
 app.innerHTML=h;document.getElementById('b').onclick=home;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{t=m.topicos[+b.dataset.t];i=0;read()});window.scrollTo(0,0)}
function go(d){const tk=m.topicos.indexOf(t);
 if(d>0){if(t.a.length&&i<t.a.length-1){i++}else if(tk<m.topicos.length-1){t=m.topicos[tk+1];i=0}else return}
 else{if(t.a.length&&i>0){i--}else if(tk>0){t=m.topicos[tk-1];i=Math.max(0,t.a.length-1)}else return}
 read()}
function read(){const n=t.a.length,tk=m.topicos.indexOf(t);
 const ini=tk===0&&i===0,fim=tk===m.topicos.length-1&&(!n||i===n-1);
 let h='<button class="back" id="b">← Aulas</button><span class="chip">'+esc(m.nome)+'</span><p class="tname">'+t.n+'. '+esc(t.nome)+'</p>';
 if(!n){h+='<div class="card rd"><p class="vazio">Não há questões verdadeiras sobre esse tópico no nosso banco de questões.</p></div>'}
 else{const a=t.a[i];h+='<div class="cnt">'+(i+1)+' / '+n+'</div><div class="card rd"><p'+(a[0].length>260?' class="long"':'')+'>'+esc(a[0])+'</p><div class="fonte">'+esc(a[1])+'</div></div>'}
 h+='<div class="nav2"><button class="btn sec" id="v"'+(ini?' disabled':'')+'>Voltar</button><button class="btn" id="a"'+(fim?' disabled':'')+'>Avançar</button></div>';
 app.innerHTML=h;document.getElementById('b').onclick=topics;
 document.getElementById('v').onclick=()=>go(-1);document.getElementById('a').onclick=()=>go(1);
 window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(!t)return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
let x0=null;document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(x0===null||!t)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(d<-60)go(1);if(d>60)go(-1)});
home();
</script></body></html>
