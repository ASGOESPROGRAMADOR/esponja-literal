<style>
:root{--cream:#f4ecdc;--cream-2:#fff8f0;--sand:#eadcc3;--salmon:#d88f79;--salmon-2:#efb6a3;--brown:#8a5a2b;--brown-2:#5b3a22;--brown-3:#2f2119;--gold:#c28b2f;--ink:#352d24;--muted:#766b5d;--white:#fffdf9;--green:#3fa36b;--red:#b5482f;
--tema:#F9A825;--tema-t:#FFF8E1;--tema-t2:#FFECB3;--tema-d:#8A5200}
*{box-sizing:border-box;margin:0}
body{background:var(--cream);color:var(--ink);font:17px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
body:before{content:"";display:block;height:10px;background:linear-gradient(90deg,var(--salmon) 0 25%,var(--gold) 0 50%,var(--brown) 0 75%,var(--brown-3) 0)}
h1,h2,h3{font-family:Lora,Georgia,serif;color:var(--brown-3);line-height:1.2}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;max-width:820px;margin:0 auto}
header h1{font-size:24px}header small{color:var(--muted);display:block;font-family:Inter;font-size:13px}
nav{display:flex;gap:8px;max-width:820px;margin:0 auto;padding:0 16px 12px}
nav button{flex:1;font:600 15px Inter;padding:10px 6px;background:var(--white);border:3px solid var(--brown-3);border-radius:12px;color:var(--brown-3);cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
nav button.on{background:var(--brown-3);color:var(--cream)}
main{max-width:820px;margin:0 auto;padding:6px 16px 60px}
.card{background:var(--white);border:3px solid var(--brown-3);border-radius:16px;box-shadow:5px 5px 0 var(--brown-3);padding:18px;margin-bottom:18px}
.topic{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;background:var(--tema-t);border-left-width:12px;border-left-color:var(--tema)}
.topic h3{font-size:20px}.topic p{color:var(--muted);font-size:14px;margin-top:4px}
.chip{display:inline-block;font:700 12px Inter;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border:2px solid var(--brown-3);border-radius:99px;background:var(--tema);color:var(--brown-3);margin-bottom:8px}
.bar{height:10px;border:2px solid var(--brown-3);border-radius:9px;background:var(--white);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tema)}
.q{border-top:12px solid var(--tema)}
.src{font-size:13px;color:var(--muted);margin-bottom:8px}
.en{font-family:Lora,serif;font-size:19px;color:var(--brown-3);margin-bottom:10px}
.itens{background:var(--tema-t);border:2px dashed var(--tema-d);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-size:16px}.itens p+p{margin-top:6px}
.alt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;background:var(--white);border:2.5px solid var(--brown-3);border-radius:12px;padding:11px 12px;margin:9px 0;cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
.alt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--brown-3)}
.alt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tema-t2);border:2px solid var(--brown-3);display:grid;place-items:center;font-size:14px}
.alt.dis{cursor:default;box-shadow:none;opacity:.8}.alt.dis:active{transform:none}
.alt.ok{border-color:var(--green);background:#e7f5ec;opacity:1}.alt.bad{border-color:var(--red);background:#fbece7;opacity:1}
.fb{margin-top:16px;border-radius:14px;padding:14px;border:2.5px solid}
.fb.ok{background:#e7f5ec;border-color:var(--green)}.fb.bad{background:var(--cream-2);border-color:var(--brown-3)}
.fb .h{display:flex;align-items:center;gap:12px;font:700 18px Lora,serif}
.fb svg{flex:none}.fb .ex{margin-top:10px;font-size:16px}
.obs{margin-top:10px;font-size:14px;background:var(--sand);border-radius:10px;padding:8px 12px;color:var(--brown-2)}
.act{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:700 16px Inter;padding:11px 18px;border:3px solid var(--brown-3);border-radius:12px;background:var(--tema);color:var(--brown-3);cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
.btn.sec{background:var(--white)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{text-align:center;background:var(--white);border:3px solid var(--brown-3);border-radius:14px;padding:12px 4px;box-shadow:3px 3px 0 var(--brown-3)}.stat b{display:block;font:700 28px Lora,serif}.stat span{font-size:13px;color:var(--muted)}
.list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;background:var(--white);border:2px solid var(--brown-3);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brown-3);flex:none;background:var(--sand)}.dot.c{background:var(--green)}.dot.e{background:var(--red)}
.muted{color:var(--muted);font-size:14px}
.ed{display:inline-block;font:600 12px Inter;background:var(--brown-3);color:var(--cream);border-radius:8px;padding:2px 8px;margin:6px 0 0}
.zr{font:600 13px Inter;background:none;border:2px solid var(--red);color:var(--red);border-radius:10px;padding:5px 12px;cursor:pointer;margin:-8px 0 18px}
.fe{margin:0 0 12px;font-size:14px;background:#fbece7;border:2px dashed var(--red);border-radius:10px;padding:8px 12px;color:var(--brown-2)}

.back{font:600 14px Inter;background:none;border:2px solid var(--brown-3);border-radius:10px;padding:5px 12px;color:var(--brown-3);cursor:pointer;margin:0 0 14px}
.rd{border-top:12px solid var(--tema);min-height:230px;display:flex;flex-direction:column;justify-content:space-between}
.rd p{font:500 21px/1.6 Lora,Georgia,serif;color:var(--brown-3)}
.rd p.long{font-size:18px}
.rd .fonte{margin-top:18px;font-size:12px;color:var(--muted);opacity:.75;letter-spacing:.02em}
.tname{font:600 17px Lora,Georgia,serif;color:var(--brown);margin:12px 0 4px;line-height:1.3}
.cnt{font:600 13px Inter;color:var(--muted);margin:0 0 8px}
.nav2{display:flex;gap:12px}.nav2 .btn{flex:1}.btn[disabled]{opacity:.35;cursor:default;box-shadow:none}
.vazio{font-size:15px;color:var(--muted);padding:6px 0}
</style></head><body>
<header><div><h1>Esponja Literal</h1><small>Revisão literal das aulas · 8 a 14 assertivas por aula</small></div></header>
<main id="app"></main>
<script>
const D=[{"id": "ADM", "nome": "Direito Administrativo", "c": "#F9A825", "t": "#FFF8E1", "t2": "#FFECB3", "d": "#8A5200", "topicos": [{"n": 1, "nome": "Improbidade administrativa: acordo de não persecução cível (ANPC)", "sub": "", "a": [["O ANPC é a solução consensual da improbidade: o investigado ou réu assume obrigações, e a ação não segue ou é encerrada. A lei diz que o Ministério Público poderá celebrar o acordo, conforme a conveniência e a oportunidade. Não é direito subjetivo do investigado.", "Esponja em Áudio · aula 49"], ["O Judiciário não pode suprir a vontade do Ministério Público, nem homologar acordo que ele recusou. A banca diz que o juiz pode suprir a recusa imotivada. Errado.", "Esponja em Áudio · aula 49"], ["O Município não depende da inércia do Ministério Público, e a prerrogativa de celebrar o ANPC se estende ao ente lesado. A banca diz que só se o Ministério Público for inerte. Errado.", "Esponja em Áudio · aula 49"], ["O acordo deve ter, no mínimo, o integral ressarcimento do dano e a reversão, à pessoa jurídica lesada, da vantagem indevida obtida. Pode ainda prever uma ou mais sanções da lei, sem prejuízo do ressarcimento e da perda dos bens acrescidos ilicitamente.", "Esponja em Áudio · aula 49"], ["A reparação do dano não se flexibiliza: dizer que pode ser parcial, se o investigado não tem como pagar, é errado. Os requisitos do parágrafo primeiro são cumulativos. Primeiro, a oitiva do ente federativo lesado, antes ou depois do ajuizamento da ação.", "Esponja em Áudio · aula 49"], ["Terceiro, a homologação judicial, independentemente de o acordo ocorrer antes ou depois do ajuizamento da ação. Atenção à pegadinha: ouvir não é exigir aquiescência. O ente lesado deve ser ouvido, mas a concordância dele não é requisito de validade nem de eficácia, conforme a Resolução 306.", "Esponja em Áudio · aula 49"], ["Dizer que o acordo só vale se o Município concordar é errado. E a homologação judicial é sempre exigida, inclusive no acordo extrajudicial. Segundo o resumo, a aprovação pelo órgão do Ministério Público só é condição de eficácia quando o acordo é anterior ao ajuizamento.", "Esponja em Áudio · aula 49"], ["A personalidade do agente é critério legal. O Tribunal de Contas é ouvido para apurar o valor do dano, parágrafo terceiro. E, parágrafo quarto, o acordo pode ser celebrado no curso da investigação, no curso da ação ou na execução da sentença condenatória, inclusive depois do trânsito em julgado.", "Esponja em Áudio · aula 49"], ["Dizer que é vedado após o trânsito é a inversão clássica. A negociação ocorre entre o Ministério Público e o investigado ou demandado, com o seu defensor, advogado ou defensor público, em todas as fases.", "Esponja em Áudio · aula 49"], ["A decisão homologatória é título executivo judicial. Quanto ao ANPP, o acordo de não persecução penal, as esferas penal e civil são independentes. O ANPP não vincula o promotor do patrimônio público nem impede a ação de improbidade.", "Esponja em Áudio · aula 49"], ["No Tema 1199, o Supremo fixou quatro pontos sobre a Lei 14.230. Um: exige-se dolo nos art. 9º, 10 e 11. Dois: a revogação da modalidade culposa é irretroativa quanto à coisa julgada e à execução das penas.", "Esponja em Áudio · aula 49"], ["Três: a nova lei alcança os atos culposos anteriores sem condenação transitada em julgado, e o juiz analisa se houve dolo. Quatro: o novo regime prescricional é irretroativo, e os novos marcos contam da publicação da lei, em 26 de outubro de 2021, sem alcançar a inatividade anterior.", "Esponja em Áudio · aula 49"], ["Na prescrição, art. 23, o prazo é de 8 anos a partir do fato, e a intercorrente é de 4 anos: a instauração de inquérito civil ou de processo administrativo suspende o prazo por, no máximo, 180 dias corridos, e depois ele recomeça a correr. Não retoma o saldo.", "Esponja em Áudio · aula 49"], ["O ressarcimento ao erário por ato doloso de improbidade é imprescritível, Tema 897, e a prescrição da sanção não extingue automaticamente o ressarcimento. Depois da Lei 14.230, exige-se dolo, e o rol do art. 11 é taxativo.", "Esponja em Áudio · aula 49"]]}, {"n": 2, "nome": "Advocacia pública: responsabilidade do parecerista e do gestor", "sub": "", "a": [["A regra geral está no art. 28 da LINDB: o agente público responde pessoalmente por suas decisões ou opiniões técnicas apenas em caso de dolo ou erro grosseiro. Culpa leve não basta. A regra vale para o gestor e para o parecerista. A banca diz que só o dolo responsabiliza. Errado.", "Esponja em Áudio · aula 45"], ["Diz que a culpa leve basta. Também errado. Sobre a natureza do parecer, o Supremo, nos Mandados de Segurança 24.073 e 24.631, distinguiu três situações. Primeira: o parecer facultativo, em que a autoridade não fica vinculada.", "Esponja em Áudio · aula 45"], ["Segunda: o parecer obrigatório, mas não vinculante, em que a autoridade pode divergir, desde que motive. Terceira: o parecer vinculante, em que a lei manda decidir nos termos da conclusão do parecer.", "Esponja em Áudio · aula 45"], ["Nesse caso ele deixa de ser apenas opinativo, e o administrador só decide conforme a conclusão ou não decide. Aqui se admite a responsabilidade solidária do parecerista. Nos demais casos, o parecerista só responde por erro grave inescusável, culpa grave ou má-fé.", "Esponja em Áudio · aula 45"], ["A inviolabilidade do advogado, prevista no art. 2º, parágrafo terceiro, do Estatuto da OAB, vale nos limites da lei. Ela não afasta a responsabilidade por dolo ou erro grosseiro. A banca troca nos limites da lei por jamais responde.", "Esponja em Áudio · aula 45"], ["O gestor que segue parecer fundamentado, em regra, atua de boa-fé, e afasta-se o erro grosseiro. Mas a proteção não alcança dolo, conluio ou parecer manifestamente ilegal. O parecer não imuniza o gestor.", "Esponja em Áudio · aula 45"], ["O art. 53 da Lei 14.133 diz que, ao final da fase preparatória, o processo segue para o órgão de assessoramento jurídico, que realiza controle prévio de legalidade, mediante análise jurídica. Prévio, e não posterior à assinatura.", "Esponja em Áudio · aula 45"], ["No parecer, a manifestação deve ser redigida em linguagem simples e compreensível, de forma clara e objetiva. A banca troca por linguagem técnica.", "Esponja em Áudio · aula 45"], ["Pelo parágrafo quinto, a análise pode ser dispensada em hipóteses definidas em ato da autoridade jurídica máxima, como baixo valor, baixa complexidade, entrega imediata ou minutas padronizadas.", "Esponja em Áudio · aula 45"], ["O art. 10 trata da defesa do agente: se a autoridade ou o servidor precisar defender-se nas esferas administrativa, controladora ou judicial, por ato praticado com estrita observância de parecer elaborado na forma do art. 53, parágrafo primeiro, a advocacia pública promoverá, a critério do agente público, sua representação judicial ou extrajudicial.", "Esponja em Áudio · aula 45"], ["A critério do agente, e não da Administração. Alcança as três esferas. Não se aplica quando provas de atos ilícitos dolosos constarem nos autos. E vale ainda que o agente não ocupe mais o cargo.", "Esponja em Áudio · aula 45"], ["Na improbidade, a Lei 8.429, com a redação da Lei 14.230, só admite ato doloso, art. 1º, parágrafo primeiro. Dolo é a vontade livre e consciente de alcançar o resultado ilícito, e não basta a mera voluntariedade, parágrafo segundo.", "Esponja em Áudio · aula 45"], ["O mero exercício da função, sem ato doloso com fim ilícito, não gera responsabilidade, parágrafo terceiro. E a divergência interpretativa baseada em jurisprudência, ainda que não pacificada, não configura improbidade, parágrafo oitavo. Parecer equivocado, por si só, não é improbidade.", "Esponja em Áudio · aula 45"], ["Outros artigos da LINDB cobrados junto com esse tema: o art. 20, que exige exame das consequências práticas, sem proibir princípios; o art. 22, que considera as dificuldades reais do gestor, sem acrescentar a condição desde que não haja desrespeito à lei; o art. 24, em que a revisão de ato já completado respeita as orientações da época e não retroage; e o art. 27, que permite compensação por benefícios indevidos ou prejuízos anormais.", "Esponja em Áudio · aula 45"]]}, {"n": 3, "nome": "Regime jurídico e princípios da Administração: art. 37 da CF e Lei 9.784/99", "sub": "", "a": [["Comece pela legalidade: hoje ela é entendida como juridicidade: a Administração se vincula à lei, à Constituição e ao Direito como um todo, e não somente à lei em sentido estrito. Sobre a vinculação ao edital, é verdade que o edital é a lei do concurso, mas ele não se sobrepõe à lei.", "Esponja em Áudio · aula 41"], ["Se contraria a lei, a Administração pode e deve corrigi-lo em autotutela, mesmo depois das provas, quando isso for necessário para cumprir a lei. Não há direito adquirido a edital ilegal. A banca oferece alternativas dizendo que o edital nunca muda depois das provas. Errado.", "Esponja em Áudio · aula 41"], ["A motivação está no art. 50 da Lei 9.784. Exige indicação dos fatos e dos fundamentos jurídicos, entre outros, nos atos que neguem, limitem ou afetem direitos, ou imponham ou agravem deveres, encargos ou sanções. Deve ser explícita, clara e congruente.", "Esponja em Áudio · aula 41"], ["Pode consistir em declaração de concordância com fundamentos de pareceres, informações, decisões ou propostas anteriores, que passam a integrar o ato. É a chamada motivação aliunde, válida.", "Esponja em Áudio · aula 41"], ["E, em assuntos repetitivos, admite-se meio mecânico que reproduza os fundamentos, desde que não prejudique direitos. A banca troca por vedação nos dois casos. A proporcionalidade tem três passos: adequação, necessidade e proporcionalidade em sentido estrito.", "Esponja em Áudio · aula 41"], ["Neste último faz-se a ponderação, caso a caso. Não há vitória automática da supremacia do interesse público. Direitos como intimidade e vida privada podem ser restringidos por interesse público, se a medida passar no teste. A frase vence a supremacia do interesse público está errada.", "Esponja em Áudio · aula 41"], ["Na impessoalidade, aplica-se a teoria do órgão: o ato é imputado ao órgão ou à entidade, e não ao agente. O Supremo, no Tema 940, RE 1.027.633, fixou a dupla garantia. A vítima propõe a ação contra o Estado, ou contra a prestadora de serviço público, e o agente não é parte passiva legítima.", "Esponja em Áudio · aula 41"], ["Mas o Estado tem direito de regresso contra o agente, em caso de dolo ou culpa. A publicidade oficial, pelo art. 37, parágrafo primeiro, não pode conter nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores. A vedação é rigorosa, com ou sem conotação eleitoral.", "Esponja em Áudio · aula 41"], ["E o nepotismo é vedado sem necessidade de lei formal, conforme a Súmula Vinculante 13 e o Tema 1.001. A Lei 13.140, de 2015, art. 32, autoriza a criação de câmaras de prevenção e resolução administrativa de conflitos.", "Esponja em Áudio · aula 41"], ["Elas dirimem conflitos entre órgãos e entidades da Administração, avaliam a admissibilidade de pedidos de resolução de conflitos entre particular e pessoa jurídica de direito público, e podem tratar de equilíbrio econômico-financeiro de contratos, conforme o parágrafo quinto.", "Esponja em Áudio · aula 41"], ["A submissão é facultativa e depende do regulamento do ente. Havendo consenso, o acordo é título executivo extrajudicial. A banca inverte: diz obrigatória, diz sem competência para conflitos entre órgãos, diz que exige homologação judicial.", "Esponja em Áudio · aula 41"], ["Nenhuma está certa: na autotutela, as Súmulas 346 e 473 do Supremo permitem à Administração anular os atos ilegais e revogar os inconvenientes ou inoportunos, respeitados os direitos adquiridos, sem passar pelo Judiciário. Só atos discricionários são revogáveis.", "Esponja em Áudio · aula 41"], ["E o art. 54 da Lei 9.784 diz que o direito de anular atos administrativos favoráveis aos destinatários decai em 5 anos, contados da data em que foram praticados, salvo comprovada má-fé. O prazo de 5 anos não vale para a má-fé.", "Esponja em Áudio · aula 41"]]}, {"n": 4, "nome": "LINDB e Lei 13.655/2018: segurança jurídica na gestão pública", "sub": "", "a": [["O art. 20 é o consequencialismo: nas esferas administrativa, controladora e judicial, não se decide com base em valores jurídicos abstratos sem considerar as consequências práticas da decisão.", "Esponja em Áudio · aula 37"], ["Exige apenas que se analisem as consequências. A banca troca por: é proibido, em qualquer circunstância, decidir com base em valores abstratos. Errado.", "Esponja em Áudio · aula 37"], ["O art. 21 trata da invalidação: a decisão que invalidar ato, contrato, ajuste, processo ou norma deve indicar expressamente as suas consequências jurídicas e administrativas.", "Esponja em Áudio · aula 37"], ["O art. 22 manda considerar, na interpretação de normas sobre gestão pública, os obstáculos e as dificuldades reais do gestor e as exigências das políticas públicas a seu cargo, sem prejuízo dos direitos dos administrados: guarde essa expressão: sem prejuízo dos direitos dos administrados.", "Esponja em Áudio · aula 37"], ["O parágrafo primeiro diz que, na decisão sobre a regularidade de conduta ou a validade de ato, consideram-se as circunstâncias práticas que impuseram, limitaram ou condicionaram a ação do agente.", "Esponja em Áudio · aula 37"], ["O art. 23 trata do regime de transição: a decisão administrativa, controladora ou judicial que estabelecer interpretação ou orientação nova sobre norma de conteúdo indeterminado, impondo novo dever ou novo condicionamento de direito, deverá prever regime de transição, quando indispensável para que o novo dever ou condicionamento seja cumprido de modo proporcional, equânime e eficiente, e sem prejuízo aos interesses gerais.", "Esponja em Áudio · aula 37"], ["O art. 24 protege a estabilidade: a revisão, nas esferas administrativa, controladora ou judicial, quanto à validade de ato, contrato, ajuste, processo ou norma, cuja produção já se houver completado, levará em conta as orientações gerais da época.", "Esponja em Áudio · aula 37"], ["Consideram-se orientações gerais as interpretações e especificações contidas em atos públicos de caráter geral ou em jurisprudência judicial ou administrativa majoritária, e as adotadas por prática administrativa reiterada e de amplo conhecimento público. A banca inverte, dizendo que a nova orientação pode retroagir.", "Esponja em Áudio · aula 37"], ["Não pode. O art. 25, que previa uma ação declaratória de validade, foi vetado: ele não existe na LINDB. Se a assertiva falar nessa ação, está errada.", "Esponja em Áudio · aula 37"], ["O art. 26 permite que, para eliminar irregularidade, incerteza jurídica ou situação contenciosa na aplicação do direito público, inclusive no caso de expedição de licença, a autoridade administrativa celebre compromisso com os interessados, observada a legislação aplicável, e após oitiva do órgão jurídico e, quando for o caso, após realização de consulta pública, presentes razões de relevante interesse geral: o compromisso só produz efeitos a partir de sua publicação oficial.", "Esponja em Áudio · aula 37"], ["Deve buscar solução proporcional, equânime, eficiente e compatível com os interesses gerais. Não pode conferir desoneração permanente de dever ou condicionamento de direito reconhecidos por orientação geral.", "Esponja em Áudio · aula 37"], ["Deve prever com clareza as obrigações das partes, o prazo e o modo de cumprimento, e estabelecer sanções em caso de descumprimento. A banca diz que dispensa o órgão jurídico, ou que produz efeitos desde a assinatura. Errado nos dois casos.", "Esponja em Áudio · aula 37"], ["O art. 27 permite que a decisão imponha compensação por benefícios indevidos ou prejuízos anormais ou injustos resultantes do processo ou da conduta dos envolvidos, ouvidas as partes: o art. 29 diz que a edição de atos normativos por autoridade administrativa, salvo os de mera organização interna, poderá ser precedida de consulta pública.", "Esponja em Áudio · aula 37"], ["É poderá, e não deverá. E o art. 30 manda as autoridades atuarem para aumentar a segurança jurídica, por meio de regulamentos, súmulas administrativas e respostas a consultas, que têm caráter vinculante em relação ao órgão a que se destinam, até ulterior revisão: por fim, o art. 28.", "Esponja em Áudio · aula 37"]]}, {"n": 5, "nome": "Administração direta e indireta: autarquias, fundações, estatais e agências", "sub": "", "a": [["Na centralização, a União, os Estados e os Municípios executam as atividades por si mesmos, por meio de seus órgãos. A desconcentração é a distribuição de competências dentro da mesma pessoa jurídica, entre órgãos. Há hierarquia, subordinação.", "Esponja em Áudio · aula 17"], ["A tutela depende de previsão legal. A banca diz que o Ministério é superior hierárquico da autarquia. Está errado: ele a supervisiona, mas não manda nela. E a pegadinha clássica: dizer que a concessão é descentralização por outorga, ou que a desconcentração é a transferência para outra pessoa.", "Esponja em Áudio · aula 17"], ["Guarde: desconcentração, dentro da mesma pessoa; descentralização, para outra; outorga por lei; delegação por contrato ou ato. As autarquias são pessoas jurídicas de direito público, criadas por lei específica, conforme o art. 37, inciso 19, com patrimônio e receitas próprios. A palavra é criadas.", "Esponja em Áudio · aula 17"], ["Têm imunidade tributária recíproca, nos termos do art. 150, parágrafo 2º, regime de pessoal estatutário e responsabilidade civil objetiva, art. 37, parágrafo 6º. Se for autarquia federal, a causa tramita na Justiça Federal, art. 109, inciso 1.", "Esponja em Áudio · aula 17"], ["A Constituição, no art. 37, inciso 19, diz que lei complementar define as áreas de atuação das fundações: uma curiosidade cobrada: medida provisória não pode tratar desse tema, conforme o art. 62, parágrafo 1º, inciso 3.", "Esponja em Áudio · aula 17"], ["A personalidade jurídica nasce do registro dos atos constitutivos, e não da lei. A empresa pública tem capital 100% público, em qualquer forma societária. A sociedade de economia mista é sociedade anônima, com maioria do capital votante pertencente ao poder público.", "Esponja em Áudio · aula 17"], ["O regime geral é o da Lei 13.303, de 2016, o estatuto das estatais. O pessoal é celetista, admitido por concurso, sem estabilidade. Mas o Supremo exige motivação na dispensa, no caso da ECT, por exemplo.", "Esponja em Áudio · aula 17"], ["O teto remuneratório só se aplica às estatais que recebem recursos públicos para custeio, art. 37, parágrafo 9º. E elas não se sujeitam à falência. Há dois regimes, conforme a atividade.", "Esponja em Áudio · aula 17"], ["As que exploram atividade econômica seguem o regime das empresas privadas, sem privilégios não extensivos ao setor privado, art. 173, parágrafo 2º.", "Esponja em Áudio · aula 17"], ["As que prestam serviço público têm regime híbrido: responsabilidade objetiva, art. 37, parágrafo 6º, e, se o serviço for prestado em regime não concorrencial, o Supremo admite impenhorabilidade dos bens afetados ao serviço e pagamento por precatórios, como no caso da ECT.", "Esponja em Áudio · aula 17"], ["Quanto às subsidiárias, a criação exige autorização legislativa, que pode ser genérica, prevista na lei que autorizou a matriz. É a ADI 1.649. As agências reguladoras são autarquias em regime especial, com autonomia administrativa e financeira, disciplinadas pela Lei 13.848, de 2019.", "Esponja em Áudio · aula 17"], ["A consulta pública é obrigatória nos atos de interesse geral, mas não em todos os atos. A banca diz que a consulta pública é obrigatória para todo e qualquer ato. Está errado.", "Esponja em Áudio · aula 17"], ["As agências executivas são diferentes: são autarquias ou fundações qualificadas por decreto, e não criadas como tais, mediante plano de reestruturação e contrato de gestão, na forma da Lei 9.649, de 1998. Ganham maior autonomia, como limites maiores de dispensa de licitação.", "Esponja em Áudio · aula 17"], ["Já a sociedade de economia mista federal vai para a Justiça Estadual, salvo intervenção da União no processo. A banca costuma tratar as duas estatais da mesma forma. Não é igual. Resumo das pegadinhas: descentralização é para outra pessoa; desconcentração, dentro da mesma pessoa.", "Esponja em Áudio · aula 17"]]}, {"n": 6, "nome": "Consórcios públicos e convênios administrativos", "sub": "", "a": [["O problema é o seguinte. Muitos Municípios são pequenos e não têm dinheiro nem escala para, sozinhos, prestar bem certos serviços: um aterro sanitário, um hospital regional, o abastecimento de água, a compra de medicamentos.", "Esponja em Áudio · aula 5"], ["Se vários Municípios se juntam, dividem o custo e atuam em conjunto, o serviço fica viável. A Constituição autorizou isso no art. 241, que fala em gestão associada de serviços públicos, por meio de consórcios públicos e convênios de cooperação entre os entes federados.", "Esponja em Áudio · aula 5"], ["Se você guardar essa diferença, já responde metade das questões. O consórcio público é regido pela Lei 11.107/2005 e pelo Decreto 6.017/2007. É a união de entes federativos, isto é, União, Estados, Distrito Federal e Municípios, para a gestão associada de serviços públicos.", "Esponja em Áudio · aula 5"], ["O consórcio tem personalidade jurídica própria.", "Esponja em Áudio · aula 5"], ["Como o consórcio recebe dinheiro dos entes? Somente por meio do contrato de rateio, previsto no art. 8º da lei. Não é por convênio, nem por simples repasse, nem por transferência informal. Contrato de rateio é o instrumento pelo qual cada ente entrega recursos ao consórcio.", "Esponja em Áudio · aula 5"], ["Prévia significa que o orçamento precisa existir antes, e a banca gosta de dizer que a dotação pode vir depois. Está errado. E é vedada a aplicação dos recursos em despesas genéricas,. O dinheiro deve ter destino definido. O que acontece com o ente que não prevê a dotação?", "Esponja em Áudio · aula 5"], ["Pode ser excluído do consórcio, mas só depois de prévia suspensão. A ordem importa: primeiro suspende, depois exclui. E, se o agente público realizar despesa fora do contrato de rateio, a lei considera que pode haver ato de improbidade administrativa. Isso aparece no art. 8º, § 2º.", "Esponja em Áudio · aula 5"], ["Quem trabalha no consórcio? O pessoal do consórcio é regido pela CLT, conforme o art. 6º, § 2º da lei. Isso vale mesmo para o consórcio de direito público. A banca costuma dizer que são servidores estatutários, e erra.", "Esponja em Áudio · aula 5"], ["Isso significa que, se o consórcio não pagar, os entes podem ser chamados a responder, mas só depois dele. Uma observação de jurisprudência, útil para o procurador.", "Esponja em Áudio · aula 5"], ["Consequências práticas: no convênio não há preço nem remuneração: há repasse de recursos para aplicação no objeto. A banca troca isso, falando em contraprestação ou em lucro, e erra. Em regra, o convênio não cria pessoa jurídica. É por isso que ele não tem personalidade.", "Esponja em Áudio · aula 5"], ["E o convenente precisa prestar contas dos recursos recebidos. Se não prestar, ou se desviar, pode responder por improbidade e pode ter as contas julgadas irregulares pelo Tribunal de Contas. E a Lei de Licitações?", "Esponja em Áudio · aula 5"], ["O art. 184 da Lei 14.133/2021 determina que as regras da lei se aplicam aos convênios, acordos e ajustes congêneres, no que couber. Atenção ao no que couber: não se aplica integralmente, porque convênio não é contrato.", "Esponja em Áudio · aula 5"], ["Quando o convênio envolve verba federal, quem julga a ação de improbidade ou o crime relacionado ao desvio? O STJ tem duas súmulas que se complementam. A Súmula 208 diz que compete à Justiça Federal julgar prefeito por desvio de verba sujeita a prestação de contas perante órgão federal.", "Esponja em Áudio · aula 5"], ["Já a Súmula 209 diz que compete à Justiça Estadual quando a verba já foi incorporada ao patrimônio municipal. Guarde a diferença: prestação de contas a órgão federal, Justiça Federal; verba já incorporada ao Município, Justiça Estadual.", "Esponja em Áudio · aula 5"]]}, {"n": 7, "nome": "Terceiro setor e Lei 13.019/2014 (MROSC)", "sub": "", "a": [["Imagine três setores: o primeiro setor é o Estado, que presta serviço público com dinheiro público. O segundo setor é o mercado, que atua com fins lucrativos.", "Esponja em Áudio · aula 1"], ["E, por fim, as organizações da sociedade civil, as OSC, que são as entidades que se relacionam com o poder público pela Lei 13.019/2014, o MROSC. A grande questão da prova é não misturar essas figuras. Cada uma tem a sua lei, a sua forma de qualificação e o seu instrumento.", "Esponja em Áudio · aula 1"], ["Vamos começar pelas Organizações Sociais, previstas na Lei 9.637/1998.", "Esponja em Áudio · aula 1"], ["Pelo contrato de gestão, o Poder Público fixa metas e indicadores de desempenho, repassa recursos, bens e até servidores, e a entidade se compromete a atingir resultados. Quem acompanha e fiscaliza é o órgão supervisor, com controle também do Tribunal de Contas.", "Esponja em Áudio · aula 1"], ["A segunda figura é a OSCIP, regida pela Lei 9.790/1999. O nome completo é Organização da Sociedade Civil de Interesse Público. Aqui a lógica muda em um ponto central: a qualificação da OSCIP é vinculada.", "Esponja em Áudio · aula 1"], ["E mais: quando os responsáveis pela fiscalização do termo de parceria tomam conhecimento de irregularidade no uso de recursos públicos, eles têm o dever de comunicar ao Tribunal de Contas e ao Ministério Público. Se não comunicarem, respondem de forma solidária, e não subsidiária, pelos danos.", "Esponja em Áudio · aula 1"], ["Havendo indícios de malversação, a lei autoriza pedir o sequestro dos bens da entidade, dos seus dirigentes e dos terceiros que tenham enriquecido com o dano. A banca costuma trocar solidária por subsidiária, e dizer que o sequestro seria vedado para dirigentes. Isso está errado.", "Esponja em Áudio · aula 1"], ["Chegamos ao coração do tema: a Lei 13.019/2014. Para entender por que ela existe, pense no que acontecia antes. As prefeituras repassavam dinheiro a entidades por convênios, sem regras uniformes de seleção, de execução e de prestação de contas. Havia pouca transparência e muitos escândalos.", "Esponja em Áudio · aula 1"], ["Em linhas gerais, é a entidade privada sem fins lucrativos, que não distribui resultados, e que aplica seus recursos na finalidade social.", "Esponja em Áudio · aula 1"], ["Ponto importante: a OSC não precisa ter título de OS nem de OSCIP para fazer parceria pelo MROSC. O título é opcional e serve para outros regimes. A banca gosta de dizer que, sem o título, a entidade não poderia receber recursos. Isso é falso. Agora, os três instrumentos.", "Esponja em Áudio · aula 1"], ["A regra, para colaboração e fomento, é o chamamento público. É um procedimento de seleção, parecido em espírito com uma licitação, mas com regras próprias, que busca a entidade que torne mais eficaz a execução do objeto.", "Esponja em Áudio · aula 1"], ["A dispensa pode ocorrer, por exemplo, em situação de urgência, quando houver paralisação ou risco de paralisação de atividades de relevante interesse público, e nesse caso por prazo de até 180 dias. Também em guerra ou grave perturbação da ordem pública, e em calamidade pública.", "Esponja em Áudio · aula 1"], ["Primeiro, o MROSC não se aplica à participação complementar da iniciativa privada no Sistema Único de Saúde. Nesse caso vale o art. 199, §1º, da Constituição, que prevê contrato de direito público ou convênio, com preferência para entidades filantrópicas e sem fins lucrativos.", "Esponja em Áudio · aula 1"], ["Terceiro setor: entidades privadas, sem fins lucrativos, de interesse público, com dinheiro público sob controle. Organização Social: qualificação discricionária, contrato de gestão, procedimento público e objetivo.", "Esponja em Áudio · aula 1"]]}, {"n": 8, "nome": "Organização administrativa de Curitiba: Leis 7.671/1991, 9.226/1997 e Decreto 1.192/2017", "sub": "", "a": [["Uma observação de honestidade. Esta aula segue o resumo do edital e o decreto. O texto integral da Lei 9.226 não estava acessível quando preparamos o material, e a Lei 7.671 é aqui tratada na redação original de 1991.", "Esponja em Áudio · aula 9"], ["Por isso, antes da prova, confira o texto vigente de cada norma, porque a banca cobra o que está na letra da lei, e leis municipais mudam. Mas a estrutura que você vai ouvir agora é a base segura. O raciocínio geral é este.", "Esponja em Áudio · aula 9"], ["Então você precisa de dois blocos: a organização do Executivo, e o passo a passo da Organização Social. Vamos à administração direta. Ela compreende os órgãos colegiados, os órgãos de assessoramento, e as secretarias.", "Esponja em Áudio · aula 9"], ["As de fim entregam o serviço ao cidadão, como saúde e educação. Aqui vem a primeira pegadinha numérica. O Prefeito pode criar, por decreto, até duas secretarias extraordinárias, para programas transitórios.", "Esponja em Áudio · aula 9"], ["Guarde três palavras: por decreto, duas e transitórios. A banca costuma trocar por lei, ou aumentar o número, ou dizer que a secretaria extraordinária é permanente. Um ponto para raciocinar com o seu conhecimento constitucional.", "Esponja em Áudio · aula 9"], ["Em regra, a criação e a extinção de órgãos da administração depende de lei, mas a organização e o funcionamento, quando não implicam aumento de despesa nem criação ou extinção de órgãos, podem ser feitos por decreto autônomo, nos termos do art. 84, inciso 6, da Constituição, aplicado por simetria.", "Esponja em Áudio · aula 9"], ["Aqui a norma municipal prevê expressamente a figura das secretarias extraordinárias por decreto, e é isso que a prova cobra. Responda pela letra da norma local. Na administração indireta, a redação original da Lei 7.671 previa três grupos. Autarquias: o IPPUC, o IMAP e o IPMC.", "Esponja em Áudio · aula 9"], ["As estatais têm sigla de empresa: COHAB, URBS, CIC. E as duas fundações têm nome de fundação, a Cultural e a FREI. A pegadinha clássica é trocar a natureza. A banca diz, por exemplo, que a URBS é autarquia, ou que o IPPUC é empresa estatal. Se a assertiva diz que o IPPUC é autarquia, está certa.", "Esponja em Áudio · aula 9"], ["E o Conselho se reúne ao menos seis vezes por ano. A qualificação como OS acontece por chamamento público. O edital precisa observar um prazo mínimo de trinta dias. O resultado é formalizado por decreto. E é possível a desqualificação, mas só com ampla defesa. Guarde: nunca por indicação direta.", "Esponja em Áudio · aula 9"], ["Se existe mais de uma entidade interessada, faz-se chamamento seletivo, isto é, uma competição entre elas.", "Esponja em Áudio · aula 9"], ["Se existe uma só, o Município publica o Comunicado de Interesse Público, e a entidade tem quinze dias para se manifestar. A banca troca com facilidade: diz que o prazo do comunicado é de trinta dias, ou que o edital mínimo é de quinze. Lembre: edital, trinta; comunicado, quinze.", "Esponja em Áudio · aula 9"], ["Qualificada a OS, vem o contrato de gestão. Ele precisa conter metas e indicadores de desempenho. O texto passa pela revisão da Procuradoria Geral do Município, e é publicado no Portal da Transparência. Para o procurador, isso significa que a minuta do contrato de gestão chega a você.", "Esponja em Áudio · aula 9"], ["Sobre os servidores: podem ser cedidos à OS, com ônus para a origem, ou seja, o órgão de origem continua pagando. E a remuneração eventualmente paga pela OS não se incorpora ao cargo do servidor. Esse é um ponto que parece detalhe, mas aparece em prova.", "Esponja em Áudio · aula 9"], ["Vamos fechar com os números, porque é neles que a banca derruba candidato. Duas secretarias extraordinárias, por decreto. Quatro anos de mandato no Conselho. Seis reuniões por ano, no mínimo. Trinta dias de edital. Quinze dias para manifestação no Comunicado de Interesse Público.", "Esponja em Áudio · aula 9"]]}, {"n": 9, "nome": "Atos administrativos: requisitos, atributos, espécies e invalidação", "sub": "", "a": [["Os elementos do ato são cinco: competência, finalidade, forma, motivo e objeto. O resumo traz o macete COFIFOMOB. Competência, finalidade e forma são sempre vinculadas, em qualquer ato, inclusive no discricionário.", "Esponja em Áudio · aula 13"], ["E aqui está o ponto que a banca explora: a autoexecutoriedade não existe em todo ato. Exige previsão legal ou situação de urgência. Dizer que todo ato administrativo é autoexecutório é erro. Também é erro dizer que todo ato tem todos os atributos.", "Esponja em Áudio · aula 13"], ["O ato enunciativo, como a certidão e o atestado, apenas declara uma situação e não tem imperatividade. A motivação é a exposição escrita das razões do ato. A Lei 9.784, no art. 50, exige motivação para atos que neguem, limitem ou afetem direitos ou interesses.", "Esponja em Áudio · aula 13"], ["E o parágrafo primeiro admite a motivação per relationem, isto é, a declaração de concordância com pareceres ou informações anteriores, que passam a integrar o ato. A teoria dos motivos determinantes diz que o motivo declarado pelo agente vincula a validade do ato.", "Esponja em Áudio · aula 13"], ["Se o motivo declarado for falso ou inexistente, o ato é nulo, mesmo que a lei dispensasse a motivação. O exemplo clássico é a exoneração de cargo em comissão, ad nutum, prevista no art. 37, inciso 2, da Constituição.", "Esponja em Áudio · aula 13"], ["A exoneração dispensa motivação, mas, se a autoridade declarar um motivo, a validade do ato passa a depender da verdade desse motivo. A banca costuma dizer que, sendo dispensada a motivação, o motivo declarado não vincula. É justamente o contrário. Guarde: motivo declarado vincula.", "Esponja em Áudio · aula 13"], ["A Lei da Ação Popular, a 4.717, de 1965, no art. 2º, lista cinco vícios: incompetência, vício de forma, ilegalidade do objeto, inexistência dos motivos e desvio de finalidade. Vamos às formas de extinção, que a banca ama. A anulação decorre de ilegalidade.", "Esponja em Áudio · aula 13"], ["As Súmulas 346 e 473 do Supremo resumem tudo isso: a Administração pode declarar a nulidade dos seus próprios atos, e pode revogá-los por motivo de conveniência ou oportunidade, respeitados os direitos adquiridos, ressalvada em todos os casos a apreciação judicial. Se a banca disser que só o Judiciário anula, está errada.", "Esponja em Áudio · aula 13"], ["Se disser que o Judiciário revoga ato de outro Poder, também. A cassação é a extinção do ato porque o beneficiário deixou de cumprir condição exigida, como a cassação de uma licença por descumprimento. Tem caráter de sanção.", "Esponja em Áudio · aula 13"], ["A pegadinha é trocar as definições de cassação e caducidade. A convalidação é o aproveitamento do ato com defeito sanável, prevista no art. 55 da Lei 9.784. Podem ser convalidados os atos que apresentem defeitos sanáveis, desde que não acarretem lesão ao interesse público nem prejuízo a terceiros.", "Esponja em Áudio · aula 13"], ["O art. 54 da mesma lei fixa decadência de cinco anos para a Administração anular atos favoráveis aos destinatários, contados da data em que foram praticados, salvo comprovada má-fé: nos casos de efeitos patrimoniais contínuos, o prazo conta do primeiro pagamento. A banca pode trocar cinco por dez anos, ou dizer que não há prazo.", "Esponja em Áudio · aula 13"], ["E o Tema 138 do Supremo. Diz que a Administração pode anular os atos que repute ilegais, mas, se o ato repercutiu no campo de interesses individuais, o desfazimento precisa ser precedido de regular processo administrativo, com contraditório e ampla defesa.", "Esponja em Áudio · aula 13"], ["Licença é ato vinculado e definitivo: preenchidos os requisitos, a Administração é obrigada a concedê-la. Autorização é ato discricionário e precário. A banca inverte essas duas definições com frequência.", "Esponja em Áudio · aula 13"], ["No controle judicial, o Judiciário examina a legalidade, a razoabilidade e a proporcionalidade do ato, e não o mérito. Em concurso público, o Tema 485 do Supremo afirma que o Judiciário não substitui a banca na correção de provas, salvo ilegalidade, como o desrespeito ao edital.", "Esponja em Áudio · aula 13"]]}, {"n": 10, "nome": "Processo administrativo: Lei 16.466/2024, Decreto 435/2026 e prescrição", "sub": "", "a": [["Nos casos omissos da própria lei, aplicam-se o CPC e a Lei 9.784, art. 74. O meio eletrônico é obrigatório, art. 2º, e os processos físicos migram para o meio eletrônico em 180 dias. A banca pode dizer que o meio eletrônico é facultativo. Está errada.", "Esponja em Áudio · aula 21"], ["O impedimento, que alcança parentesco até o terceiro grau, e a suspeição estão nos art. 27 a 29. E a competência é irrenunciável, admitidas delegação e avocação temporária, art. 24 a 26. Vamos aos prazos, que a banca adora trocar. Todos são em dias úteis.", "Esponja em Áudio · aula 21"], ["Memorize a sequência cinco, três, dez, quinze e trinta. Cinco dias para os atos do processo, prorrogáveis por igual período, art. 32. Três dias de antecedência mínima para a intimação, art. 33. Dez dias para a defesa no processo sancionador, art. 63 e 64. Quinze dias para o recurso, art. 46.", "Esponja em Áudio · aula 21"], ["E trinta dias para decidir após a instrução, prorrogáveis de forma motivada, com teto de seis meses, art. 43. A banca troca trinta por sessenta, ou diz que a prorrogação é livre. Não é: é motivada e tem teto.", "Esponja em Áudio · aula 21"], ["O recurso é único, interposto em quinze dias da publicação, e, em regra, não tem efeito suspensivo. As decisões do Prefeito e das autoridades máximas encerram a instância administrativa. A banca diz dez dias, ou diz que o recurso suspende automaticamente.", "Esponja em Áudio · aula 21"], ["Ambos errados: outro prazo é o da reconsideração, art. 50: quinze dias para pedir e quinze para julgar. A contagem exclui o dia do começo e inclui o do vencimento, art. 51. E os prazos ficam suspensos de vinte de dezembro a vinte de janeiro, art. 75.", "Esponja em Áudio · aula 21"], ["Se não houver confirmação de leitura, efetiva-se ao fim de dez dias corridos. Esta é a única contagem em dias corridos do processo. A banca troca e fala em dez dias úteis. Por edital, a intimação se efetiva três dias úteis após a publicação.", "Esponja em Áudio · aula 21"], ["Se a intimação for defeituosa, ela é nula, mas o comparecimento do interessado sana o vício. A banca diz que a intimação irregular é sempre nula e não pode ser sanada. Errado. Na instrução, provas ilícitas são inadmissíveis, art. 38. O ônus da prova é do interessado quanto ao que alegou, art. 41.", "Esponja em Áudio · aula 21"], ["A decadência está no art. 53. A Administração tem cinco anos para anular atos favoráveis aos destinatários, salvo má-fé ou ofensa direta à Constituição. A banca costuma esquecer a segunda exceção, a ofensa direta à Constituição, e cobra só a má-fé.", "Esponja em Áudio · aula 21"], ["Nos efeitos patrimoniais contínuos, o prazo conta do primeiro pagamento. Verbas alimentares recebidas de boa-fé não se devolvem, art. 55. E é vedada a invalidação por mudança posterior de orientação geral, art. 59.", "Esponja em Áudio · aula 21"], ["No processo sancionador, art. 63 e 64, a lei exige a indicação dos fatos e do fundamento legal: a defesa é em dez dias úteis. A manifestação sobre documentos novos é em cinco dias úteis, e a decisão sai em trinta dias úteis após a instrução. Infrações e sanções dependem de lei, art. 13.", "Esponja em Áudio · aula 21"], ["Se a questão disser que, conforme a Lei 16.466, a prescrição intercorrente é de três anos, está errada. Os três anos são da Lei 9.873, que é federal.", "Esponja em Áudio · aula 21"], ["Os marcos interruptivos da Lei 9.873, art. 2º, são: a notificação ou citação do indiciado, qualquer ato inequívoco de apuração do fato, a decisão condenatória recorrível e a tentativa de solução conciliatória. A decisão condenatória só interrompe se for recorrível.", "Esponja em Áudio · aula 21"], ["E a Súmula 633 do Superior Tribunal de Justiça diz que a Lei 9.784 se aplica subsidiariamente a Estados e Municípios, para a decadência, se não houver norma local e específica. A Súmula 467 fixa cinco anos, do término do processo, para executar multa ambiental.", "Esponja em Áudio · aula 21"]]}, {"n": 11, "nome": "Direito administrativo sancionador", "sub": "", "a": [["Agora, a defesa: a Súmula Vinculante 5 diz que a falta de defesa técnica por advogado no processo administrativo disciplinar não ofende a Constituição. A Súmula 343 do STJ, que exigia advogado, está superada. A banca costuma cobrar a súmula antiga. Errado.", "Esponja em Áudio · aula 25"], ["O contraditório e a ampla defesa continuam obrigatórios, mas o advogado não. E a Súmula Vinculante 21 proíbe exigir depósito ou arrolamento prévio para recorrer na via administrativa. A banca troca pela Súmula Vinculante 28, que trata de depósito para discutir crédito tributário em juízo.", "Esponja em Áudio · aula 25"], ["É a Súmula 18 do Supremo: pela falta residual, não compreendida na absolvição pelo juízo criminal, é admissível a punição administrativa do servidor. A banca diz que toda absolvição penal impede a punição. Errado. Há uma exceção que caiu em prova de Juiz.", "Esponja em Áudio · aula 25"], ["Se o juízo criminal reconhece a inimputabilidade por doença mental, o servidor em surto psicótico não pode ser demitido. A Administração deve avaliar licença para tratamento ou aposentadoria por invalidez. Para o servidor federal, o STJ tem três súmulas.", "Esponja em Áudio · aula 25"], ["A 650: configuradas as hipóteses do art. 132 da Lei 8.112, a demissão é vinculada, sem discricionariedade para pena menor. A 651: a autoridade pode demitir por improbidade sem condenação judicial prévia.", "Esponja em Áudio · aula 25"], ["E a 592: o excesso de prazo para concluir o processo só gera nulidade se houver prejuízo à defesa. Outra regra do STJ: a nulidade no processo disciplinar só é declarada se houver prejuízo efetivo. O controle judicial, pela Súmula 665, se limita à regularidade do procedimento e à legalidade do ato.", "Esponja em Áudio · aula 25"], ["A Lei 14.133 prevê quatro sanções, no art. 156: advertência, multa, impedimento de licitar e contratar, e declaração de inidoneidade. O impedimento dura até 3 anos. A inidoneidade, de 3 a 6 anos. A defesa prévia é de 15 dias úteis.", "Esponja em Áudio · aula 25"], ["A multa vai de 0,1% a 20% do faturamento bruto do último exercício anterior à instauração do processo, nunca inferior à vantagem auferida. A banca troca faturamento bruto por lucro. Errado. Sem faturamento, a multa vai de 6 mil a 60 milhões de reais.", "Esponja em Áudio · aula 25"], ["O STJ admite aplicar a Lei Anticorrupção e a Lei de Improbidade juntas, sem bis in idem, desde que não se imponham sanções idênticas. A improbidade, depois da Lei 14.230, exige dolo. Foi extinta a modalidade culposa. A sanção é judicial, aplicada em ação própria, e não no processo administrativo.", "Esponja em Áudio · aula 25"], ["Admite-se o acordo de não persecução civil, com ressarcimento integral do dano. Prescrição é onde a banca mais erra o candidato. A Lei 9.873, de 1999, vale só para a esfera federal.", "Esponja em Áudio · aula 25"], ["Para Estados e Municípios sem lei própria, o STJ aplica por analogia o Decreto 20.910, de 1932, 5 anos. E a prescrição intercorrente da lei federal não se estende a eles. A banca diz que vale em todos os entes. Errado.", "Esponja em Áudio · aula 25"], ["A Súmula 635 do STJ, para o servidor federal: o prazo do art. 142 da Lei 8.112 começa quando a autoridade toma conhecimento do fato, é interrompido com a instauração do processo disciplinar e volta a correr por inteiro após 140 dias. A banca troca 140 por 120 ou 180. Errado.", "Esponja em Áudio · aula 25"], ["Na improbidade, a prescrição é de 8 anos do fato, com intercorrente de 4. No Tema 1.199, o Supremo decidiu que o novo regime de prescrição não retroage, e que a exigência de dolo vale para os processos sem condenação definitiva.", "Esponja em Áudio · aula 25"], ["O ressarcimento por ato doloso de improbidade é imprescritível, Tema 897, mas o ressarcimento fundado apenas em decisão de Tribunal de Contas prescreve, Tema 899.", "Esponja em Áudio · aula 25"]]}, {"n": 12, "nome": "TAC e autocomposição na Administração municipal de Curitiba", "sub": "", "a": [["Primeiro, a base federal. O art. 26 da LINDB autoriza a autoridade a celebrar compromisso com os interessados para eliminar irregularidade, incerteza jurídica ou situação contenciosa: exige oitiva do órgão jurídico e, se for o caso, consulta pública, e só produz efeitos depois da publicação oficial.", "Esponja em Áudio · aula 29"], ["Não pode desonerar permanentemente de dever nem condicionar direito reconhecido por orientação geral. A Lei 13.140 de 2015 autoriza as câmaras de prevenção e resolução de conflitos na Advocacia Pública, e o termo de ajustamento de conduta tem eficácia de título executivo extrajudicial.", "Esponja em Áudio · aula 29"], ["Agora o centro da aula, a Lei Complementar 141 de 2023, de Curitiba. Ela trata dos meios alternativos de solução de litígios, judiciais e extrajudiciais.", "Esponja em Áudio · aula 29"], ["A lei autoriza câmaras de prevenção e resolução administrativa de conflitos na Procuradoria-Geral, com procuradores e servidores com curso de formação específica. Autoriza também súmulas administrativas e pareceres referenciais, que vinculam a Administração.", "Esponja em Áudio · aula 29"], ["O valor é consolidado com IPCA, multa e juros, e cada parcela é atualizada pelo IPCA com juros de 1% ao mês. Atenção ao prazo de revogação.", "Esponja em Áudio · aula 29"], ["A falta de pagamento de qualquer parcela por mais de 60 dias revoga o parcelamento automaticamente, sem notificação. A banca diz que depende de notificação. Errado. O termo traz confissão irrevogável e irretratável do débito.", "Esponja em Áudio · aula 29"], ["Ela interrompe a prescrição, suspende a exigibilidade e importa renúncia a discutir o débito. O acordo não gera novação, art. 8º, e penhoras e garantias ficam à disposição do juízo até o pagamento.", "Esponja em Áudio · aula 29"], ["O desconto especial é gradual e chega a 100% dos juros e da multa moratória, para créditos em atraso há mais de 7 anos ou de devedor em recuperação judicial ou falência. Nunca há desconto sobre o principal.", "Esponja em Áudio · aula 29"], ["Se o Município é devedor, a lei prevê chamamento público ou convite para acordo com deságio mínimo de 20%, e o pagamento se faz por requisição de pequeno valor ou precatório. O deságio de 20% é piso, e não teto. Mais três pontos: a lei admite negócio jurídico processual.", "Esponja em Áudio · aula 29"], ["Na Justiça do Trabalho, quando o Município é responsável subsidiário, Súmula 331 do TST, só há acordo se o devedor principal for insolvente. Quanto às dispensas, pode-se não contestar quando os documentos já comprovam o direito, em perda de objeto e em certas ações de saúde.", "Esponja em Áudio · aula 29"], ["Pode-se não recorrer contra súmula vinculante, súmulas do Supremo e do STJ, controle concentrado, repercussão geral, repetitivos, IRDR e IAC. Dispensa-se propor ação sem elementos no processo administrativo e desistir de execução depois de esgotadas as buscas.", "Esponja em Áudio · aula 29"], ["E dispensa-se o comparecimento a audiências dos Juizados da Fazenda e à do art. 334 do CPC, com petição de desinteresse. O Decreto 2.305 de 2023 trata da transação na dívida ativa. A decisão do Procurador-Geral é fundamentada e irrecorrível. É vedado desconto sobre o principal.", "Esponja em Áudio · aula 29"], ["São irrecuperáveis, entre outros, créditos inscritos há mais de 15 anos e de pessoa jurídica baixada ou inapta. Crédito de baixo valor é o de até dez mil reais por inscrição. O Decreto 868 de 2024 é o regimento da Corregedoria Geral da Procuradoria.", "Esponja em Áudio · aula 29"], ["As penas do processo disciplinar são advertência, repreensão, suspensão de até 90 dias, demissão e cassação de aposentadoria. O processo de responsabilização da Lei Anticorrupção fica fora da Corregedoria. Agora os dois instrumentos consensuais.", "Esponja em Áudio · aula 29"]]}, {"n": 13, "nome": "Licitações: princípios, modalidades e critérios de julgamento (Lei 14.133)", "sub": "", "a": [["O art. 5º traz 21 princípios: além dos constitucionais, como legalidade, impessoalidade, moralidade, publicidade e eficiência, estão lá planejamento, transparência, segregação de funções, vinculação ao edital, julgamento objetivo, segurança jurídica, competitividade, economicidade e desenvolvimento nacional sustentável.", "Esponja em Áudio · aula 33"], ["E o artigo manda aplicar também a LINDB. As fases, no art. 17, são: preparatória, divulgação do edital, apresentação de propostas e lances, julgamento, habilitação, recursal e homologação. Guarde isto: o julgamento vem antes da habilitação. Era o contrário na Lei 8.666.", "Esponja em Áudio · aula 33"], ["A inversão é possível, mas precisa ser motivada e prevista no edital. A forma eletrônica é preferencial, e a presencial exige justificativa e gravação em vídeo. O art. 28 prevê cinco modalidades: pregão, concorrência, concurso, leilão e diálogo competitivo.", "Esponja em Áudio · aula 33"], ["Credenciamento, pré-qualificação, procedimento de manifestação de interesse e sistema de registro de preços são procedimentos auxiliares, e não modalidades. A banca lista como modalidade. Errado.", "Esponja em Áudio · aula 33"], ["O pregão é obrigatório para bens e serviços comuns, aqueles com padrões de desempenho e qualidade objetivamente definidos no edital. O critério é menor preço ou maior desconto.", "Esponja em Áudio · aula 33"], ["O leiloeiro é escolhido por credenciamento ou por pregão, e nesse caso o critério é o maior desconto sobre as comissões. A banca confunde: o critério do leilão é maior lance, e o maior desconto serve para escolher o leiloeiro.", "Esponja em Áudio · aula 33"], ["O diálogo competitivo é para inovação tecnológica ou técnica, ou quando a Administração não consegue definir sozinha a solução. A manifestação de interesse tem 25 dias úteis, e as propostas finais têm no mínimo 60 dias úteis depois do diálogo.", "Esponja em Áudio · aula 33"], ["A comissão tem no mínimo três servidores efetivos ou empregados públicos. A banca troca por comissionados. O art. 33 lista os critérios: menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance, no leilão, e maior retorno econômico.", "Esponja em Áudio · aula 33"], ["Na técnica e preço, a ponderação da técnica pode chegar a 70%. Esse teto vale para a técnica, e não para o preço. Para serviços intelectuais acima de 300 mil reais, a regra é melhor técnica ou técnica e preço. O maior retorno econômico só serve para o contrato de eficiência.", "Esponja em Áudio · aula 33"], ["No julgamento, o modo de disputa fechado isolado é vedado quando o critério é menor preço ou maior desconto, e o modo aberto é vedado na técnica e preço. Em obras e serviços de engenharia, proposta abaixo de 75% do valor orçado é inexequível.", "Esponja em Áudio · aula 33"], ["Os prazos mínimos entre a divulgação e a abertura são: para bens, 8 dias úteis no menor preço ou maior desconto e 15 nos demais; para serviços e obras comuns, 10 dias úteis; para especiais, 25; para técnica e preço, 35; e contratação integrada, 60.", "Esponja em Áudio · aula 33"], ["A habilitação é exigida só do licitante vencedor. A banca diz que é de todos, como na lei antiga. Errado. É vedado exigir faturamento mínimo. O capital ou patrimônio líquido mínimo vai até 10% do valor estimado.", "Esponja em Áudio · aula 33"], ["Atestados de parcelas de maior relevância limitam-se a 4% do valor, e quantidades, até 50%. Qualquer pessoa pode impugnar o edital até 3 dias úteis antes da abertura, e a resposta sai em 3 dias úteis.", "Esponja em Áudio · aula 33"], ["O recurso tem prazo de 3 dias úteis, em fase única, com intenção manifestada imediatamente, e a autoridade decide em 10 dias úteis. Na Lei 8.666 eram 5 dias úteis.", "Esponja em Áudio · aula 33"]]}, {"n": 14, "nome": "Contratação direta e procedimentos auxiliares (Lei 14.133)", "sub": "", "a": [["A regra é licitar, art. 37, inciso 21, da Constituição. A contratação direta é exceção e tem três figuras. Inexigibilidade, art. 74, quando a competição é inviável: dispensa, art. 75, quando a competição seria possível, mas a lei permite não licitar.", "Esponja em Áudio · aula 53"], ["E a licitação dispensada, art. 76, que trata de alienação de bens, não de compras.", "Esponja em Áudio · aula 53"], ["O processo de contratação direta, art. 72, precisa de documento de formalização da demanda, estudo técnico preliminar, análise de riscos, termo de referência, estimativa de despesa, parecer jurídico, compatibilidade orçamentária, razão da escolha do contratado, justificativa de preço e autorização da autoridade.", "Esponja em Áudio · aula 53"], ["O ato que autoriza ou ratifica a contratação direta deve ser divulgado no sítio oficial. Artigo 73: se a contratação direta for indevida, com dolo, fraude ou erro grosseiro, o contratado e o agente público respondem solidariamente pelo dano. A banca diz que basta erro simples. Errado.", "Esponja em Áudio · aula 53"], ["Tem que ser dolo, fraude ou erro grosseiro. Inexigibilidade, art. 74: há inviabilidade de competição, em especial nos cinco casos dos incisos. Um, fornecedor exclusivo: dois, artista consagrado pela crítica ou pela opinião pública.", "Esponja em Áudio · aula 53"], ["O rol do art. 74 é exemplificativo, porque a lei diz em especial: já o rol de dispensa do art. 75 é taxativo. A banca inverte: guarde: inexigibilidade, exemplificativo. Dispensa, taxativo: no inciso três, a Lei 14.133 não exige mais a natureza singular do serviço, que existia na Lei 8.666.", "Esponja em Áudio · aula 53"], ["Exige notória especialização. A banca cobra a singularidade como requisito. Errado. E atenção: a lei veda a inexigibilidade para serviços de publicidade e divulgação. Contratar agência de comunicação por notória especialização é vedado.", "Esponja em Áudio · aula 53"], ["Dispensa por valor, art. 75, incisos um e dois: obras, serviços de engenharia e manutenção de veículos, até cento e trinta mil, novecentos e oitenta e quatro reais e vinte centavos. Demais compras e serviços, até sessenta e cinco mil, quatrocentos e noventa e dois reais e onze centavos.", "Esponja em Áudio · aula 53"], ["O cálculo é por exercício, por unidade gestora e por ramo de atividade, e fracionar o objeto para ficar abaixo do limite é vedado. A banca cita cem mil e cinquenta mil, que são os valores originais. Errado. Outras dispensas: licitação deserta, sem interessados.", "Esponja em Áudio · aula 53"], ["Licitação fracassada, com preços manifestamente superiores ao mercado ou propostas desclassificadas. E emergência ou calamidade, com contrato de até um ano, vedadas a prorrogação e a recontratação da mesma empresa. A banca troca por prorrogável por igual período. Errado.", "Esponja em Áudio · aula 53"], ["Licitação dispensada, art. 76: a alienação exige interesse público justificado e avaliação prévia. Imóveis da administração direta, autarquias e fundações exigem autorização legislativa e, em regra, leilão. Móveis exigem avaliação e leilão, também com dispensas.", "Esponja em Áudio · aula 53"], ["Procedimentos auxiliares, art. 78: são cinco: credenciamento, pré-qualificação, procedimento de manifestação de interesse, sistema de registro de preços e registro cadastral. Não são modalidades de licitação.", "Esponja em Áudio · aula 53"], ["E comércio eletrônico de bens e serviços comuns, no Sistema de Compras Expressas, inciso quatro, incluído pela Lei 15.266 de 2025. Credenciamento não é modalidade e não tem disputa. Sistema de registro de preços, art. 82 a 86. Registrar preço não é contratar.", "Esponja em Áudio · aula 53"], ["O limite é de 50% por órgão aderente, e o dobro no total das adesões.", "Esponja em Áudio · aula 53"]]}, {"n": 15, "nome": "Contratos administrativos: Lei 14.133/2021", "sub": "", "a": [["O art. 89 diz que os contratos regem-se por suas cláusulas e pelo direito público, aplicando-se supletivamente o direito privado: a marca do contrato administrativo é o desequilíbrio jurídico a favor da Administração, compensado pela proteção do equilíbrio econômico-financeiro do contratado.", "Esponja em Áudio · aula 57"], ["O instrumento é obrigatório. O contrato verbal é nulo, salvo a pequena compra de pronto pagamento, até dez mil reais, valor atualizado. A banca diz que o contrato verbal é válido se houver urgência. Errado. A divulgação no Portal Nacional de Contratações Públicas é condição de eficácia do contrato.", "Esponja em Áudio · aula 57"], ["O prazo é de vinte dias úteis na licitação e dez dias úteis na contratação direta. Garantia, art. 96 a 100: quem escolhe a modalidade é o contratado: caução, seguro-garantia ou fiança bancária.", "Esponja em Áudio · aula 57"], ["O limite é de 5% do valor do contrato, podendo chegar a 10%, com justificativa, em obras de alta complexidade. No seguro-garantia de grande vulto, com cláusula de retomada, pode chegar a 30%.", "Esponja em Áudio · aula 57"], ["Prerrogativas, art. 104: a Administração pode modificar e extinguir unilateralmente, fiscalizar, aplicar sanções e ocupar provisoriamente bens e serviços.", "Esponja em Áudio · aula 57"], ["Mas as cláusulas econômico-financeiras não podem ser alteradas sem a concordância do contratado. A banca diz que a Administração altera unilateralmente a remuneração. Errado. Duração: serviços e fornecimentos contínuos podem ter contratos de até cinco anos, prorrogáveis até dez.", "Esponja em Áudio · aula 57"], ["Alteração unilateral, art. 125: o contratado é obrigado a aceitar acréscimos ou supressões de até 25% do valor inicial. Em reforma de edifício ou de equipamento, o acréscimo pode chegar a 50%. Não se pode transfigurar o objeto.", "Esponja em Áudio · aula 57"], ["Alteração por acordo, art. 124: substituir a garantia, mudar o regime de execução ou a forma de pagamento, sem antecipação, e restabelecer o equilíbrio por força maior, fato do príncipe ou fatos imprevisíveis.", "Esponja em Áudio · aula 57"], ["O reequilíbrio se faz no mesmo termo aditivo, e o pedido deve ser feito antes da prorrogação, sob pena de preclusão. Reajuste e repactuação previstos no contrato vão por apostila, e não exigem termo aditivo.", "Esponja em Áudio · aula 57"], ["Acréscimo de objeto exige termo aditivo. A banca diz que o reajuste previsto exige aditivo. Errado. Encargos: só o contratado responde pelos encargos.", "Esponja em Áudio · aula 57"], ["Nos serviços de dedicação exclusiva de mão de obra, a Administração responde subsidiariamente pelos encargos trabalhistas, se houver falha na fiscalização, e solidariamente pelos previdenciários, art. 121. A banca diz que responde solidariamente pelos trabalhistas. Errado.", "Esponja em Áudio · aula 57"], ["O contratado tem direito à extinção em três hipóteses clássicas: suspensão por mais de três meses, atraso de pagamento superior a dois meses e suspensões que somem noventa dias úteis. Não valem mais os cento e vinte e noventa dias da Lei 8.666.", "Esponja em Áudio · aula 57"], ["Se a extinção decorrer de culpa exclusiva da Administração, o contratado recebe a devolução da garantia, os pagamentos pela execução e o custo da desmobilização. Pagamento, art. 141: segue a ordem cronológica de exigibilidade, por fonte de recursos.", "Esponja em Áudio · aula 57"], ["O pagamento antecipado é vedado, salvo se propiciar sensível economia ou for condição indispensável, prevista no edital. A arbitragem é sempre de direito, e pública. A banca diz que pode ser por equidade. Errado.", "Esponja em Áudio · aula 57"]]}]}, {"id": "CON", "nome": "Direito Constitucional", "c": "#43A047", "t": "#E8F5E9", "t2": "#C8E6C9", "d": "#1B5E20", "topicos": [{"n": 1, "nome": "Teoria da Constituição e hermenêutica constitucional", "sub": "", "a": [["Interpretar é atribuir sentido, e não apenas descrever um sentido pronto. A teoria moderna reconhece a pré-compreensão e a subjetividade do intérprete.", "Esponja em Áudio · aula 50"], ["Os princípios de interpretação constitucional são: a unidade da Constituição, que manda harmonizar as normas por interpretação sistemática; a máxima efetividade, que dá à norma o sentido que mais eficácia lhe confira, de modo que nenhuma palavra, inciso ou artigo é supérfluo; a concordância prática, que harmoniza bens em conflito; e a interpretação evolutiva, que lê a Constituição conforme a realidade social e se liga à mutação constitucional, em que muda o sentido, e não o texto.", "Esponja em Áudio · aula 50"], ["Os métodos segundo Canotilho são reciprocamente complementares. Primeiro, o jurídico, ou hermenêutico clássico: a Constituição é lei, e usam-se os elementos gramatical, histórico, sistemático e teleológico.", "Esponja em Áudio · aula 50"], ["Segundo, o tópico-problemático, de Viehweg: parte do problema para a norma, tem caráter prático e vê a Constituição como sistema aberto de regras e princípios.", "Esponja em Áudio · aula 50"], ["Terceiro, o hermenêutico-concretizador, de Hesse: parte da Constituição para o problema e tem como pressuposto o círculo hermenêutico, o movimento de ir e vir entre o subjetivo e o objetivo.", "Esponja em Áudio · aula 50"], ["Quarto, o científico-espiritual, de Smend: não se prende à literalidade e privilegia os valores e a realidade social. Quinto, o normativo-estruturante, de Müller: distingue texto normativo e norma jurídica. Dizer que há identidade entre norma e texto é falso.", "Esponja em Áudio · aula 50"], ["E não inverta o sentido: tópico-problemático vai do problema à norma, e hermenêutico-concretizador vai da Constituição ao problema.", "Esponja em Áudio · aula 50"], ["Já a tese de que o intérprete só subsume o fato a um significado preexistente corresponde à atividade puramente cognoscitiva, à jurisprudência dos conceitos, e é refratária ao realismo jurídico, que vê o direito influenciado pela realidade social e pelas decisões dos tribunais.", "Esponja em Áudio · aula 50"], ["A lógica do razoável, de Recaséns Siches, critica o formalismo e valoriza o caso concreto. A jurisprudência dos interesses, de Heck, afasta o formalismo conceitual. Quanto à origem, a Constituição pode ser outorgada, promulgada, também chamada de democrática ou popular, cesarista ou pactuada.", "Esponja em Áudio · aula 50"], ["A Constituição de 1988 é rígida, e alguns autores a chamam de super-rígida, por causa das cláusulas pétreas. A emenda exige três quintos dos membros de cada Casa, em dois turnos, art. 60, parágrafo segundo. Três quintos, e não dois terços.", "Esponja em Áudio · aula 50"], ["A de eficácia contida tem aplicabilidade imediata, mas o legislador pode restringir o alcance, como no art. 5º, inciso 13. Eficácia contida admite restrição, e não apenas ampliação.", "Esponja em Áudio · aula 50"], ["A de eficácia limitada, ou reduzida, depende de regulamentação futura para ter eficácia plena, e se subdivide em normas de princípio institutivo ou organizativo e normas de princípio programático. A subdivisão é da limitada, e não da contida.", "Esponja em Áudio · aula 50"], ["Sobre o poder constituinte e a guarda da Constituição, o Supremo entende que não há hierarquia entre normas constitucionais originárias, e não admite norma originária inconstitucional, ADI 815, em coerência com a unidade da Constituição.", "Esponja em Áudio · aula 50"], ["O Supremo exerce a guarda da Constituição fiscalizando o poder constituinte derivado, e não o originário, que é juridicamente ilimitado. As cláusulas pétreas limitam o derivado e não servem para declarar inconstitucional norma originária.", "Esponja em Áudio · aula 50"]]}, {"n": 2, "nome": "Poder constituinte e princípios fundamentais: artigos 1º a 4º da CF", "sub": "", "a": [["O poder constituinte originário é inicial, autônomo e incondicionado. Rompe com a ordem anterior e institui novo Estado. É um poder de fato, político, anterior às normas constitucionais.", "Esponja em Áudio · aula 46"], ["Os positivistas o veem como ilimitado, mas os jusnaturalistas dizem que ele encontra limite no direito natural. A banca troca incondicionado por ilimitado absoluto, sem a ressalva doutrinária. Quanto ao direito anterior, as normas infraconstitucionais compatíveis são recebidas, é a recepção.", "Esponja em Áudio · aula 46"], ["Só perdem vigor as incompatíveis. A nova Constituição não revoga automaticamente todas as normas anteriores. O poder constituinte derivado é secundário, de direito, criado pela Constituição, condicionado e limitado.", "Esponja em Áudio · aula 46"], ["Divide-se em reformador, que faz as emendas do art. 60, e decorrente, que elabora as Constituições Estaduais, art. 11 do ADCT e art. 25 da Constituição. Derivado não é incondicionado. E a mutação constitucional é a mudança informal de sentido, sem alterar o texto, ligada ao poder derivado difuso.", "Esponja em Áudio · aula 46"], ["O ADCT é obra do poder constituinte originário, promulgado com a Constituição, com a mesma hierarquia. Ter eficácia temporária não o torna obra do poder derivado. Na questão que caiu, a incorreta era justamente: o ADCT é obra do poder derivado.", "Esponja em Áudio · aula 46"], ["O art. 60 traz quatro tipos de limite: os formais: a emenda pode ser proposta por um terço, no mínimo, dos membros da Câmara ou do Senado, pelo Presidente da República, ou por mais da metade das Assembleias Legislativas, cada uma por maioria relativa.", "Esponja em Áudio · aula 46"], ["A discussão e a votação ocorrem em dois turnos, em cada Casa, com três quintos dos votos, e não dois terços. A promulgação é feita pelas Mesas da Câmara e do Senado, sem sanção nem veto.", "Esponja em Áudio · aula 46"], ["Os circunstanciais: a Constituição não pode ser emendada na vigência de intervenção federal, de estado de defesa ou de estado de sítio.", "Esponja em Áudio · aula 46"], ["Os materiais, que são as cláusulas pétreas, parágrafo quarto: a forma federativa de Estado, o voto direto, secreto, universal e periódico, a separação dos Poderes e os direitos e garantias individuais.", "Esponja em Áudio · aula 46"], ["Os fundamentos da República, art. 1º, são soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa, e pluralismo político. O parágrafo único diz que todo poder emana do povo, que o exerce por meio de representantes eleitos ou diretamente.", "Esponja em Áudio · aula 46"], ["O art. 2º diz que são Poderes da União, independentes e harmônicos entre si, o Legislativo, o Executivo e o Judiciário: o Ministério Público não é Poder.", "Esponja em Áudio · aula 46"], ["Os objetivos, art. 3º, são construir uma sociedade livre, justa e solidária; garantir o desenvolvimento nacional; erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais; e promover o bem de todos, sem preconceitos: erradicar a pobreza é objetivo, e não fundamento.", "Esponja em Áudio · aula 46"], ["O art. 4º traz os princípios das relações internacionais: independência nacional, prevalência dos direitos humanos, autodeterminação dos povos, não intervenção, igualdade entre os Estados, defesa da paz, solução pacífica dos conflitos, repúdio ao terrorismo e ao racismo, cooperação entre os povos e concessão de asilo político.", "Esponja em Áudio · aula 46"], ["O parágrafo único trata da integração da América Latina. A banca mistura fundamento, objetivo e princípio. Soberania é fundamento. Erradicar a pobreza é objetivo. Independência nacional, defesa da paz e repúdio ao terrorismo são princípios do art. 4º.", "Esponja em Áudio · aula 46"]]}, {"n": 3, "nome": "Ações do controle concentrado: ADI, ADC, ADO e ADPF", "sub": "", "a": [["Os legitimados estão no art. 103 da Constituição.", "Esponja em Áudio · aula 42"], ["Os universais, que não precisam demonstrar pertinência temática, são o Presidente da República, a Mesa do Senado, a Mesa da Câmara dos Deputados, o Procurador-Geral da República, o Conselho Federal da OAB e o partido político com representação no Congresso Nacional.", "Esponja em Áudio · aula 42"], ["Os especiais, que precisam demonstrar pertinência temática, são a Mesa de Assembleia Legislativa, o Governador, a confederação sindical e a entidade de classe de âmbito nacional. Federação sindical não tem legitimidade. A banca diz que partido, PGR e Presidente exigem pertinência. Não exigem.", "Esponja em Áudio · aula 42"], ["E troca confederação por federação. Proposta a ADI, não se admite desistência, conforme o art. 5º da Lei 9.868, de 1999. A decisão é irrecorrível, ressalvados os embargos de declaração, e não pode ser objeto de ação rescisória, art. 26.", "Esponja em Áudio · aula 42"], ["Tem eficácia contra todos e efeito vinculante em relação aos demais órgãos do Judiciário e à Administração, art. 28, parágrafo único. O processo é objetivo. Por isso, o prazo recursal em dobro da Fazenda não se aplica, conforme decidiu o Supremo na ADI 5.814.", "Esponja em Áudio · aula 42"], ["Também por isso, a pessoa física não tem representatividade adequada para atuar como amicus curiae, ADI 3.396, agravo regimental. E, no processo objetivo, não há impedimento ou suspeição de ministro, salvo foro íntimo, ADI 6.362.", "Esponja em Áudio · aula 42"], ["Na ADC, a petição inicial deve indicar a existência de controvérsia judicial relevante sobre a aplicação da disposição objeto da ação, art. 14, inciso 3, da Lei 9.868. Sem controvérsia relevante, não há interesse.", "Esponja em Áudio · aula 42"], ["Na ADO, declarada a inconstitucionalidade por omissão, dá-se ciência ao Poder competente para a adoção das providências necessárias. Se for órgão administrativo, o prazo é de 30 dias, ou outro prazo razoável, a ser fixado excepcionalmente pelo Tribunal, art. 12-H, parágrafo primeiro, da Lei 9.868.", "Esponja em Áudio · aula 42"], ["Quando a omissão é do Poder Legislativo, a lei prevê apenas a ciência, embora o Supremo já tenha fixado prazos em casos concretos. A ADPF, Lei 9.882, de 1999, tem os mesmos legitimados da ADI. A decisão é irrecorrível e não cabe ação rescisória. A banca inverte, dizendo que cabe rescisória.", "Esponja em Áudio · aula 42"], ["Não cabe. Admite exame de direito pré-constitucional. Admite omissões do poder público, inclusive o chamado estado de coisas inconstitucional. Admite ataque a conjunto de decisões judiciais reiteradas. A banca diz que não admite omissão. Admite.", "Esponja em Áudio · aula 42"], ["Por outro lado, ela não serve para desconstituir coisa julgada, e não serve para interpretar, revisar ou cancelar súmula vinculante, que tem rito próprio no art. 103-A, parágrafo segundo. É a clássica assertiva incorreta do ENAM. E a violação do preceito fundamental deve ser efetiva.", "Esponja em Áudio · aula 42"], ["Quanto à medida provisória, ela pode ser objeto de ADI. Se for convertida em lei, a ação prossegue se houver continuidade normativa. Se a lei de conversão alterar substancialmente a medida, exige-se aditamento da inicial. Não é automático que haja perda de objeto.", "Esponja em Áudio · aula 42"], ["Lembre ainda que matéria reservada a lei complementar não pode ser tratada por medida provisória, art. 62, parágrafo primeiro, inciso 3, como as áreas de atuação das fundações, no art. 37, inciso 19.", "Esponja em Áudio · aula 42"]]}, {"n": 4, "nome": "Controle difuso, reserva de plenário, modulação, súmula vinculante e controle estadual", "sub": "", "a": [["No controle difuso, ou incidental, qualquer juiz ou tribunal examina a constitucionalidade como questão prejudicial, na causa concreta. Os efeitos, em regra, são entre as partes, e retroativos.", "Esponja em Áudio · aula 38"], ["O controle pode ser
