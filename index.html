 à palavra: o texto fala em alíquotas diferentes. A terceira é a progressividade no tempo, art. 182, parágrafo 4º, inciso 2.", "Esponja em Áudio · aula 11"], ["É extrafiscal, uma sanção ao proprietário de solo urbano não edificado, subutilizado ou não utilizado. Exige plano diretor, lei municipal específica e notificação prévia. O aumento é gradual, por até cinco anos, com alíquota máxima de 15%. Sobre anterioridade, a regra é especial.", "Esponja em Áudio · aula 11"], ["O lançamento do IPTU é de ofício. O Município apura o valor e notifica o contribuinte. A Súmula 397 do STJ diz que o contribuinte do IPTU é notificado do lançamento pelo envio do carnê ao seu endereço. Não é preciso comprovar o recebimento. E a prescrição?", "Esponja em Áudio · aula 11"], ["O prazo é de cinco anos, e o termo inicial é o dia seguinte ao vencimento da cobrança, e não o recebimento do carnê. Esse é um ponto que a banca explora.", "Esponja em Áudio · aula 11"], ["A Súmula Vinculante 52 diz que, ainda que alugado a terceiros, permanece imune o imóvel das entidades do art. 150, inciso 6, alínea c, desde que o valor dos aluguéis seja aplicado nas atividades essenciais da entidade. E o Tema 437 do Supremo trata da imunidade recíproca.", "Esponja em Áudio · aula 11"]]}, {"n": 9, "nome": "ISSQN: LC 116/2003 e LC Municipal 40/2001", "sub": "", "a": [["O fundamento está no art. 156, inciso 3, da Constituição. O ISS incide sobre serviços de qualquer natureza, não compreendidos no ICMS, definidos em lei complementar. A norma geral é a Lei Complementar 116, de 2003, alterada pela Lei Complementar 157, de 2016.", "Esponja em Áudio · aula 15"], ["A lista é taxativa, mas admite interpretação extensiva de seus itens, como decidiu o Supremo no Tema 296. A banca erra nos dois extremos: diz que a lista é exemplificativa, ou que não admite nenhuma interpretação extensiva. A resposta correta é: taxativa, com interpretação extensiva.", "Esponja em Áudio · aula 15"], ["Não incide ISS sobre a exportação de serviços, desde que o resultado não se verifique no Brasil. Atenção: se o serviço é desenvolvido no Brasil e o resultado aqui se verifica, é tributado, ainda que o contratante esteja no exterior. A banca diz que a mera contratação por estrangeiro basta.", "Esponja em Áudio · aula 15"], ["Também não incide sobre serviço prestado em relação de emprego, por trabalhadores avulsos e por diretores e membros de conselhos. E a Súmula Vinculante 31 afasta a incidência sobre a locação de bens móveis, porque locação não é prestação de serviço.", "Esponja em Áudio · aula 15"], ["Quando o serviço envolve fornecimento de mercadoria, a regra é que a lista de serviços prevalece, ressalvadas as exceções expressas. Sobre o leasing, a Súmula 138 do STJ diz que o ISS incide na operação de arrendamento mercantil.", "Esponja em Áudio · aula 15"], ["Sobre serviços bancários da lista, a Súmula 424 do STJ afirma que é legítima a incidência. E o fornecimento de concreto, por empreitada, para construção civil, é serviço sujeito apenas ao ISS, segundo a Súmula 167. As alíquotas são limitadas por lei complementar.", "Esponja em Áudio · aula 15"], ["O máximo é de 5%, conforme o art. 8º da LC 116. O mínimo é de 2%, previsto no art. 88 do ADCT e no art. 8º-A da LC 116, incluído pela LC 157, de 2016.", "Esponja em Áudio · aula 15"], ["A finalidade é combater a guerra fiscal entre Municípios. A banca troca os números, falando em 3%, ou diz que o Município pode conceder isenção que leve a alíquota abaixo do piso. Em Curitiba, a alíquota varia de dois a 5%, conforme o tipo de serviço, segundo o art. 4º da LC 40, de 2001.", "Esponja em Áudio · aula 15"], ["Essa mudança foi questionada no Supremo, na ADI 5835. Por isso, confira o resultado atualizado do julgamento antes da prova, porque é um tema em que a jurisprudência evoluiu. A banca costuma dizer que o ISS é sempre devido no local da prestação, ou sempre no domicílio do tomador.", "Esponja em Áudio · aula 15"], ["8º e 8º-A da LC 40, de 2001, devem reter e recolher o ISS. Em regra, a retenção usa alíquota de 5% sobre o valor do serviço, com hipóteses específicas de dois a 5%.", "Esponja em Áudio · aula 15"], ["O pagamento vence no dia vinte do mês seguinte, por meio do DAM, e a escrituração é feita pelo sistema eletrônico ISS Curitiba. A banca diz que só o prestador pode ser sujeito passivo. É errado: a lei pode atribuir a responsabilidade ao tomador. A base de cálculo é o preço do serviço.", "Esponja em Áudio · aula 15"], ["O STF também decidiu, no Tema 816, que não incide ISS na industrialização por encomenda de bens destinados a etapa seguinte do ciclo produtivo, caso em que incide ICMS. E sobre multa moratória, o Supremo considera confiscatória a que ultrapassa 20% do valor do tributo, nos termos do Tema 214.", "Esponja em Áudio · aula 15"], ["As sociedades de profissionais podem ter o ISS fixo, calculado por profissional habilitado, e não sobre o faturamento, com base no art. 9º, parágrafos 1º e 3º, do Decreto-Lei 406, de 1968. O STJ exige que seja sociedade uniprofissional, de trabalho pessoal dos sócios, sem caráter empresarial.", "Esponja em Áudio · aula 15"], ["Perde o benefício a sociedade que tem natureza empresarial, ou sócio não habilitado. A banca estende o benefício a qualquer sociedade de profissionais.", "Esponja em Áudio · aula 15"]]}, {"n": 10, "nome": "ITBI: hipóteses, imunidades, base de cálculo e sujeição passiva", "sub": "", "a": [["A competência é dos Municípios e do Distrito Federal, art. 156, inciso 2, da Constituição.", "Esponja em Áudio · aula 23"], ["Não incide na transmissão causa mortis nem na doação, que são o ITCMD, imposto estadual. A banca atribui doação e herança ao Município. Errado. Também não incide sobre a hipoteca e outros direitos reais de garantia. A banca costuma incluir a garantia real como fato gerador. Errado.", "Esponja em Áudio · aula 23"], ["O fato gerador ocorre com o registro da transmissão no cartório de imóveis, conforme o art. 1.245 do Código Civil. O contrato de compra e venda, a escritura ou o compromisso sem registro não geram o imposto.", "Esponja em Áudio · aula 23"], ["O Supremo confirmou isso no Tema 1.124. A banca diz que o fato gerador ocorre com o contrato ou com a escritura. É a pegadinha número um do ITBI. Memorize: registro.", "Esponja em Áudio · aula 23"], ["E a competência para o imóvel é do Município da situação do bem, art. 156, parágrafo 2º, inciso 2. A banca diz domicílio do adquirente ou do tabelionato. Errado. A imunidade condicionada está no art. 156, parágrafo 2º, inciso 1.", "Esponja em Áudio · aula 23"], ["Pelo Tema 796 do Supremo, o valor que excede o capital integralizado sofre incidência. Então a imunidade vai só até o valor do capital. Se a pessoa jurídica transfere um imóvel de 1 milhão para integralizar 800 mil de capital, o ITBI incide sobre os 200 mil do excedente.", "Esponja em Áudio · aula 23"], ["E se a atividade preponderante for imobiliária, perde-se a imunidade. Cuidado: uma empresa de locação de automóveis não é imobiliária. Há ainda as imunidades gerais do art. 150, inciso 6: entes federados, templos, partidos e outros.", "Esponja em Áudio · aula 23"], ["A base de cálculo é o valor venal do imóvel ou dos direitos transmitidos, art. 38 do CTN. O Superior Tribunal de Justiça, no Tema 1.113, decidiu que a base é o valor de mercado em condições normais, sem vínculo com a base do IPTU.", "Esponja em Áudio · aula 23"], ["O Município não pode arbitrar previamente a base com valor de referência, nem usar tabela prévia. O valor declarado pelo contribuinte goza de presunção de veracidade, que só se afasta em processo administrativo, art. 148 do CTN.", "Esponja em Áudio · aula 23"], ["O arbitramento cabe quando o valor declarado ou as informações são omissos ou não merecem fé, com processo regular e contraditório. A banca diz que a base é o valor venal do IPTU, ou o valor de referência fixado em decreto. Errado. Também diz que o Município pode fixar a base por pauta. Errado.", "Esponja em Áudio · aula 23"], ["A Súmula 656 do Supremo diz que é inconstitucional a progressividade do ITBI pelo valor venal do imóvel. A banca admite a progressividade pelo valor. Errado. Mas podem existir alíquotas diferentes pela natureza da operação, por exemplo, para financiamento habitacional.", "Esponja em Áudio · aula 23"], ["Em Curitiba, o site da Prefeitura informa 2,7% como alíquota geral, com reduções para imóvel residencial financiado, e guia com vencimento em 30 dias, sem parcelamento. Quanto ao sujeito passivo, o art. 42 do CTN permite à lei eleger qualquer das partes da operação.", "Esponja em Áudio · aula 23"], ["Em regra, o adquirente é o contribuinte, e o transmitente pode responder por lei. O tabelião pode responder se não exigir a prova de pagamento, art. 134, inciso 6, do CTN. A banca diz que só o transmitente, ou só o adquirente, por força do CTN. Errado: quem define é a lei local.", "Esponja em Áudio · aula 23"], ["O ITBI respeita a anterioridade anual e a nonagesimal. A banca diz que escapa da nonagesimal, mas essa é regra da base de cálculo do IPTU. E a restituição do indébito segue o art. 168 do CTN, em 5 anos.", "Esponja em Áudio · aula 23"]]}, {"n": 11, "nome": "Taxas, contribuição de melhoria e COSIP", "sub": "", "a": [["A taxa é tributo vinculado a uma atividade estatal.", "Esponja em Áudio · aula 27"], ["O fato gerador, art. 145, inciso 2, da Constituição, e art. 77 a 80 do Código Tributário, é o exercício regular do poder de polícia ou a utilização, efetiva ou potencial, de serviço público específico e divisível, prestado ao contribuinte ou posto à sua disposição: específico é o serviço com destinatário determinado.", "Esponja em Áudio · aula 27"], ["O Supremo declarou inconstitucional a taxa de combate a incêndios, no Tema 16. A banca diz que serviço essencial pode ser taxado. Errado. O que importa é a divisibilidade.", "Esponja em Áudio · aula 27"], ["A taxa não pode ter base de cálculo própria de imposto, art. 145, parágrafo 2º, nem ser calculada em função do capital das empresas, art. 77 do Código Tributário.", "Esponja em Áudio · aula 27"], ["Mas a Súmula Vinculante 29 permite usar um ou mais elementos da base de um imposto, desde que não haja identidade integral entre as bases. A Súmula Vinculante 19 admite a taxa cobrada exclusivamente pela coleta, remoção e tratamento do lixo domiciliar.", "Esponja em Áudio · aula 27"], ["Na taxa de polícia, o Supremo, no Tema 217, decidiu que a taxa de renovação de licença de funcionamento é constitucional se o Município mantém órgão e estrutura em efetivo funcionamento. Não precisa fiscalizar individualmente cada estabelecimento. A banca diz que basta existir a lei. Errado.", "Esponja em Áudio · aula 27"], ["Outras súmulas: a Súmula 667 do Supremo: viola o acesso à Justiça a taxa judiciária calculada sem limite sobre o valor da causa. Custas e emolumentos são taxas. E a Súmula Vinculante 12 proíbe taxa de matrícula em universidade pública. A taxa é compulsória e depende de lei.", "Esponja em Áudio · aula 27"], ["A tarifa, ou preço público, é facultativa e contratual. É a Súmula 545 do Supremo. A tarifa de transporte e o pedágio têm natureza de preço público. A banca diz que são taxas. Errado.", "Esponja em Áudio · aula 27"], ["A imunidade recíproca, art. 150, inciso 6, alcança impostos: não alcança taxas. A banca diz que o ente público não paga taxa. Errado. E a natureza do tributo se define pelo fato gerador, sendo irrelevante a denominação ou a destinação do produto, art. 4º do Código Tributário.", "Esponja em Áudio · aula 27"], ["O art. 82 do Código Tributário exige edital prévio, com memorial descritivo, orçamento do custo, parcela a financiar, delimitação da zona beneficiada, fator de absorção da valorização e prazo mínimo de 30 dias para impugnação: sem o edital, o lançamento é nulo. A banca diz 15 dias. Errado.", "Esponja em Áudio · aula 27"], ["A competência é do ente que realiza a obra. A COSIP está no art. 149-A da Constituição, incluído pela Emenda 39. Municípios e Distrito Federal podem instituí-la, por lei, para custear o serviço de iluminação pública, observadas a legalidade e a anterioridade, inclusive a noventena.", "Esponja em Áudio · aula 27"], ["Pode ser cobrada na fatura de energia elétrica. A Emenda 132 ampliou a finalidade para expansão, melhoria e sistemas de monitoramento para segurança de logradouros. A Súmula Vinculante 41 proíbe a taxa de iluminação pública, porque o serviço é indivisível.", "Esponja em Áudio · aula 27"], ["A COSIP é uma contribuição sui generis, e o Supremo a considerou constitucional, no Tema 7, admitindo alíquotas progressivas conforme o consumo. Em Curitiba, a COSIP segue a Lei Complementar 46, de 2002, alterada pela Lei Complementar 129, de 2021. O contribuinte é o consumidor de energia elétrica.", "Esponja em Áudio · aula 27"], ["O valor é a alíquota da faixa de consumo sobre a TEIP, com teto de 10% da fatura. Residências com consumo de até 100 quilowatts-hora por mês são isentas. Confira o texto vigente, Doutor.", "Esponja em Áudio · aula 27"]]}, {"n": 12, "nome": "Administração tributária, dívida ativa e garantias do crédito", "sub": "", "a": [["Na fiscalização, a legislação tributária vale para todas as pessoas, inclusive imunes e isentas, quanto às obrigações acessórias. Livros e documentos devem ser conservados até a prescrição dos créditos. A autoridade lavra o termo de início de fiscalização, que afasta a denúncia espontânea.", "Esponja em Áudio · aula 31"], ["O sigilo fiscal, art. 198, veda a divulgação de informação sobre a situação econômica ou financeira do sujeito passivo: as exceções são requisição judicial, solicitação de autoridade administrativa em processo para apurar infração, representações fiscais para fins penais, inscrições em dívida ativa e parcelamento ou moratória. A banca diz que a inscrição em dívida ativa viola o sigilo. Errado.", "Esponja em Áudio · aula 31"], ["O fisco pode acessar dados bancários sem ordem judicial, o que o Supremo validou na ADI 2.859 e no Tema 225. Há transferência de sigilo, e não quebra. A dívida ativa tributária é a dívida regularmente inscrita depois de esgotado o prazo de pagamento.", "Esponja em Áudio · aula 31"], ["A presunção de certeza e liquidez é relativa, e só cai com prova inequívoca do sujeito passivo ou de terceiro. A banca diz absoluta. Errado. A nulidade por erro ou omissão pode ser sanada até a decisão de primeira instância.", "Esponja em Áudio · aula 31"], ["Pela Súmula 392 do STJ, a CDA pode ser substituída até a sentença dos embargos para corrigir erro material ou formal, mas nunca para mudar o sujeito passivo.", "Esponja em Áudio · aula 31"], ["Pela Súmula 558, a petição inicial não é indeferida por falta de pedido de citação ou de provas, e, pela Súmula 559, não precisa de demonstrativo de cálculo. A dívida ativa não tributária inclui multas, foros, indenizações e restituições, art. 2º da Lei de Execução Fiscal.", "Esponja em Áudio · aula 31"], ["O protesto da CDA é constitucional, ADI 5.135. Mas são vedadas sanções políticas, como interdição de estabelecimento ou apreensão de mercadorias, Súmulas 70, 323 e 547 do Supremo. Sobre as certidões, a negativa sai em 10 dias.", "Esponja em Áudio · aula 31"], ["A positiva com efeitos de negativa vale quando há crédito não vencido, execução com penhora efetivada ou exigibilidade suspensa. O servidor que expede certidão com dolo ou fraude responde pessoalmente pelo crédito, art. 208.", "Esponja em Áudio · aula 31"], ["A fraude à execução fiscal, art. 185 do CTN, presume-se na alienação por devedor com crédito já inscrito em dívida ativa, sem exigir registro da penhora, como decidiu o STJ no recurso repetitivo 1.141.990.", "Esponja em Áudio · aula 31"], ["Só se afasta se o devedor reservou bens suficientes. Cuidado, no processo civil comum a regra é diferente: exige registro da penhora ou má-fé do terceiro, Súmula 375.", "Esponja em Áudio · aula 31"], ["O art. 185-A permite a indisponibilidade de bens do devedor citado que não paga nem indica bens: quanto às preferências, o crédito tributário prefere a qualquer outro, ressalvados os créditos trabalhistas e os de acidente de trabalho.", "Esponja em Áudio · aula 31"], ["A cobrança judicial da dívida ativa não se sujeita a concurso de credores nem a habilitação em falência, recuperação, inventário ou arrolamento. A ordem entre União, Estados e Municípios foi afastada pelo Supremo na ADPF 357, que invalidou a Súmula 563.", "Esponja em Áudio · aula 31"], ["Em Curitiba, a Lei Orgânica dá à Procuradoria a competência exclusiva para cobrar a dívida ativa, judicial e extrajudicialmente. Pela Lei Complementar 40 de 2001, o atraso gera atualização monetária, juros e multa moratória de 0,33% ao dia, limitada a 10%.", "Esponja em Áudio · aula 31"], ["A autoridade pode conceder desconto de até 20% para o pagamento integral no prazo, ou parcelamento em até 10 cotas, de pelo menos 20 reais cada. O parcelamento é revogado pela falta de qualquer parcela, ou de imposto de fato gerador posterior. É vedada a antecipação do IPTU antes do exercício.", "Esponja em Áudio · aula 31"]]}, {"n": 13, "nome": "Processo administrativo tributário de Curitiba: lançamento, revisão, JJT, CMC, CRT e consulta", "sub": "", "a": [["Antes, o CTN: o lançamento é atividade vinculada e obrigatória, privativa da autoridade administrativa, art. 142.", "Esponja em Áudio · aula 35"], ["Depois de notificado, só pode ser alterado por impugnação, recurso de ofício ou iniciativa de ofício nos casos do art. 149, enquanto não extinto o direito da Fazenda. A banca chama de ato discricionário. Errado. Mudança de critério jurídico só vale para fatos geradores posteriores, art. 146.", "Esponja em Áudio · aula 35"], ["E pela Súmula 622 do STJ, a notificação do auto de infração faz cessar a contagem da decadência. Durante a impugnação e os recursos, a exigibilidade fica suspensa, art. 151, inciso 3. A prescrição só começa quando a decisão administrativa se torna definitiva.", "Esponja em Áudio · aula 35"], ["A impugnação tem prazo de 30 dias, e é julgada em primeira instância pela Junta de Julgamento Tributário, a JJT. Segundo o Decreto 502 de 2018, a Junta tem no máximo 5 membros, estáveis, da carreira de Auditor Fiscal.", "Esponja em Áudio · aula 35"], ["O mandato é de 1 ano, a distribuição é por sorteio, as sessões são semanais e presenciais, o quórum é de 3 membros e a abstenção é vedada. A súmula da Junta exige unanimidade e ratificação do Secretário. A banca troca Auditores por Procuradores, ou o mandato de 1 ano por 2.", "Esponja em Áudio · aula 35"], ["Da decisão da Junta cabe recurso voluntário ao Conselho Municipal de Contribuintes, em 30 dias, com efeito suspensivo e devolutivo. Não se exige depósito nem arrolamento prévio. A Súmula Vinculante 21 e a Súmula 373 do STJ vedam essa exigência. A banca ainda cobra depósito de 30%.", "Esponja em Áudio · aula 35"], ["Há reexame necessário quando a decisão desfavorável à Fazenda superar 25 mil reais no ISS ou 10 mil reais nos demais tributos. A banca inverte os valores.", "Esponja em Áudio · aula 35"], ["Está impedido o conselheiro que participou da instrução ou do julgamento de primeira instância. A distribuição prioriza sujeitos passivos com 60 anos ou mais e créditos de 500 mil reais no ISS ou 50 mil reais no IPTU e outros.", "Esponja em Áudio · aula 35"], ["Perde o mandato quem retém processo por mais de 60 dias, falta a 3 sessões consecutivas sem justificativa ou deixa de apresentar processos por 3 sessões. A instância especial é a Comissão de Recursos Tributários, a CRT, Decreto 824 de 2002.", "Esponja em Áudio · aula 35"], ["Ela julga recurso dos representantes da Fazenda, e só deles, contra decisão não unânime do Conselho ou ementa que não reflita os fundamentos da decisão.", "Esponja em Áudio · aula 35"], ["O contribuinte não recorre à CRT. A banca inverte: a CRT é formada pelo Procurador-Geral, pelo Secretário de Finanças e pelo Presidente do Conselho. O contribuinte tem 30 dias para contrarrazões, e o relator tem 30 dias para o voto.", "Esponja em Áudio · aula 35"], ["Não se conhece do recurso intempestivo, interposto contra decisão unânime ou sem contrariedade à lei e à evidência das provas. A decisão por equidade dispensa apenas os acréscimos legais, e não a atualização monetária nem o tributo.", "Esponja em Áudio · aula 35"], ["A ação judicial com o mesmo objeto importa renúncia ou desistência da via administrativa. Os prazos são contínuos. E podem ser cancelados débitos de até 135 reais.", "Esponja em Áudio · aula 35"], ["A consulta, art. 112 a 114, tem resposta vinculante para a Administração: pelo Decreto 825 de 2002, a Comissão de Consultas tem 4 membros, é presidida pelo Procurador-Chefe do Núcleo de Assuntos Jurídicos da Secretaria de Finanças, e decide com voto de 3 membros.", "Esponja em Áudio · aula 35"]]}, {"n": 14, "nome": "Execução fiscal: Lei 6.830/1980", "sub": "", "a": [["O art. 2º, parágrafo quinto, lista o conteúdo: devedor e corresponsáveis, valor originário, termo inicial e forma de cálculo de juros e correção, origem e natureza, dispositivo legal, data e número da inscrição.", "Esponja em Áudio · aula 55"], ["A petição inicial indica só o juiz, o pedido e o requerimento de citação, instruída com a CDA. O valor da causa é o da dívida. Citação, art. 8º: o executado é citado para pagar em cinco dias ou garantir a execução. A citação é pelo correio, com aviso de recepção.", "Esponja em Áudio · aula 55"], ["Pela súmula 414 do STJ, a citação por edital só cabe depois de esgotados os outros meios. A banca diz que cabe de imediato. Errado. Garantia, art. 9º: depósito em dinheiro, fiança bancária, seguro garantia, nomeação de bens ou bens de terceiros aceitos pela Fazenda.", "Esponja em Áudio · aula 55"], ["A ordem de penhora, art. 11, começa por dinheiro, depois títulos, pedras e metais preciosos, imóveis, navios e aeronaves, veículos, móveis e semoventes, e direitos e ações. A Fazenda pode pedir a qualquer tempo a substituição, independentemente da ordem.", "Esponja em Áudio · aula 55"], ["O executado só pode substituir por depósito, fiança ou seguro garantia. A súmula 406 do STJ permite à Fazenda recusar a substituição por precatório. Embargos, art. 16: prazo de trinta dias, contado do depósito, da juntada da fiança ou do seguro, ou da intimação da penhora.", "Esponja em Áudio · aula 55"], ["Só se admitem depois de garantida a execução. Não cabem reconvenção nem compensação. A Fazenda impugna em trinta dias. A banca confunde com os quinze dias da impugnação ao cumprimento de sentença, ou com os cinco dias para pagar. Errado.", "Esponja em Áudio · aula 55"], ["Sem garantia, a defesa é por exceção de pré-executividade, só para matéria de ordem pública sem dilação probatória, súmula 393 do STJ.", "Esponja em Áudio · aula 55"], ["A Fazenda pode substituir ou emendar a CDA até a sentença dos embargos, para corrigir erro formal ou material, mas não pode mudar o sujeito passivo, súmula 392 do STJ. Fase final: o terceiro garantidor tem quinze dias para remir o bem ou pagar a dívida.", "Esponja em Áudio · aula 55"], ["Artigo 26: se a inscrição for cancelada antes da decisão de primeiro grau, a execução é extinta sem ônus. Mas, pela súmula 153 do STJ, o cancelamento depois dos embargos não exime a Fazenda da sucumbência.", "Esponja em Áudio · aula 55"], ["Artigo 38: a discussão judicial da dívida se faz em execução, salvo mandado de segurança, repetição de indébito ou ação anulatória. O depósito preparatório na anulatória foi afastado pela Súmula Vinculante 28.", "Esponja em Áudio · aula 55"], ["A Fazenda tem isenção de custas, mas antecipa as despesas do oficial de justiça, súmula 190 do STJ. Execuções de baixo valor. O STF, no tema 1.184, admitiu a extinção por falta de interesse de agir, exigindo antes tentativa de conciliação ou solução administrativa e protesto da CDA.", "Esponja em Áudio · aula 55"], ["Confira a tese antes da prova. Redirecionamento: o sócio só responde nos casos do art. 135 do CTN, e a dissolução irregular autoriza o redirecionamento, súmula 435 do STJ.", "Esponja em Áudio · aula 55"], ["Nos grupos econômicos, a necessidade do incidente de desconsideração da personalidade jurídica está afetada no Tema 1.209 do STJ, ainda sem tese.", "Esponja em Áudio · aula 55"], ["A primeira Turma admite o incidente para grupo econômico fora da certidão e dos art. 134 e 135, e a segunda Turma o considera desnecessário. A banca que afirmar que o incidente é sempre necessário erra.", "Esponja em Áudio · aula 55"]]}, {"n": 15, "nome": "Embargos, exceção, redirecionamento e prescrição intercorrente", "sub": "", "a": [["Embargos à execução fiscal: prazo de trinta dias, exigem garantia e não admitem reconvenção nem compensação. Não suspendem a execução automaticamente.", "Esponja em Áudio · aula 59"], ["O efeito suspensivo exige garantia, relevância da fundamentação e perigo de dano, conforme o Tema 526 do STJ. A banca diz que os embargos sempre suspendem a execução. Errado.", "Esponja em Áudio · aula 59"], ["Exceção de pré-executividade: cabe sem garantia, só para matéria de ordem pública que não exija dilação probatória, súmula 393 do STJ. Prescrição do crédito tributário: cinco anos da constituição definitiva.", "Esponja em Áudio · aula 59"], ["Interrompe-se pelo despacho do juiz que ordena a citação, e não pela citação pessoal, desde a Lei Complementar 118 de 2005.", "Esponja em Áudio · aula 59"], ["Novidade, Doutor: a Lei Complementar 236 de 2026 deu nova redação ao art. 174 do Código Tributário Nacional e acrescentou marcos interruptivos, como mediação, arbitragem especial, sentença de extinção por não localização, falência e execução fiscal extrajudicial.", "Esponja em Áudio · aula 59"], ["Provas antigas trazem o art. 174 com só quatro incisos. Leia o enunciado e veja a data da prova. Artigo 40 da Lei 6.830. Não localizados o devedor ou bens penhoráveis, o juiz suspende a execução por um ano, sem curso de prescrição.", "Esponja em Áudio · aula 59"], ["Findo o ano, os autos vão ao arquivo e começa o prazo de cinco anos da prescrição intercorrente. A súmula 314 do STJ diz isso. O juiz pode reconhecer de ofício, ouvida a Fazenda. Tema 566 do STJ.", "Esponja em Áudio · aula 59"], ["O prazo de um ano de suspensão começa automaticamente na data da ciência da Fazenda sobre a não localização do devedor ou de bens. Não depende de despacho do juiz. Só a citação e a penhora efetivas interrompem o prazo. Petições que não resultam em localização de bens não bastam.", "Esponja em Áudio · aula 59"], ["E o ano de suspensão não conta para a prescrição: depois dele corre o quinquênio, de modo que o prazo total é de seis anos. A banca diz que a prescrição corre durante o ano de suspensão, ou que o prazo total é de cinco anos. Errado. A banca também pode dizer que o prazo só começa com despacho de arquivamento.", "Esponja em Áudio · aula 59"], ["Errado, por causa do Tema 566. Redirecionamento: o mero inadimplemento não basta, súmula 430. A dissolução irregular autoriza o redirecionamento, súmula 435, presumida quando a empresa deixa de funcionar no domicílio fiscal sem comunicar.", "Esponja em Áudio · aula 59"], ["Tema 981: responde o administrador da época da dissolução irregular, mesmo que não gerisse a empresa no fato gerador. Tema 962: quem se retirou regularmente antes da dissolução não responde.", "Esponja em Áudio · aula 59"], ["Tema 103: se o nome do sócio consta da certidão de dívida ativa, o ônus de provar que não agiu com excesso é dele. Se não consta, o ônus é da Fazenda. Tema 444: o prazo para redirecionar é de cinco anos da citação da pessoa jurídica, se a dissolução for anterior, exigida inércia da Fazenda.", "Esponja em Áudio · aula 59"], ["Incidente de desconsideração da personalidade jurídica. O Tema 1.209 do STJ, que trata da compatibilidade do incidente com a execução fiscal, está afetado e ainda sem tese. A primeira Turma admite o incidente para grupo econômico fora da certidão.", "Esponja em Áudio · aula 59"], ["A segunda Turma o considera desnecessário. A banca que afirma certeza absoluta, num sentido ou outro, erra.", "Esponja em Áudio · aula 59"]]}]}, {"id": "PCV", "nome": "Processo Civil", "c": "#1E88E5", "t": "#E3F2FD", "t2": "#BBDEFB", "d": "#0D47A1", "topicos": [{"n": 1, "nome": "Teoria geral do processo e normas fundamentais: CPC, artigos 1º a 15", "sub": "", "a": [["O art. 1º diz que o processo civil será ordenado, disciplinado e interpretado conforme os valores e as normas fundamentais estabelecidos na Constituição: a banca diz que a Constituição só vale subsidiariamente. Errado.", "Esponja em Áudio · aula 52"], ["O art. 2º diz que o processo começa por iniciativa da parte e se desenvolve por impulso oficial, salvo as exceções previstas em lei: o art. 3º trata da inafastabilidade: não se excluirá da apreciação jurisdicional ameaça ou lesão a direito.", "Esponja em Áudio · aula 52"], ["Está expressa na Constituição, art. 5º, inciso 35, e no CPC. Dizer que é implícita na Constituição é errado. O parágrafo primeiro permite a arbitragem, na forma da lei. O parágrafo segundo diz que o Estado promoverá, sempre que possível, a solução consensual dos conflitos.", "Esponja em Áudio · aula 52"], ["A justiça multiportas é o sistema que aceita a arbitragem, a mediação e outros meios, além do Judiciário. Sua base normativa é o CPC, a Resolução 125 de 2010 do CNJ e a Lei 13.140, de 2015.", "Esponja em Áudio · aula 52"], ["O art. 4º garante a duração razoável do processo, incluída a atividade satisfativa: o art. 5º exige boa-fé de todo aquele que participa do processo, o juiz inclusive.", "Esponja em Áudio · aula 52"], ["O art. 6º prevê a cooperação entre todos os sujeitos do processo, o juiz inclusive, para que se obtenha, em tempo razoável, decisão de mérito justa e efetiva: o art. 7º garante a paridade de tratamento.", "Esponja em Áudio · aula 52"], ["E o art. 8º manda atender, na aplicação do ordenamento, aos fins sociais e às exigências do bem comum, resguardando e promovendo a dignidade da pessoa humana e observando a proporcionalidade, a razoabilidade, a legalidade, a publicidade e a eficiência: cooperação, lealdade e boa-fé não são normas meramente programáticas.", "Esponja em Áudio · aula 52"], ["Pelo art. 9º, não se proferirá decisão contra uma parte sem que ela seja previamente ouvida: as exceções do parágrafo único são: a tutela provisória de urgência; as hipóteses de tutela da evidência previstas no art. 311, incisos 2 e 3; e a decisão que defere o mandado monitório, art. 701. Atenção: o inciso 1 do art. 311, abuso do direito de defesa ou manifesto propósito protelatório, não dispensa a oitiva prévia.", "Esponja em Áudio · aula 52"], ["A prescrição e a decadência só são reconhecidas depois de ouvidas as partes, art. 487, parágrafo único, ressalvada a improcedência liminar, art. 332, parágrafo primeiro. O contraditório é substancial: é a ciência, a reação e o poder de influenciar a decisão, e não mera formalidade.", "Esponja em Áudio · aula 52"], ["O juiz pode determinar prova de ofício, art. 370, mas o poder instrutório não se sobrepõe ao contraditório, e a busca da verdade real não o justifica.", "Esponja em Áudio · aula 52"], ["Nomear novo perito sem intimar as partes, sem lhes dar chance de formular quesitos e acompanhar a perícia, art. 465, parágrafo primeiro, viola os art. 9º e 10 e o devido processo legal. A sentença que se apoia nessa prova é nula.", "Esponja em Áudio · aula 52"], ["O art. 12 diz que os juízes e os tribunais atenderão, preferencialmente, à ordem cronológica de conclusão para proferir sentença ou acórdão, na redação da Lei 13.256. Preferencialmente, e não obrigatoriamente.", "Esponja em Áudio · aula 52"], ["O art. 13 diz que a jurisdição civil é regida pelas normas processuais brasileiras, ressalvadas as disposições específicas previstas em tratados, convenções ou acordos internacionais de que o Brasil seja parte: o art. 14 diz que a norma processual não retroagirá e será aplicável imediatamente aos processos em curso, respeitados os atos processuais praticados e as situações jurídicas consolidadas sob a vigência da norma revogada.", "Esponja em Áudio · aula 52"], ["O art. 15 diz que, na ausência de normas que regulem processos eleitorais, trabalhistas ou administrativos, as disposições do CPC lhes serão aplicadas supletiva e subsidiariamente: alcança o processo administrativo, mas não o processo penal.", "Esponja em Áudio · aula 52"]]}, {"n": 2, "nome": "Jurisdição, competência e ação no CPC", "sub": "", "a": [["Para postular em juízo é preciso ter interesse e legitimidade, art. 17. Ninguém pode pleitear direito alheio em nome próprio, salvo quando autorizado pelo ordenamento jurídico, que é a substituição processual, art. 18. Interesse econômico, por si, não basta.", "Esponja em Áudio · aula 48"], ["O interesse pode limitar-se à declaração da existência, da inexistência ou do modo de ser de uma relação jurídica, ou da autenticidade ou falsidade de documento, art. 19, inclusive em ação autônoma. E a declaratória é admissível ainda que tenha ocorrido a violação do direito, art. 20.", "Esponja em Áudio · aula 48"], ["A jurisdição civil é exercida pelos juízes e tribunais em todo o território nacional, art. 16. As causas são decididas pelo juiz nos limites da competência, ressalvada a arbitragem, art. 42.", "Esponja em Áudio · aula 48"], ["O art. 3º, parágrafo primeiro, permite a arbitragem: a convenção de arbitragem deve ser alegada em contestação e o juiz não a conhece de ofício. Se o réu não alega, aceita a jurisdição estatal e renuncia ao juízo arbitral, art. 337, inciso 10, e parágrafos quinto e sexto.", "Esponja em Áudio · aula 48"], ["A administração pública pode arbitrar direitos patrimoniais disponíveis, Lei 9.307, art. 1º, parágrafo primeiro. A sentença arbitral dispensa homologação e é título executivo judicial, art. 31 da Lei 9.307 e art. 515, inciso 7, do CPC.", "Esponja em Áudio · aula 48"], ["A inafastabilidade, art. 5º, inciso 35, da Constituição, não é excluída por lei: a jurisdição voluntária está nos art. 719 a 725. O procedimento começa por provocação do interessado, do Ministério Público ou da Defensoria Pública, art. 720. A banca diz só por provocação do interessado.", "Esponja em Áudio · aula 48"], ["Falso: citam-se todos os interessados e intima-se o Ministério Público nos casos do art. 178, inclusive quando houver notícia de doença psíquica grave, ainda sem declaração de incapacidade, art. 721. Não cabe reconvenção, porque não há lide.", "Esponja em Áudio · aula 48"], ["O juiz não está sujeito ao critério de legalidade estrita, podendo adotar em cada caso a solução que considerar mais conveniente ou oportuna, art. 723, parágrafo único. E a decisão pode ser modificada por circunstâncias supervenientes, sem prejuízo dos efeitos já produzidos.", "Esponja em Áudio · aula 48"], ["A competência absoluta, em razão da matéria, da pessoa ou da função, é inderrogável por convenção das partes, art. 62, pode ser alegada em qualquer tempo e grau de jurisdição e deve ser declarada de ofício, art. 64, parágrafo primeiro.", "Esponja em Áudio · aula 48"], ["A relativa, em razão do valor e do território, admite eleição de foro, art. 63, e deve ser alegada na contestação, sob pena de prorrogação, art. 65. A Súmula 33 do Superior Tribunal de Justiça diz que a incompetência relativa não pode ser declarada de ofício.", "Esponja em Áudio · aula 48"], ["A exceção é a cláusula de eleição de foro abusiva, que o juiz pode reputar ineficaz antes da citação, art. 63, parágrafo terceiro. Quanto ao foro, a regra geral é o domicílio do réu, art. 46, nas ações fundadas em direito pessoal ou real sobre bens móveis.", "Esponja em Áudio · aula 48"], ["No art. 53, as ações de alimentos correm no foro do domicílio ou da residência do alimentando, e a reparação de dano por delito ou acidente de veículos, no foro do domicílio do autor ou do local do fato: quando a União é ré, art. 51, parágrafo único, o autor pode propor no seu domicílio, no local do ato ou fato, no da situação da coisa ou no Distrito Federal.", "Esponja em Áudio · aula 48"], ["São quatro foros, e não só o Distrito Federal. A conexão, art. 55, existe quando duas ou mais ações têm em comum o pedido ou a causa de pedir: os processos serão reunidos para decisão conjunta, salvo se um deles já foi sentenciado, parágrafo primeiro, e Súmula 235 do Superior Tribunal de Justiça.", "Esponja em Áudio · aula 48"], ["A continência, art. 56, ocorre entre duas ou mais ações quando há identidade quanto às partes e à causa de pedir, mas o pedido de uma, por ser mais amplo, abrange o das demais: a litispendência exige que partes, causa de pedir e pedido sejam idênticos, art. 337, parágrafo segundo.", "Esponja em Áudio · aula 48"]]}, {"n": 3, "nome": "Sujeitos do processo, litisconsórcio, intervenção de terceiros e desconsideração da personalidade jurídica", "sub": "", "a": [["O litisconsórcio necessário está nos art. 114 e 115 do CPC. Ele existe quando a eficácia da sentença depende da citação de todos. Se faltar litisconsorte, o juiz determina ao autor que requeira a citação, em prazo, sob pena de extinção do processo, art. 115, parágrafo único.", "Esponja em Áudio · aula 44"], ["O juiz não inclui o litisconsorte de ofício. Um exemplo cobrado em prova é a ação de despejo contra apenas um dos colocatários. A banca oferece litisconsórcio facultativo, ou inclusão de ofício. As duas estão erradas.", "Esponja em Áudio · aula 44"], ["No art. 109, a alienação da coisa litigiosa não altera a legitimidade das partes: o adquirente só sucede o alienante com o consentimento da parte contrária.", "Esponja em Áudio · aula 44"], ["Sem ele, o adquirente pode ingressar no processo como assistente litisconsorcial do alienante, e o alienante passa a ser substituto processual do adquirente. A banca diz que o adquirente vira substituto, ou amicus. Errado. No chamamento ao processo, art. 130, o réu chama outros coobrigados.", "Esponja em Áudio · aula 44"], ["É cabível, entre outros casos, contra o afiançado, na ação em que o fiador for réu, e contra os demais fiadores e os demais devedores solidários. Fiador demandado: chamamento ao processo. Não é denunciação, nem oposição, nem desconsideração.", "Esponja em Áudio · aula 44"], ["A denunciação da lide, art. 125, serve para exercer direito de regresso decorrente de lei ou contrato.", "Esponja em Áudio · aula 44"], ["E a oposição, art. 682, é a ação de quem pretende, no todo ou em parte, a coisa ou o direito sobre o que controvertem autor e réu: o amicus curiae, art. 138, é admitido pelo juiz ou pelo relator, de ofício, ou a requerimento das partes ou de quem queira manifestar-se, considerando a relevância da matéria, a especificidade do tema e a repercussão social da controvérsia.", "Esponja em Áudio · aula 44"], ["Pode ser pessoa natural ou jurídica, órgão ou entidade especializada, com representatividade adequada. Cabe em qualquer grau. A decisão que o admite é irrecorrível, cabendo apenas embargos de declaração.", "Esponja em Áudio · aula 44"], ["E a intervenção não altera a competência, mesmo quando o amicus for ente federal. A banca diz que desloca para a Justiça Federal. Não desloca. E diz que cabe agravo. Não cabe. O incidente de desconsideração da personalidade jurídica, o IDPJ, está nos art. 133 a 137.", "Esponja em Áudio · aula 44"], ["Pode ser requerido em qualquer fase, inclusive no cumprimento de sentença e na execução. Aplica-se também à desconsideração inversa. A instauração suspende o processo, art. 134, parágrafo terceiro, salvo se requerida já na petição inicial.", "Esponja em Áudio · aula 44"], ["O sócio ou a pessoa jurídica é citado para se manifestar e requerer as provas cabíveis no prazo de 15 dias, art. 135. A banca diz 3 dias. Errado. A decisão é interlocutória: cabe agravo de instrumento, art. 1.015, inciso 4, ou agravo interno se for decisão do relator. Não cabe apelação.", "Esponja em Áudio · aula 44"], ["Acolhido o pedido, a alienação ou a oneração de bens, havida em fraude de execução, é ineficaz em relação ao requerente, art. 137. Ineficaz, e não nula. O marco é a citação da parte cuja personalidade se pretende desconsiderar, art. 792, parágrafo terceiro.", "Esponja em Áudio · aula 44"], ["No Código de Defesa do Consumidor, art. 28, parágrafo quinto, adota-se a teoria menor: basta que a personalidade seja obstáculo ao ressarcimento dos prejuízos, sem prova de abuso.", "Esponja em Áudio · aula 44"], ["A teoria maior, do Código Civil, art. 50, exige desvio de finalidade ou confusão patrimonial. A banca troca uma pela outra. Revisão: litisconsórcio necessário: o juiz manda citar, não inclui de ofício. Sem consentimento, o adquirente é assistente. Fiador: chamamento.", "Esponja em Áudio · aula 44"]]}, {"n": 4, "nome": "Fazenda Pública em juízo: prazos e remessa necessária", "sub": "", "a": [["O art. 183 do CPC dá à União, aos Estados, ao Distrito Federal, aos Municípios e às suas autarquias e fundações de direito público prazo em dobro para todas as suas manifestações processuais, cujo termo inicial conta a partir da intimação pessoal, feita por carga, remessa ou meio eletrônico: a banca diz que basta a publicação no diário.", "Esponja em Áudio · aula 40"], ["Não basta. Quem erra a contagem perde o recurso por intempestividade. O parágrafo segundo diz que a dobra não se aplica quando a lei estabelecer, de forma expressa, prazo próprio para o ente público. As empresas públicas e as sociedades de economia mista, em regra, não têm o benefício.", "Esponja em Áudio · aula 40"], ["A Empresa Brasileira de Correios é uma exceção. Na prática, e atenção à conta, porque a banca inverte. A contestação tem 15 dias úteis, e a Fazenda tem 30. Os recursos têm, em regra, 15 dias úteis, e a Fazenda tem 30. Os embargos de declaração têm 5 dias, e a Fazenda tem 10.", "Esponja em Áudio · aula 40"], ["Os embargos à execução fiscal têm prazo próprio de 30 dias, previsto no art. 16 da Lei 6.830. Como a lei fixou prazo próprio, não há dobra. O mandado de segurança, de 120 dias, e a ação rescisória, de 2 anos, são prazos de natureza decadencial, que também não dobram.", "Esponja em Áudio · aula 40"], ["A dobra vale no processo eletrônico, sim. O Ministério Público, art. 180, e a Defensoria Pública, art. 186, também têm prazo em dobro e intimação pessoal: os prazos próprios deles não se confundem com os da Fazenda, mas todos têm intimação pessoal. A remessa necessária está no art. 496 do CPC.", "Esponja em Áudio · aula 40"], ["Está sujeita ao duplo grau obrigatório, e só produz efeito depois de confirmada pelo tribunal, a sentença proferida contra a União, os Estados, o Distrito Federal, os Municípios e suas respectivas autarquias e fundações de direito público, inciso primeiro.", "Esponja em Áudio · aula 40"], ["E também a que julgar procedentes, no todo ou em parte, os embargos à execução fiscal, inciso segundo. Na execução fiscal, parcialmente procedente também conta. Se não houver apelação, o juiz remeterá os autos ao tribunal, de ofício.", "Esponja em Áudio · aula 40"], ["Empresas públicas e sociedades de economia mista não estão incluídas. A banca inclui: há dispensa por valor, no parágrafo terceiro, quando a condenação ou o proveito econômico, certo e líquido, for inferior a mil salários mínimos para a União e suas autarquias e fundações, a quinhentos para os Estados, o Distrito Federal, as capitais dos Estados e suas autarquias e fundações, e a cem para os demais Municípios e suas autarquias e fundações.", "Esponja em Áudio · aula 40"], ["Para Curitiba, que é capital, o limite é de quinhentos salários mínimos. E atenção: a dispensa exige condenação certa e líquida. A banca embaralha os valores e esquece essa expressão. Há também dispensa por precedente, no parágrafo quarto.", "Esponja em Áudio · aula 40"], ["Não há remessa quando a sentença estiver fundada em súmula de tribunal superior, em acórdão do Supremo ou do Superior Tribunal de Justiça em julgamento de recursos repetitivos, em entendimento firmado em incidente de resolução de demandas repetitivas ou de assunção de competência, ou em entendimento coincidente com orientação vinculante firmada no âmbito administrativo do próprio ente, no parecer, no voto ou em súmula administrativa.", "Esponja em Áudio · aula 40"], ["A Súmula 45 do Superior Tribunal de Justiça diz que, no reexame necessário, é defeso ao tribunal agravar a condenação imposta à Fazenda. É a vedação da reformatio in pejus. A banca diz que o tribunal pode aumentar a condenação. Não pode.", "Esponja em Áudio · aula 40"], ["E a Súmula 423 do Supremo diz que não transita em julgado a sentença por haver omitido o recurso de ofício. Sem a remessa, não há trânsito em julgado. A remessa não impede a apelação da Fazenda. E nas causas dos Juizados Especiais da Fazenda, Lei 12.153, não há remessa necessária.", "Esponja em Áudio · aula 40"], ["Outras prerrogativas: a Fazenda é dispensada de caução e de preparo recursal, e as custas são pagas ao final, mas ela deve antecipar os honorários periciais quando requerer a perícia, Súmula 232 do Superior Tribunal de Justiça.", "Esponja em Áudio · aula 40"], ["Os honorários contra a Fazenda seguem as faixas escalonadas do art. 85, parágrafo terceiro. E a tutela provisória contra a Fazenda tem as limitações do art. 1º da Lei 9.494, validado pelo Supremo na ADC 4.", "Esponja em Áudio · aula 40"]]}, {"n": 5, "nome": "Atos processuais e nulidades", "sub": "", "a": [["Quanto ao tempo, os atos se praticam em dias úteis, das seis às vinte horas, art. 212. A petição eletrônica pode ser enviada até as vinte e quatro horas do último dia do prazo, art. 213.", "Esponja em Áudio · aula 20"], ["Os prazos processuais contam-se em dias úteis, art. 219, excluído o dia do começo e incluído o do vencimento, art. 224. E ficam suspensos de vinte de dezembro a vinte de janeiro, art. 220. A banca usa dias corridos. No CPC, a regra é dia útil, e só para prazos processuais.", "Esponja em Áudio · aula 20"], ["Uma observação: a suspensão do final do ano suspende os prazos processuais, e não a prática de atos pelo juiz. Se a lei for omissa, o juiz fixa o prazo, e, se não o fizer, será de cinco dias, art. 218. Os prazos próprios, das partes, geram preclusão.", "Esponja em Áudio · aula 20"], ["Os prazos do juiz são impróprios: despachos em cinco dias, decisões interlocutórias em dez, sentenças em trinta. Descumprir prazo impróprio não gera preclusão nem nulidade. A banca diz que gera nulidade. O prazo peremptório não pode ser alterado por convenção das partes. O dilatório pode.", "Esponja em Áudio · aula 20"], ["A justa causa, art. 223, devolve o prazo à parte: e o CPC permite o negócio processual, art. 190, e o calendário processual, art. 191, para ajustar atos e prazos. A citação é o ato pelo qual se convoca o réu para integrar a relação processual, arts. 238 a 259.", "Esponja em Áudio · aula 20"], ["O citado deve confirmar o recebimento em três dias úteis, art. 246. Sem justa causa, a ausência de confirmação configura ato atentatório à dignidade da justiça. A banca altera o prazo. Há ainda citação pelo correio, por oficial de justiça e por edital. A citação por hora certa, arts.", "Esponja em Áudio · aula 20"], ["252 a 254, ocorre quando o réu se oculta para não ser citado. Se ele não comparecer, será nomeado curador especial. A citação por edital, art. 256, é cabível quando o réu é desconhecido, ignorado, ou está em local incerto, ou quando inacessível.", "Esponja em Áudio · aula 20"], ["O autor precisa afirmar essas circunstâncias, e quem requer citação por edital dolosamente, sem fundamento, paga multa de cinco salários mínimos ao citando, art. 258. A banca nega a multa.", "Esponja em Áudio · aula 20"], ["No revel citado por edital ou hora certa, atua o curador especial, art. 72, inciso 2, que pode contestar por negação geral. Na execução fiscal, a Súmula 414 do STJ diz que a citação por edital só é cabível quando frustradas as demais modalidades.", "Esponja em Áudio · aula 20"], ["O comparecimento espontâneo do réu supre a falta ou a nulidade da citação, art. 239, parágrafo 1º, e o prazo para defesa corre a partir do comparecimento.", "Esponja em Áudio · aula 20"], ["A contestação do curador não valida citação viciada: o juiz reconhece o vício e ordena a renovação. As intimações se realizam, de preferência, por meio eletrônico, ou pelo Diário da Justiça, na pessoa do advogado, art. 272.", "Esponja em Áudio · aula 20"], ["Os princípios são: instrumentalidade das formas, art. 277, em que o ato é válido se atingida a finalidade; prejuízo, art. 282, parágrafo 1º, em que não se pronuncia nulidade sem prejuízo, o velho pas de nullité sans grief; aproveitamento dos atos, art. 283; e convalidação.", "Esponja em Áudio · aula 20"], ["A nulidade relativa deve ser alegada na primeira oportunidade, art. 278, sob pena de preclusão, e não pode ser invocada por quem lhe deu causa, art. 276. A nulidade absoluta pode ser conhecida de ofício.", "Esponja em Áudio · aula 20"], ["Se o Ministério Público deveria ter intervindo e não foi intimado, a nulidade só é decretada depois de ele se manifestar, art. 279. E a anulação de um ato atinge somente os atos dependentes, art. 281.", "Esponja em Áudio · aula 20"]]}, {"n": 6, "nome": "Tutela provisória: urgência, evidência e estabilização", "sub": "", "a": [["O nome diz tudo: é provisória. Isso quer dizer que conserva a sua eficácia durante o processo, mas pode ser revogada ou modificada a qualquer tempo, conforme o art. 296. Diferente da sentença, ela não é definitiva, porque é baseada em juízo de probabilidade, e não de certeza.", "Esponja em Áudio · aula 8"], ["Além disso, a urgência pode ser concedida de forma antecedente, antes do pedido principal, ou incidental, no curso do processo. Guarde esse mapa: urgência ou evidência; cautelar ou antecipada; antecedente ou incidental. A tutela de urgência exige dois requisitos, previstos no art. 300.", "Esponja em Áudio · aula 8"], ["O primeiro é a probabilidade do direito, que é o antigo fumus boni iuris, a fumaça do bom direito. O segundo é o perigo de dano ou o risco ao resultado útil do processo, o antigo periculum in mora. Os dois precisam estar presentes. A banca costuma exigir só um, ou dizer que basta a verossimilhança.", "Esponja em Áudio · aula 8"], ["Um ponto importante: a tutela antecipada de urgência não será concedida quando houver perigo de irreversibilidade dos efeitos da decisão, conforme o § 3º do art. 300. Isso é a chamada irreversibilidade recíproca.", "Esponja em Áudio · aula 8"], ["Há restrições legais, como as da Lei 9.494/1997 e as da Lei 12.016/2009, que vedam tutela em certos casos, como a reclassificação ou equiparação de servidores, concessão de aumento ou extensão de vantagens e pagamento de vencimentos. O Supremo, na ADC 4, considerou constitucional a restrição.", "Esponja em Áudio · aula 8"], ["Esse é um ponto a que o procurador municipal precisa estar atento. Além disso, a Súmula 729 do Supremo diz que a decisão da ADC 4 não se aplica à antecipação de tutela em causas de natureza previdenciária. A tutela de evidência independe de perigo de dano.", "Esponja em Áudio · aula 8"], ["Esse é o ponto central: ela é concedida porque o direito é evidente, e não porque haja urgência. Se a banca disser que ela exige perigo de dano, está errada. O art. 311 prevê quatro hipóteses: inciso 1: abuso do direito de defesa ou manifesto propósito protelatório da parte.", "Esponja em Áudio · aula 8"], ["Inciso 2: as alegações de fato podem ser comprovadas apenas documentalmente e há tese firmada em julgamento de casos repetitivos ou em súmula vinculante.", "Esponja em Áudio · aula 8"], ["Há uma discussão jurisprudencial sobre a expressão não interpuser o respectivo recurso. A Terceira Turma do STJ, no REsp 1.760.966, deu leitura literal, entendendo que só o recurso de agravo de instrumento impede a estabilização.", "Esponja em Áudio · aula 8"], ["Para a prova, se a questão trouxer a literalidade, siga o texto da lei. Se trouxer o entendimento do STJ, observe a manifestação de resistência. Atenção para outra pegadinha. A estabilização não depende de sentença. Depende de decisão concessiva e da inércia do réu.", "Esponja em Áudio · aula 8"], ["Se o autor não o formular, a eficácia da tutela cessa. Também cessa se ela não for efetivada em 30 dias, ou se o pedido principal for julgado improcedente, ou se o processo for extinto sem resolução de mérito. A banca troca o prazo por 15 ou 5 dias. Guarde: 30 dias, pedido principal.", "Esponja em Áudio · aula 8"], ["E 15 dias, aditamento da antecipada. Outro ponto essencial é a responsabilidade pelo dano, no art. 302.", "Esponja em Áudio · aula 8"], ["Em linhas gerais, a sentença que confirma, concede ou revoga tutela provisória produz efeitos imediatos, porque a apelação não tem efeito suspensivo nesse caso, conforme o art. 1.012, § 1º, inciso 5.", "Esponja em Áudio · aula 8"], ["E o julgamento antecipado parcial de mérito, do art. 356, é impugnável por agravo de instrumento, e não por apelação.", "Esponja em Áudio · aula 8"]]}, {"n": 7, "nome": "Procedimento comum e provas", "sub": "", "a": [["A petição inicial precisa conter os requisitos do art. 328: o juízo a que é dirigida, a qualificação das partes, o fato e os fundamentos jurídicos do pedido, o pedido com suas especificações, o valor da causa, as provas que se pretende produzir, e a opção pela realização ou não da audiência de conciliação.", "Esponja em Áudio · aula 4"], ["Sem sequer citar o réu, o juiz julga improcedente o pedido que contrariar súmula do Supremo ou do Superior Tribunal de Justiça, acórdão em recurso repetitivo, entendimento firmado em incidente de resolução de demandas repetitivas ou de assunção de competência, ou súmula de tribunal de justiça sobre direito local.", "Esponja em Áudio · aula 4"], ["Também quando verificar, desde logo, a decadência ou a prescrição. A decisão é sentença com resolução de mérito. Superada essa etapa, o juiz designa audiência de conciliação ou mediação, conforme o art. 334.", "Esponja em Áudio · aula 4"], ["O não comparecimento injustificado de quem a ela foi intimado é considerado ato atentatório à dignidade da justiça, com multa de até 2% da vantagem econômica pretendida ou do valor da causa, revertida em favor da União ou do Estado.", "Esponja em Áudio · aula 4"], ["O réu também pode apresentar reconvenção, que é uma ação do réu contra o autor, no mesmo processo, na própria contestação, conforme o art. 343. Antes eram peças separadas, agora tudo vem junto.", "Esponja em Áudio · aula 4"], ["É o julgamento conforme o estado do processo. Há quatro caminhos. O primeiro é a extinção do processo, sem resolução do mérito, nas hipóteses do art. 485.", "Esponja em Áudio · aula 4"], ["O segundo é o julgamento antecipado do mérito, previsto no art. 355, quando não houver necessidade de produzir outras provas, ou quando ocorrer revelia, com os efeitos já vistos, sem requerimento de provas.", "Esponja em Áudio · aula 4"], ["O terceiro é o julgamento antecipado parcial do mérito, do art. 356, quando um ou mais pedidos estão maduros para julgamento. Contra essa decisão cabe agravo de instrumento. O quarto caminho é o saneamento e a organização do processo. O saneamento está no art. 357.", "Esponja em Áudio · aula 4"], ["Agora, as provas: prova é o meio pelo qual as partes demonstram ao juiz a veracidade de suas alegações. O juiz julga com base no que está nos autos e, por isso, a prova é o centro da instrução. O ônus da prova está no art. 373.", "Esponja em Áudio · aula 4"], ["Os fatos que independem de prova são os notórios, os afirmados por uma parte e confessados pela outra, os admitidos como incontroversos e aqueles em cujo favor milita presunção legal de existência ou de veracidade, conforme o art. 374.", "Esponja em Áudio · aula 4"], ["O Código também admite a prova emprestada, produzida em outro processo e trazida para este, no art. 372, desde que seja respeitado o contraditório. Por fim, a produção antecipada de provas, nos arts. 381 a 383.", "Esponja em Áudio · aula 4"], ["A ata notarial, do art. 384, é um documento lavrado por tabelião, que atesta ou documenta a existência e o modo de existir de algum fato, inclusive dados representados por imagem ou som gravados em arquivos eletrônicos. É muito usada para registrar conteúdo de páginas da internet.", "Esponja em Áudio · aula 4"], ["O juiz não fica vinculado ao laudo, podendo formar a sua convicção com outros elementos, desde que fundamente. A inspeção judicial, do art. 481, é o exame direto, pelo juiz, de pessoas ou coisas, para se esclarecer fato que interesse à decisão. Pode ser feita de ofício ou a requerimento.", "Esponja em Áudio · aula 4"], ["Um detalhe processual que cai bastante e é central para quem representa o Município: a Fazenda Pública tem prazo em dobro para todas as suas manifestações processuais, conforme o art. 183, contado em dias úteis, com intimação pessoal. A exceção é quando a lei fixa prazo específico para a Fazenda.", "Esponja em Áudio · aula 4"]]}, {"n": 8, "nome": "Sentença, fundamentação e coisa julgada", "sub": "", "a": [["O relatório é o resumo do caso. A fundamentação é a análise das questões de fato e de direito. E o dispositivo é a parte em que o juiz resolve as questões e decide. A motivação das decisões é exigência constitucional, art. 93, inciso 9.", "Esponja em Áudio · aula 12"], ["E a coisa julgada garante a estabilidade das decisões, expressão da segurança jurídica. A sentença pode extinguir o processo sem resolução de mérito, nas hipóteses do art. 485, ou com resolução de mérito, nas hipóteses do art. 487.", "Esponja em Áudio · aula 12"], ["Guarde: quatrocentos e oitenta e cinco, sem mérito; quatrocentos e oitenta e sete, com mérito. A banca inverte: o parágrafo 1º do art. 489 é um dos mais cobrados do CPC.", "Esponja em Áudio · aula 12"], ["Quarta: não enfrentar todos os argumentos deduzidos no processo capazes, em tese, de infirmar a conclusão adotada. Quinta: se limitar a invocar precedente ou súmula sem identificar seus fundamentos determinantes nem demonstrar que o caso se ajusta a eles.", "Esponja em Áudio · aula 12"], ["E sexta: deixar de seguir enunciado de súmula, jurisprudência ou precedente invocado pela parte, sem demonstrar a existência de distinção ou a superação do entendimento. O ponto central do resumo é a quarta hipótese: a decisão que não enfrenta todos os argumentos.", "Esponja em Áudio · aula 12"], ["E a citra petita pode ser corrigida por embargos de declaração, ou completada pelo tribunal, se a causa estiver madura, nos termos do art. 1.013, parágrafo 3º. Quando a sentença é publicada, o juiz só pode alterá-la em duas situações, nos termos do art. 494.", "Esponja em Áudio · aula 12"], ["Em regra, o autor pode propor de novo a ação, salvo nas hipóteses de perempção, litispendência e coisa julgada, conforme o art. 486. A coisa julgada material, prevista no art. 502, torna imutável e indiscutível a decisão de mérito, e produz efeitos fora do processo.", "Esponja em Áudio · aula 12"], ["O CPC de 2015 trouxe novidade: a questão prejudicial decidida expressa e incidentalmente no processo também faz coisa julgada, se atendidos os requisitos do art. 503, parágrafo 1º. O resumo traz o macete DCC: Dependência, Contraditório e Competência.", "Esponja em Áudio · aula 12"], ["Para o procurador, isso quer dizer cuidado em ações em que a Fazenda discute questões prejudiciais: a decisão pode se tornar imutável. Sobre os limites subjetivos, o art. 506 diz que a sentença faz coisa julgada às partes entre as quais é dada, não prejudicando terceiros.", "Esponja em Áudio · aula 12"], ["A coisa julgada ofendida, depois do trânsito em julgado, desafia a ação rescisória, art. 966, e o prazo é de dois anos, contados do trânsito em julgado da última decisão proferida no processo, art. 975.", "Esponja em Áudio · aula 12"], ["Na ação civil pública, a coisa julgada é erga omnes, salvo se o pedido for julgado improcedente por insuficiência de provas, caso em que qualquer legitimado pode propor nova ação com nova prova. E o Supremo, no Tema 1.075, afastou a limitação territorial do art. 16 da Lei 7.347, de 1985.", "Esponja em Áudio · aula 12"], ["Nas relações jurídicas de trato continuado, como as tributárias, a sentença pode ser revista se sobrevier modificação no estado de fato ou de direito, art. 505, inciso 1.", "Esponja em Áudio · aula 12"], ["E o Supremo, nos Temas 881 e 885, decidiu que a decisão posterior do STF em controle concentrado ou em repercussão geral faz cessar os efeitos da coisa julgada tributária de trato continuado, daí para a frente, observadas as anterioridades.", "Esponja em Áudio · aula 12"], ["É a tese que protege o Fisco quando o contribuinte tem sentença antiga que o isenta. Também é inexigível a obrigação reconhecida em título judicial fundada em lei ou ato normativo declarado inconstitucional pelo Supremo, art. 525, parágrafo 12. Isso aparece na impugnação ao cumprimento de sentença.", "Esponja em Áudio · aula 12"]]}, {"n": 9, "nome": "Recursos: teoria geral, apelação, agravos e embargos de declaração", "sub": "", "a": [["Taxatividade: só são recursos os previstos em lei, no rol do art. 994 do CPC. As partes não podem criar recurso. Singularidade, ou unirrecorribilidade: contra cada decisão, um único recurso. Fungibilidade: admite-se um recurso por outro se não houver erro grosseiro nem má-fé.", "Esponja em Áudio · aula 16"], ["O art. 1.001 estabelece que dos despachos não cabe recurso. A banca pode dizer que cabe agravo contra despacho de mero expediente. Está errado. O juízo de admissibilidade examina pressupostos.", "Esponja em Áudio · aula 16"], ["O prazo é de quinze dias úteis para a maior parte dos recursos, exceto para os embargos de declaração, que têm prazo de cinco dias úteis, conforme o art. 1.003, parágrafo 5º.", "Esponja em Áudio · aula 16"], ["A Fazenda Pública tem prazo em dobro, art. 183, de modo que ela tem trinta dias úteis para apelar e dez dias úteis para embargar. A banca diz quinze dias para os embargos, ou dias corridos.", "Esponja em Áudio · aula 16"], ["Se não for comprovado no ato de interposição, o recorrente é intimado para realizar o recolhimento em dobro, sob pena de deserção. A banca diz que a deserção é imediata nos dois casos. Não é. A desistência do recurso independe da anuência do recorrido, art. 998. Os recursos podem ter vários efeitos.", "Esponja em Áudio · aula 16"], ["Uma observação sobre a Fazenda Pública: a remessa necessária não é recurso, e a Súmula 45 do STJ diz que, no reexame necessário, é defeso ao Tribunal agravar a condenação imposta à Fazenda Pública. A apelação cabe contra a sentença.", "Esponja em Áudio · aula 16"], ["O juiz de primeiro grau não examina a admissibilidade, art. 1.010, parágrafo 3º. A banca diz que o juiz faz o primeiro exame.", "Esponja em Áudio · aula 16"], ["E cabe apelação adesiva, art. 997, parágrafo 2º, que fica subordinada ao recurso principal. O agravo de instrumento cabe contra as decisões interlocutórias do rol do art. 1.015.", "Esponja em Áudio · aula 16"], ["O Superior Tribunal de Justiça, no Tema 988, fixou a tese da taxatividade mitigada: o rol é taxativo, mas admite agravo fora do rol quando houver urgência decorrente da inutilidade do julgamento da questão somente na apelação.", "Esponja em Áudio · aula 16"], ["E, quando não se interpõe agravo contra decisão fora do rol, não há preclusão automática, preservada a impugnação na apelação. A banca diz que o rol é exemplificativo, ou que a preclusão é automática.", "Esponja em Áudio · aula 16"], ["Ambas estão erradas: o agravo é interposto diretamente no tribunal, art. 1.016, e não tem efeito suspensivo automático, mas o relator pode concedê-lo, art. 1.019, inciso 1. O agravo interno cabe contra decisão monocrática do relator, em quinze dias úteis, art. 1.021.", "Esponja em Áudio · aula 16"], ["A omissão inclui as decisões que se enquadram no art. 489, parágrafo 1º, que estudamos na aula de sentença. Os embargos não têm efeito suspensivo, mas interrompem o prazo para a interposição de outros recursos, art. 1.026. Interrompem, e não suspendem: o prazo recomeça por inteiro.", "Esponja em Áudio · aula 16"], ["E a jurisprudência do STJ afirma que embargos intempestivos não produzem esse efeito. A banca já cobrou isso em prova do Tribunal de Justiça do Paraná, com a pergunta sobre o prazo para apelar quando os embargos são opostos fora do prazo.", "Esponja em Áudio · aula 16"], ["Os embargos manifestamente protelatórios geram multa de até 2% do valor atualizado da causa. Na reiteração, a multa pode chegar a 10%, e o depósito condiciona novos recursos, salvo para a Fazenda Pública e o beneficiário da gratuidade, que pagam ao final.", "Esponja em Áudio · aula 16"]]}, {"n": 10, "nome": "REsp, RE, IRDR, IAC, reclamação, precedentes e ação rescisória", "sub": "", "a": [["O recurso especial, art. 105, inciso 3, da Constituição, cabe contra acórdão de Tribunal de Justiça ou Tribunal Regional Federal em única ou última instância: as hipóteses são: contrariar tratado ou lei federal ou negar-lhes vigência, julgar válido ato de governo local contestado em face de lei federal, ou dar interpretação divergente de outro tribunal.", "Esponja em Áudio · aula 24"], ["A pegadinha clássica é trocar os dois. O recurso especial é para lei federal e vai ao STJ. O extraordinário é para a Constituição e vai ao STF. Os dois são interpostos no tribunal de origem.", "Esponja em Áudio · aula 24"], ["Há repercussão geral presumida quando o acórdão contraria súmula ou jurisprudência dominante do Supremo, ou declara a inconstitucionalidade de tratado ou lei federal. E só dois terços dos ministros podem recusar a repercussão geral. A banca diz maioria simples ou maioria absoluta. Errado.", "Esponja em Áudio · aula 24"], ["O art. 1.025 do CPC traz o prequestionamento ficto: consideram-se incluídos no acórdão os elementos que o embargante suscitou, ainda que os embargos sejam inadmitidos ou rejeitados, se o tribunal superior considerar existente erro, omissão, contradição ou obscuridade. A banca diz que o prequestionamento ficto é inexigível ou que basta qualquer menção. Atenção ao texto: reexame de prova é vedado: Súmula 7 do STJ e Súmula 279 do STF.", "Esponja em Áudio · aula 24"], ["A Súmula 5 do STJ veda interpretar cláusula contratual. A Súmula 280 do STF veda recurso extraordinário por ofensa a lei local.", "Esponja em Áudio · aula 24"], ["As Súmulas 283 e 284 do STF tratam de fundamento suficiente não impugnado e de deficiência de fundamentação. A banca diz que o recurso especial pode reanalisar fatos. Errado.", "Esponja em Áudio · aula 24"], ["Nos repetitivos, art. 1.036 a 1.041, o presidente do tribunal de origem seleciona dois ou mais recursos representativos da controvérsia, e o STJ ou o STF afeta a questão. Os demais recursos ficam suspensos.", "Esponja em Áudio · aula 24"], ["Julgado no tribunal, a tese vale na sua área, e o recurso especial ou extraordinário contra o julgamento tem efeito suspensivo e repercussão geral presumida. A banca diz que a suspensão dura indefinidamente. Errado.", "Esponja em Áudio · aula 24"], ["O IAC, art. 947, cabe para relevante questão de direito, com grande repercussão social, sem repetição em múltiplos processos: é isso que o distingue do IRDR. O acórdão vincula juízes e órgãos fracionários. A banca troca os dois conceitos. IRDR é repetição e risco à isonomia.", "Esponja em Áudio · aula 24"], ["A reclamação, art. 988 a 993, preserva a competência, garante a autoridade das decisões e garante a observância de súmula vinculante, de decisão do Supremo em controle concentrado e de acórdão de IRDR ou IAC: não cabe reclamação contra decisão transitada em julgado. A banca diz que cabe a qualquer tempo. Errado.", "Esponja em Áudio · aula 24"], ["Os juízes observam as decisões do Supremo em controle concentrado, as súmulas vinculantes, os acórdãos de IAC, IRDR e repetitivos, as súmulas do Supremo em matéria constitucional e do STJ em matéria infraconstitucional, e a orientação do plenário ou do órgão especial.", "Esponja em Áudio · aula 24"], ["O juiz pode distinguir e superar, com fundamentação. A modificação de tese pode ser modulada, parágrafo 3º. A banca diz que o precedente vinculante nunca pode ser afastado. Errado.", "Esponja em Áudio · aula 24"], ["O prazo é de 2 anos do trânsito em julgado da última decisão, é a Súmula 401 do STJ. A banca diz que corre da primeira decisão ou que é de 5 anos. Na prova nova, o prazo é de 2 anos da descoberta, com limite de 5 anos do trânsito em julgado da última decisão.", "Esponja em Áudio · aula 24"], ["Exige depósito de 5% do valor da causa, e a Fazenda Pública é dispensada. E a Súmula 343 do Supremo não se aplica à matéria constitucional.", "Esponja em Áudio · aula 24"]]}, {"n": 11, "nome": "Cumprimento de sentença contra a Fazenda Pública, precatórios e RPV", "sub": "", "a": [["No cumprimento de sentença que impõe à Fazenda o pagamento de quantia certa, art. 534 e 535 do CPC, o exequente apresenta um demonstrativo discriminado e atualizado do crédito, com CPF ou CNPJ, índice de correção, juros, termos inicial e final e descontos.", "Esponja em Áudio · aula 28"], ["A Fazenda é intimada, e não citada, para impugnar em 30 dias, nos próprios autos. Não incide a multa de 10% do art. 523, nem os honorários dessa fase se não houver impugnação. A banca diz que o prazo é de 15 dias, ou que a Fazenda é citada para pagar. Errado.", "Esponja em Áudio · aula 28"], ["Se é posterior, cabe ação rescisória, e o prazo de 2 anos conta do trânsito em julgado da decisão do Supremo. A banca diz que a decisão posterior afasta a coisa julgada sem rescisória. Errado.", "Esponja em Áudio · aula 28"], ["Os honorários: o art. 85, parágrafo 7º, diz que não são devidos honorários no cumprimento de sentença contra a Fazenda que enseje a expedição de precatório, se não houve impugnação. O tratamento na RPV deve ser conferido na jurisprudência.", "Esponja em Áudio · aula 28"], ["Outro ponto: a execução fundada em título extrajudicial contra a Fazenda é cabível, Súmula 279 do STJ, e segue o art. 910, com embargos em 30 dias. Bens públicos são impenhoráveis.", "Esponja em Áudio · aula 28"], ["E a ação monitória é admissível contra a Fazenda, mas, se não houver embargos, aplica-se a remessa necessária, como caiu na prova do MP do Rio. O art. 100 da Constituição manda pagar os precatórios na ordem cronológica de apresentação: o pagamento exige o trânsito em julgado.", "Esponja em Áudio · aula 28"], ["Os débitos de natureza alimentar têm preferência sobre os demais, mas não dispensam precatório. É a Súmula 655 do Supremo.", "Esponja em Áudio · aula 28"], ["Há uma superpreferência: titulares com 60 anos ou mais, portadores de doença grave e pessoas com deficiência recebem primeiro, até o valor equivalente ao triplo do fixado para a RPV. A banca diz que idoso tem prioridade sobre doente grave. Errado. A Constituição não faz essa hierarquia.", "Esponja em Áudio · aula 28"], ["Quanto à atualização, a Emenda 113, de 2021, adotou a taxa Selic, acumulada mensalmente. A compensação de precatório com débitos do credor e a remuneração da poupança foram declaradas inconstitucionais nas ADIs 4357 e 4425.", "Esponja em Áudio · aula 28"], ["A Emenda 136, de 2025, antecipou a apresentação do precatório, de 2 de abril para 1º de fevereiro, e trouxe novas regras de atualização, com o IPCA. Confira o texto vigente.", "Esponja em Áudio · aula 28"], ["A Súmula Vinculante 17 diz que, durante o prazo constitucional de pagamento do precatório, não incidem juros de mora. A banca diz que incidem em todo o período. Errado. A requisição de pequeno valor dispensa o precatório.", "Esponja em Áudio · aula 28"], ["O valor é fixado por lei de cada ente, com mínimo igual ao maior benefício do regime geral. Enquanto não há lei local, o art. 87 do ADCT estabelece 40 salários mínimos para Estados e Distrito Federal, e 30 para Municípios. O limite federal é de 60. Em Curitiba, vale a Lei 10.235, de 2001.", "Esponja em Áudio · aula 28"], ["Confira o valor vigente. É vedado fracionar, repartir ou quebrar o valor da execução para enquadrar parte dela em RPV. Mas a Súmula Vinculante 47 permite destacar os honorários do montante principal, com requisição própria.", "Esponja em Áudio · aula 28"], ["E os atos do presidente do tribunal no precatório são administrativos, Súmula 311 do STJ, por isso não cabe recurso extraordinário, Súmula 733 do Supremo.", "Esponja em Áudio · aula 28"]]}, {"n": 12, "nome": "Execução de título extrajudicial e defesas do executado", "sub": "", "a": [["A execução exige título executivo com certeza, liquidez e exigibilidade, art. 783.", "Esponja em Áudio · aula 32"], ["O art. 784 lista os títulos, como letra de câmbio, nota promissória, duplicata, cheque, documento assinado pelo devedor e duas testemunhas, contrato garantido por hipoteca, penhor ou caução, a certidão de dívida ativa e o crédito de contribuição condominial previsto em convenção ou aprovado em assembleia: ajuizar ação sobre o débito não impede a execução.", "Esponja em Áudio · aula 32"], ["O executado é citado para pagar em 3 dias, com honorários de 10%, reduzidos à metade se pagar integralmente nesse prazo. Não pagando, penhoram-se bens, na ordem do art. 835, que começa por dinheiro. A alienação em fraude à execução é ineficaz perante o exequente.", "Esponja em Áudio · aula 32"], ["Mas, antes de declará-la, o juiz deve intimar o terceiro adquirente, que pode opor embargos de terceiro em 15 dias. Foi exatamente o que caiu no Enam. A Súmula 375 do STJ exige registro da penhora ou prova de má-fé do terceiro. Os embargos à execução independem de penhora, depósito ou caução.", "Esponja em Áudio · aula 32"], ["O prazo é de 15 dias, contado da juntada aos autos do comprovante de citação, e, havendo vários executados, conta-se individualmente, salvo cônjuges. A banca diz que o prazo conta da citação. Errado. Os embargos não têm efeito suspensivo automático.", "Esponja em Áudio · aula 32"], ["Ele depende de requerimento, dos requisitos da tutela provisória e de garantia do juízo. A banca diz que suspendem automaticamente. Errado.", "Esponja em Áudio · aula 32"], ["As matérias estão no art. 917: inexequibilidade, penhora incorreta, excesso de execução, retenção por benfeitorias, incompetência e qualquer defesa de processo de conhecimento. No excesso, o embargante deve indicar o valor que entende correto, sob pena de rejeição liminar.", "Esponja em Áudio · aula 32"], ["Os embargos manifestamente protelatórios geram multa de até 20%. O art. 916 permite parcelar: no prazo dos embargos, o executado reconhece o débito, deposita 30%, com custas e honorários, e paga o restante em até 6 parcelas mensais, com correção e juros de 1% ao mês.", "Esponja em Áudio · aula 32"], ["O pedido não depende de concordância do exequente. A falta de pagamento de parcela gera vencimento antecipado e multa de 10%. E esse parcelamento não se aplica ao cumprimento de sentença. Contra a Fazenda Pública, cabe execução de título extrajudicial, Súmula 279 do STJ.", "Esponja em Áudio · aula 32"], ["A Fazenda é citada para embargar em 30 dias, e não para pagar em 3. Não há penhora de bens públicos. Rejeitados os embargos ou não opostos, expede-se precatório ou requisição de pequeno valor.", "Esponja em Áudio · aula 32"], ["Nos embargos, a Fazenda pode alegar qualquer matéria de defesa do processo de conhecimento. Atenção à execução fiscal. A Lei 6.830 tem regime próprio: citação em 5 dias para pagar ou garantir, e embargos em 30 dias, exigida garantia prévia. O CPC é subsidiário.", "Esponja em Áudio · aula 32"], ["São impenhoráveis, entre outros, móveis de uso doméstico de médio valor, vestuário, salários e proventos, a poupança até 40 salários mínimos, instrumentos de trabalho e a pequena propriedade rural. O salário cede para pensão alimentícia e para valores acima de 50 salários mínimos mensais.", "Esponja em Áudio · aula 32"], ["O bem de família é protegido, mas a Lei 8.009 excepciona o crédito condominial do próprio imóvel. A cota de condomínio é obrigação propter rem, e o adquirente responde pelos débitos anteriores, como decidiu o Enam recentemente.", "Esponja em Áudio · aula 32"], ["O prazo de prescrição dessas cotas é de 5 anos, e a convenção sem registro não retira a força do título. Fora dos embargos, a exceção de pré-executividade é admitida para matérias de ordem pública sem dilação probatória, Súmula 393 do STJ.", "Esponja em Áudio · aula 32"]]}, {"n": 13, "nome": "Juizados Especiais da Fazenda Pública (Lei 12.153) e Lei 9.099", "sub": "", "a": [["O Juizado da Fazenda julga causas de interesse dos Estados, do Distrito Federal, dos Territórios e dos Municípios, até 60 salários mínimos. Na soma de parcelas vencidas e 12 vincendas, o total não pode superar esse valor. Onde o Juizado estiver instalado, a competência é absoluta.", "Esponja em Áudio · aula 36"], ["O autor pode renunciar ao excedente para ficar no Juizado. A banca diz que a competência é opcional. Errado.", "Esponja em Áudio · aula 36"], ["Não cabem no Juizado o mandado de segurança, a desapropriação, a divisão e demarcação, a ação popular, a improbidade, a execução fiscal, as causas sobre bens imóveis dos entes, as causas sobre direitos difusos e coletivos e as de demissão de servidor ou sanções disciplinares a militares. A banca diz que o mandado de segurança cabe se o valor for baixo. Errado.", "Esponja em Áudio · aula 36"], ["Podem ser autores as pessoas físicas, as microempresas e as empresas de pequeno porte. Podem ser réus os Estados, o Distrito Federal, os Territórios e os Municípios, e também autarquias, fundações e empresas públicas vinculadas a eles.", "Esponja em Áudio · aula 36"], ["A pegadinha clássica: sociedade de economia mista não pode ser ré no Juizado da Fazenda. Empresa pública pode. A banca troca as duas. Não há prazos diferenciados para a Fazenda. Nada de prazo em dobro ou em quádruplo. Também não há reexame necessário.", "Esponja em Áudio · aula 36"], ["A citação ocorre com antecedência mínima de 30 dias da audiência. Os representantes do ente podem conciliar, transigir ou desistir, nos termos da lei do próprio ente. O juiz pode deferir de ofício medidas cautelares e de antecipação de tutela.", "Esponja em Áudio · aula 36"], ["Só cabe recurso contra a sentença, mas é possível recorrer da decisão que defere ou nega tutela de urgência. Outras decisões interlocutórias não admitem agravo. A banca diz que cabe agravo de instrumento. Errado.", "Esponja em Áudio · aula 36"], ["O recurso inominado vai para a Turma Recursal, composta por juízes de primeiro grau, com mandato de 2 anos, vedada a recondução. Contra acórdão da Turma cabe recurso extraordinário, Súmula 640 do Supremo, mas não cabe recurso especial, Súmula 203 do STJ.", "Esponja em Áudio · aula 36"], ["O cumprimento de obrigação de fazer é por ofício do juiz. A obrigação de pagar quantia certa é paga por requisição de pequeno valor, a RPV, em 60 dias, sob pena de sequestro.", "Esponja em Áudio · aula 36"], ["Os limites são 40 salários mínimos para Estados e Distrito Federal e 30 salários mínimos para Municípios, até que a lei do ente fixe outro valor. É vedado o fracionamento. O credor pode renunciar ao excedente para receber por RPV.", "Esponja em Áudio · aula 36"], ["Havendo divergência entre Turmas do mesmo Estado em questões de direito material, cabe pedido de uniformização, julgado pela reunião das Turmas em conflito, presidida por desembargador. Se a decisão contraria súmula do STJ, o pedido vai ao STJ.", "Esponja em Áudio · aula 36"], ["No Juizado Cível, a Lei 9.099 fixa a competência em 40 salários mínimos, e o advogado é dispensável até 20. Não podem ser partes o incapaz, o preso, as pessoas jurídicas de direito público, as empresas públicas da União, a massa falida e o insolvente civil.", "Esponja em Áudio · aula 36"], ["O recurso inominado tem prazo de 10 dias, e os embargos de declaração, 5 dias. Em primeiro grau, o acesso é gratuito, sem custas
