 feito em qualquer ação, inclusive na ação civil pública, desde que a inconstitucionalidade não seja o pedido principal. Se for, haveria usurpação do controle concentrado. A cláusula de reserva de plenário está no art. 97 da Constituição e nos art. 948 a 950 do CPC.", "Esponja em Áudio · aula 38"], ["A Súmula Vinculante 10 diz que viola a cláusula a decisão de órgão fracionário que, sem declarar expressamente a inconstitucionalidade, afasta a incidência da lei, no todo ou em parte. A banca diz que não viola.", "Esponja em Áudio · aula 38"], ["Viola: há dispensa quando já existe pronunciamento do plenário ou do órgão especial do próprio tribunal, ou do Supremo, sobre a questão, conforme o art. 949, parágrafo único, do CPC.", "Esponja em Áudio · aula 38"], ["O art. 52, inciso 10, atribui ao Senado a competência para suspender a execução, no todo ou em parte, de lei declarada inconstitucional por decisão definitiva do Supremo: na visão tradicional, é ato discricionário, e é essa resolução que dá eficácia contra todos à decisão tomada no controle difuso.", "Esponja em Áudio · aula 38"], ["Há debate doutrinário e jurisprudencial sobre mutação constitucional, a chamada abstrativização, mas a banca cobra, em regra, o texto da Constituição. A pegadinha é atribuir efeito contra todos automático à decisão difusa.", "Esponja em Áudio · aula 38"], ["Passemos à modulação, prevista no art. 27 da Lei 9.868, de 1999, e no art. 11 da Lei 9.882, de 1999.", "Esponja em Áudio · aula 38"], ["A modulação é admitida também no controle difuso, em recurso extraordinário. Sem modulação, a regra é a nulidade, com efeito retroativo. Um efeito que decorre da nulidade é o repristinatório: a norma anterior, que havia sido revogada pela lei declarada inconstitucional, volta a vigorar.", "Esponja em Áudio · aula 38"], ["A súmula vinculante está no art. 103-A da Constituição e na Lei 11.417, de 2006. É aprovada por dois terços dos ministros do Supremo, de ofício ou por provocação, depois de reiteradas decisões sobre matéria constitucional.", "Esponja em Áudio · aula 38"], ["Os legitimados são os do art. 103, mais o Defensor Público-Geral da União, os Tribunais e, incidentalmente no curso de processo em que seja parte, o Município, sem que isso suspenda o processo. O rol é mais amplo que o da ADI. Se o ato violar a súmula, cabe reclamação ao Supremo.", "Esponja em Áudio · aula 38"], ["Quando se tratar de ato administrativo, a reclamação só é cabível depois de esgotadas as vias administrativas, conforme o art. 7º, parágrafo primeiro, da Lei 11.417. O Supremo também pode modular a eficácia temporal da súmula, por dois terços.", "Esponja em Áudio · aula 38"], ["O art. 125, parágrafo segundo, atribui aos Estados a instituição da representação de inconstitucionalidade de leis ou atos normativos estaduais ou municipais em face da Constituição Estadual, vedada a atribuição da legitimação para agir a um único órgão: o parâmetro é a Constituição Estadual.", "Esponja em Áudio · aula 38"], ["Nem a Constituição Federal, nem a lei orgânica municipal servem de parâmetro nessa via. E a lei municipal que contraria diretamente a Constituição Federal? Não cabe ADI no Supremo. Cabe a ADPF, além, é claro, do controle difuso.", "Esponja em Áudio · aula 38"], ["Já quando a norma da Constituição Estadual tida por violada é de reprodução obrigatória da Constituição Federal, cabe recurso extraordinário ao Supremo contra a decisão do Tribunal de Justiça, e a decisão tem efeito contra todos.", "Esponja em Áudio · aula 38"]]}, {"n": 5, "nome": "Direitos fundamentais: teoria geral, direitos individuais e sociais", "sub": "", "a": [["O ponto central é que não existe direito absoluto. Os direitos fundamentais podem ser restringidos, desde que a restrição respeite a proporcionalidade e o núcleo essencial do direito.", "Esponja em Áudio · aula 18"], ["O Supremo admite a eficácia direta dos direitos fundamentais nas relações privadas, em casos como o RE 201.819, que tratou da exclusão de sócio de entidade sem ampla defesa, a UBC, e o RE 161.243, o caso da Air France, sobre tratamento discriminatório de trabalhadores. A banca limita a eficácia ao plano vertical.", "Esponja em Áudio · aula 18"], ["E o art. 5º, parágrafo 1º, dá aplicação imediata às normas definidoras de direitos e garantias fundamentais: o art. 5º, parágrafo 2º, diz que os direitos previstos não excluem outros decorrentes do regime e dos princípios adotados, ou dos tratados internacionais de que o Brasil seja parte.", "Esponja em Áudio · aula 18"], ["Os tratados de direitos humanos que não passaram por esse rito têm status supralegal, conforme o RE 466.343, que levou à Súmula Vinculante 25, sobre a prisão civil do depositário infiel. A banca diz que todo tratado de direitos humanos tem automaticamente status constitucional. É errado.", "Esponja em Áudio · aula 18"], ["As ações afirmativas são constitucionais, como decidiu o Supremo ao validar as cotas raciais na ADPF 186 e na ADC 41. Restrições em concurso, como idade e altura, só são válidas se justificadas pela natureza do cargo, de acordo com a Súmula 683 do Supremo.", "Esponja em Áudio · aula 18"], ["Uma lei que isenta servidores públicos da taxa de inscrição em concurso, sem finalidade de igualdade substancial, é inconstitucional, tema cobrado no ENAM de 2024.", "Esponja em Áudio · aula 18"], ["Sobre a liberdade de expressão, o Supremo, na ADPF 130, derrubou a Lei de Imprensa, e na ADI 4.815 afastou a exigência de autorização prévia para biografias. Ela é ponderada com honra e imagem, mas a crítica a quem ocupou cargo público é mais ampla, e a liberdade de expressão tende a prevalecer.", "Esponja em Áudio · aula 18"], ["A liberdade de reunião, art. 5º, inciso 16, exige que seja pacífica, sem armas, independe de autorização, mas exige prévio aviso à autoridade. A banca inverte, dizendo que exige autorização. Na liberdade de associação, é vedada a de caráter paramilitar.", "Esponja em Áudio · aula 18"], ["A dissolução compulsória só pode ocorrer por decisão judicial transitada em julgado, e a suspensão das atividades, por decisão judicial, sem exigência de trânsito. O sigilo das comunicações telefônicas só pode ser quebrado por ordem judicial, art. 5º, inciso 12.", "Esponja em Áudio · aula 18"], ["Mas o Supremo entende que os dados cadastrais, como qualificação, filiação e endereço, podem ser acessados por autoridades sem autorização judicial. A banca confunde as duas coisas. Sigilo bancário e fiscal exigem ordem judicial, ou CPI. O domicílio é inviolável.", "Esponja em Áudio · aula 18"], ["Só se entra com consentimento do morador, em flagrante delito, desastre, ou para prestar socorro, e, durante o dia, por ordem judicial. No Tema 280, o Supremo exige fundadas razões para a entrada em flagrante, e não meras suspeitas. A propriedade atenderá à função social.", "Esponja em Áudio · aula 18"], ["Sobre o devido processo, a presunção de inocência diz que ninguém será considerado culpado até o trânsito em julgado de sentença penal condenatória, inciso 57, e são inadmissíveis as provas obtidas por meios ilícitos, inciso 56.", "Esponja em Áudio · aula 18"], ["O art. 6º lista os direitos sociais: educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência, proteção à maternidade e à infância, e assistência aos desamparados. São direitos fundamentais, com aplicação imediata.", "Esponja em Áudio · aula 18"], ["Aplicam-se o mínimo existencial e a proibição de retrocesso. No Tema 548, o Supremo reconheceu o dever do Estado de assegurar vaga em creche e pré-escola, com possibilidade de controle judicial. A banca diz que os direitos sociais são meras normas programáticas, sem eficácia. É errado.", "Esponja em Áudio · aula 18"]]}, {"n": 6, "nome": "Remédios constitucionais: HC, HD, MS, MI e ação popular", "sub": "", "a": [["Um limite importante: não cabe habeas corpus contra punição disciplinar militar quanto ao mérito, conforme o art. 142, § 2º. Cabe apenas para examinar os aspectos de legalidade, como competência e forma. A banca costuma dizer que não cabe nunca. Isso é meia verdade e, por isso, errada.", "Esponja em Áudio · aula 6"], ["Na jurisprudência, vale lembrar que o Supremo e o STJ restringiram o uso do habeas corpus como substituto de recurso, para impedir que ele vire um atalho.", "Esponja em Áudio · aula 6"], ["O ponto que mais cai: o habeas data exige prova da recusa administrativa. Ou seja, antes de ir ao Judiciário, o interessado precisa ter pedido a informação e tido o pedido negado, ou ficado sem resposta. É o que diz a Súmula 2 do STJ. Sem recusa prévia, falta interesse de agir.", "Esponja em Áudio · aula 6"], ["Protege direito líquido e certo, não amparado por habeas corpus ou habeas data, contra ato de autoridade pública, ou de agente de pessoa jurídica no exercício de atribuições do poder público. Está regido pela Lei 12.016/2009. O que é direito líquido e certo?", "Esponja em Áudio · aula 6"], ["Um detalhe do Supremo: a Súmula 625 diz que a controvérsia sobre matéria de direito não impede a concessão do mandado de segurança. A dificuldade é de fato, não de interpretação jurídica.", "Esponja em Áudio · aula 6"], ["O prazo é de 120 dias, contados da ciência do ato impugnado, e é decadencial. A banca troca esse número por 180 dias, ou por 5 anos. O Supremo declarou esse prazo constitucional, na Súmula 632. E, por ser decadencial, ele não se suspende nem se interrompe.", "Esponja em Áudio · aula 6"], ["Não cabe, em regra, contra decisão judicial da qual caiba recurso com efeito suspensivo. E não substitui ação de cobrança, como diz a Súmula 269, nem produz efeitos patrimoniais pretéritos, por força da Súmula 271.", "Esponja em Áudio · aula 6"], ["Ou seja, o mandado de segurança vale para o futuro, e os valores atrasados vão ser cobrados em ação própria. Sobre honorários advocatícios, as Súmulas 512 do Supremo e 105 do STJ dizem que não cabem no mandado de segurança. A lei também reforça isso. Atenção, porque a banca costuma inverter.", "Esponja em Áudio · aula 6"], ["Esse prazo de um ano vale para a associação, e o Supremo entende que não vale para o sindicato. Atenção: trata-se de substituição processual, de modo que não precisa de autorização individual dos associados, conforme a Súmula 629.", "Esponja em Áudio · aula 6"], ["O mandado de injunção cabe quando a falta de norma regulamentadora torna inviável o exercício de direitos e liberdades constitucionais, e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania. Está regulado pela Lei 13.300/2016.", "Esponja em Áudio · aula 6"], ["Qualquer cidadão pode propor ação popular para anular ato lesivo ao patrimônio público, ou de entidade de que o Estado participe, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural. Regida pela Lei 4.717/1965.", "Esponja em Áudio · aula 6"], ["Cidadão quer dizer eleitor, e isso se prova com o título de eleitor. Por isso, pessoa jurídica não pode propor ação popular, conforme a Súmula 365 do Supremo, e a banca troca isso dizendo que qualquer pessoa jurídica pode, ou que o Ministério Público pode ser autor. Errado.", "Esponja em Áudio · aula 6"], ["O mandado de segurança não substitui a ação popular, o que está na Súmula 101 do Supremo. A ação popular é contra ato lesivo, e a ação civil pública, que é outro instrumento, é proposta por legitimados específicos e tem objeto mais amplo.", "Esponja em Áudio · aula 6"], ["No mandado de segurança coletivo, não precisa de autorização dos associados, Súmula 629, e basta que o direito interesse a parte da categoria, Súmula 630. O mandado de injunção supre falta de norma regulamentadora, em linha concretista, Lei 13.300.", "Esponja em Áudio · aula 6"]]}, {"n": 7, "nome": "Reserva do possível, mínimo existencial, pessoa com deficiência e pessoa idosa", "sub": "", "a": [["Comece pela ideia de direito social. O artigo sexto da Constituição lista educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência social, proteção à maternidade e à infância e assistência aos desamparados.", "Esponja em Áudio · aula 2"], ["Ele não pode ser usado como desculpa genérica para o Estado deixar de cumprir a Constituição. O contraponto é o mínimo existencial. Ele é o núcleo básico dos direitos sociais, aquilo sem o qual a pessoa não consegue viver com dignidade.", "Esponja em Áudio · aula 2"], ["Não está escrito literalmente na Constituição, mas é extraído do princípio da dignidade da pessoa humana, do artigo primeiro, inciso três, e dos direitos sociais do artigo sexto. Costuma abranger saúde básica, educação fundamental, moradia, assistência aos desamparados e segurança alimentar.", "Esponja em Áudio · aula 2"], ["Mais um ponto prático: quem tem o ônus de provar? O Estado: não basta alegar crise financeira. O ente público precisa demonstrar objetivamente que não tem recursos e que adotou escolhas razoáveis. Essa é uma pegadinha comum, em que a banca diz que o cidadão teria de provar a existência de verba.", "Esponja em Áudio · aula 2"], ["A saúde é o campo onde esses conceitos mais aparecem. O art. 196 da Constituição diz que a saúde é direito de todos e dever do Estado: o Supremo fixou, no Tema 793, que os entes federativos são solidariamente responsáveis pelas demandas de saúde.", "Esponja em Áudio · aula 2"], ["Isso significa que o cidadão pode demandar qualquer um deles, isoladamente ou em conjunto: União, Estado ou Município. A banca costuma dizer que a União teria de participar sempre. Isso é falso.", "Esponja em Áudio · aula 2"], ["Outro ponto: a falta de dotação orçamentária não impede a ordem judicial de fornecer um medicamento essencial. O ente pode remanejar recursos ou abrir crédito. O argumento de que a Constituição veda despesa sem previsão orçamentária não afasta o dever, quando o direito fundamental está em risco.", "Esponja em Áudio · aula 2"], ["E os medicamentos que não estão nas listas do SUS? Aqui o assunto mudou muito. O Supremo julgou o Tema 6, que trata de medicamento registrado na Anvisa mas não incorporado ao SUS, e o Tema 1.234, que trata da competência e do custeio.", "Esponja em Áudio · aula 2"], ["Em 2024, o Supremo aprovou as Súmulas Vinculantes 60 e 61, que incorporaram essas decisões. A Súmula Vinculante 61 diz que a concessão judicial de medicamento registrado na Anvisa, mas não incorporado às listas do SUS, deve observar as teses do Tema 6.", "Esponja em Áudio · aula 2"], ["A regra, portanto, é a excepcionalidade. Já a Súmula Vinculante 60 manda observar os acordos entre os entes, homologados no Tema 1.234, para o pedido administrativo e a judicialização.", "Esponja em Áudio · aula 2"], ["A base é a Convenção sobre os Direitos das Pessoas com Deficiência, de Nova Iorque, aprovada pelo Congresso pelo rito do art. 5º, §3º, da Constituição. Por isso, tem status de emenda constitucional. É um dos poucos tratados com esse status, e a banca adora lembrar disso.", "Esponja em Áudio · aula 2"], ["A Lei Brasileira de Inclusão, a Lei 13.146/2015, adota o modelo biopsicossocial: pessoa com deficiência é aquela que tem impedimento de longo prazo, de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais barreiras, pode obstruir a participação plena e efetiva na sociedade em igualdade de condições.", "Esponja em Áudio · aula 2"], ["Nos concursos públicos, a Constituição manda reservar percentual das vagas, e a pessoa tem direito a adaptações razoáveis nas provas. Por fim, a pessoa idosa, protegida pela Lei 10.741/2003. É considerada pessoa idosa a que tem sessenta anos ou mais.", "Esponja em Áudio · aula 2"], ["Se você guardar três números, guarda a maior parte da matéria. Sessenta: é a idade da pessoa idosa, e a partir dela é vedado o reajuste de plano de saúde por faixa etária. Sessenta e cinco: gratuidade no transporte coletivo urbano, prevista no art. 230, §2º, da Constituição.", "Esponja em Áudio · aula 2"]]}, {"n": 8, "nome": "Federação, repartição de competências e intervenção", "sub": "", "a": [["A forma federativa de Estado é cláusula pétrea, art. 60, parágrafo 4º, inciso 1. Não existe direito de secessão: nenhum ente pode se separar. A autonomia se expressa em quatro capacidades. Auto-organização, que é editar a própria Constituição ou lei orgânica.", "Esponja em Áudio · aula 10"], ["Autogoverno, que é eleger seus governantes. Autolegislação, que é editar leis próprias. E autoadministração, que é prestar seus próprios serviços. O Senado representa os Estados, e a Constituição reparte as rendas entre os entes. Guarde a ideia: autonomia não é soberania.", "Esponja em Áudio · aula 10"], ["Soberania é da República, no plano internacional. Os entes têm autonomia, dentro dos limites da Constituição. A competência material diz quem executa, quem administra. A competência material exclusiva da União está no art. 21 e é indelegável.", "Esponja em Áudio · aula 10"], ["Uma lei complementar fixa normas de cooperação, porque a Constituição quer equilíbrio no desenvolvimento e no bem-estar. Dois cuidados: primeiro, não confunda a lista do art. 21 com a do art. 22. Uma é material e exclusiva, a outra é legislativa e privativa.", "Esponja em Áudio · aula 10"], ["A competência concorrente está no art. 24, e aqui a lógica é de divisão. A União edita as normas gerais. Os Estados e o Distrito Federal suplementam. O macete é o PUFETO: Penitenciário, Urbanístico, Financeiro, Econômico, Tributário e Orçamento.", "Esponja em Áudio · aula 10"], ["Ela tem a eficácia suspensa, no que for contrário. É o que diz o parágrafo 4º do art. 24. Guarde a palavra suspensa. Se a lei federal for revogada, a estadual volta a produzir efeitos. A banca costuma dizer revoga.", "Esponja em Áudio · aula 10"], ["O Município legisla sobre assuntos de interesse local, art. 30, inciso 1, e suplementa a legislação federal e estadual no que couber, inciso 2. O Município não está na lista do art. 24, mas suplementa.", "Esponja em Áudio · aula 10"], ["Em matéria de meio ambiente, por exemplo, ao julgar o Tema 145, entendeu que o Município pode legislar, desde que haja interesse local e harmonia com a legislação federal e estadual.", "Esponja em Áudio · aula 10"], ["E em matéria de horário do comércio, a Súmula Vinculante 38 diz que é competente o Município para fixar o horário de funcionamento de estabelecimento comercial. Atenção ao contraponto: o horário bancário, pela Súmula 19 do STJ, é da União.", "Esponja em Áudio · aula 10"], ["Os limites: o Município não legisla sobre direito civil nem processual, porque são matérias privativas da União. E a Súmula Vinculante 49 diz que ofende a livre concorrência lei municipal que impede a instalação de estabelecimentos do mesmo ramo em determinada área.", "Esponja em Áudio · aula 10"], ["Há uma exceção: se o decreto se limita a suspender a execução do ato impugnado e isso bastar para restabelecer a normalidade, fica dispensada a apreciação pelo Congresso. É o parágrafo 3º do art. 36. A intervenção estadual nos Municípios é regida pelo art. 35, e as hipóteses são taxativas.", "Esponja em Áudio · aula 10"], ["Entre elas: deixar de ser paga, sem motivo de força maior, por dois anos consecutivos, a dívida fundada; não prestar contas devidas; não aplicar o mínimo exigido da receita em ensino e saúde; e a representação do Tribunal de Justiça para assegurar princípios indicados na Constituição Estadual ou prover a execução de lei, de ordem ou de decisão judicial.", "Esponja em Áudio · aula 10"], ["E, sobre recurso, a Súmula 637 do Supremo diz que não cabe recurso extraordinário contra acórdão de Tribunal de Justiça que defere pedido de intervenção estadual em Município. O Supremo também entende desnecessário reproduzir literalmente os princípios sensíveis na Constituição Estadual.", "Esponja em Áudio · aula 10"], ["Bens da União estão no art. 20, bens dos Estados no art. 26, e os Municípios não têm lista própria na Constituição. As súmulas vinculantes citadas no resumo. A número 2: bingos e loterias são da União. A 39: a União legisla sobre vencimentos das polícias do Distrito Federal.", "Esponja em Áudio · aula 10"]]}, {"n": 9, "nome": "Municípios, Lei Orgânica, Câmara Municipal e contas do Prefeito", "sub": "", "a": [["O Município é ente federativo autônomo, nos termos do art. 18 da Constituição. A autonomia se expressa na auto-organização, que se faz por meio da Lei Orgânica, e não por uma Constituição municipal. O Município também não tem Poder Judiciário próprio.", "Esponja em Áudio · aula 14"], ["Está no art. 18, parágrafo 4º: a banca pode dizer que a criação é por lei municipal ou por lei federal. A Lei Orgânica é regida pelo caput do art. 29. É votada em dois turnos, com interstício mínimo de dez dias entre eles, e aprovada por dois terços dos membros da Câmara Municipal, que a promulga.", "Esponja em Áudio · aula 14"], ["Segunda: ela deve respeitar a Constituição Federal e a Constituição do Estado, em razão da simetria. A banca costuma trocar por maioria absoluta, turno único, ou prever sanção do Prefeito. O edital identifica a Lei Orgânica de Curitiba como Lei 5.700, de 1977, e alterações.", "Esponja em Áudio · aula 14"], ["A Súmula 702 do Supremo esclarece que a competência do Tribunal de Justiça se restringe aos crimes de competência da Justiça comum estadual.", "Esponja em Áudio · aula 14"], ["Nos demais casos, a competência originária cabe ao respectivo tribunal de segundo grau, ou seja, o Tribunal Regional Federal, para crimes federais, e o Tribunal Regional Eleitoral, para crimes eleitorais. A banca diz que é sempre o Tribunal de Justiça. Distinga também as responsabilizações.", "Esponja em Áudio · aula 14"], ["O número de vereadores é proporcional à população, dentro dos limites do art. 29, inciso 4. Curitiba tem trinta e oito vereadores, número fixado pela Lei Complementar Municipal 51, de 2004. O teto constitucional para a faixa populacional de Curitiba é de trinta e nove.", "Esponja em Áudio · aula 14"], ["E o total da despesa com a remuneração dos vereadores não pode ultrapassar 5% da receita do Município. A banca troca o momento de fixação, dizendo que é feito pelo Prefeito ou na mesma legislatura.", "Esponja em Áudio · aula 14"], ["O art. 29-A trata da despesa total da Câmara, que é limitada a percentual da receita tributária do ano anterior, conforme a população: na faixa em que Curitiba se encontra, entre quinhentos mil e três milhões de habitantes, o teto é de quatro vírgula 5%.", "Esponja em Áudio · aula 14"], ["O art. 31 da Constituição trata da fiscalização: o controle externo do Município é exercido pela Câmara Municipal, com o auxílio do Tribunal de Contas.", "Esponja em Áudio · aula 14"], ["O parecer prévio do Tribunal de Contas sobre as contas anuais do Prefeito só deixa de prevalecer por decisão de dois terços dos membros da Câmara. A banca troca por maioria simples ou por três quintos.", "Esponja em Áudio · aula 14"], ["Isso resolve uma polêmica antiga. A banca tenta dizer que as contas de gestão são julgadas pelo Tribunal de Contas. As contas ficam, durante sessenta dias, anualmente, à disposição de qualquer contribuinte, para exame e apreciação, podendo questionar-lhes a legitimidade.", "Esponja em Áudio · aula 14"], ["A reserva de iniciativa é de interpretação restrita. A banca diz que criar despesa é, por si só, vício de iniciativa. E a Súmula Vinculante 13 veda o nepotismo nos três Poderes.", "Esponja em Áudio · aula 14"], ["Sobre a região metropolitana, o Estado pode instituí-la por lei complementar, para integrar a organização, o planejamento e a execução de funções públicas de interesse comum, conforme o art. 25, parágrafo 3º. A Região Metropolitana de Curitiba é exemplo.", "Esponja em Áudio · aula 14"], ["Na ADI 1842, o Supremo decidiu que, em saneamento, a competência é compartilhada, e a gestão não pode ficar concentrada em um único ente. Quanto à intervenção estadual em Município, ela já foi estudada na aula anterior: hipóteses taxativas do art. 35 e Súmula 637.", "Esponja em Áudio · aula 14"]]}, {"n": 10, "nome": "Poder Legislativo, processo legislativo e Tribunal de Contas", "sub": "", "a": [["A imunidade material, art. 53, caput, torna os parlamentares invioláveis, civil e penalmente, por suas opiniões, palavras e votos, quando as manifestações têm conexão com o mandato: é o Tema 469 do Supremo.", "Esponja em Áudio · aula 22"], ["O vereador tem imunidade material somente no Município e no exercício do mandato, art. 29, inciso 8. E o vereador não tem imunidade formal. A pegadinha é dizer que a imunidade material é absoluta, que cobre qualquer ofensa. Não cobre: exige nexo com o mandato.", "Esponja em Áudio · aula 22"], ["Agora a imunidade formal, art. 53, parágrafos 2º a 8º. O congressista só pode ser preso em flagrante de crime inafiançável, e a Casa decide em 24 horas, por maioria absoluta, se mantém a prisão. A banca troca inafiançável por afiançável, ou 24 por 48 horas.", "Esponja em Áudio · aula 22"], ["Recebida a denúncia por crime ocorrido após a diplomação, o Supremo dá ciência à Casa, que pode sustar a ação por maioria absoluta, em 45 dias. A banca troca por dois terços. E a sustação só vale para crime ocorrido depois da diplomação.", "Esponja em Áudio · aula 22"], ["O foro no Supremo vale para crimes cometidos durante o mandato e relacionados às funções, é a AP 937. A CPI, art. 58, parágrafo 3º, tem poderes de investigação próprios das autoridades judiciais: exige requerimento de um terço, fato determinado e prazo certo.", "Esponja em Áudio · aula 22"], ["As conclusões vão ao Ministério Público. A banca dá à CPI poderes de juiz sem reserva de jurisdição. Errado.", "Esponja em Áudio · aula 22"], ["A lei ordinária exige maioria simples, presente a maioria absoluta. A banca inverte, ou usa três quintos, que é quórum de emenda constitucional.", "Esponja em Áudio · aula 22"], ["Na iniciativa privativa, art. 61, parágrafo 1º, estão os servidores, a organização administrativa, a criação de cargos e o regime jurídico, e isso vale por simetria também no Município: se o Legislativo propõe lei sobre essas matérias, há vício de iniciativa.", "Esponja em Áudio · aula 22"], ["E a sanção do chefe do Executivo não convalida esse vício. A banca diz que convalida. A emenda parlamentar exige pertinência temática e não pode aumentar a despesa em projeto de iniciativa reservada, art. 63. O Presidente tem 15 dias úteis para sancionar ou vetar.", "Esponja em Áudio · aula 22"], ["O veto parcial alcança o texto integral de artigo, parágrafo, inciso ou alínea. A derrubada exige maioria absoluta, em sessão conjunta, e o Congresso aprecia o veto em 30 dias. A banca diz 15 dias corridos, ou dois terços.", "Esponja em Áudio · aula 22"], ["Em regra, a promulgação é em 48 horas pelo Presidente, e depois pelo Presidente do Senado. A medida provisória, art. 62, exige relevância e urgência: vigora por 60 dias, prorrogáveis por mais 60. Após 45 dias, tranca a pauta.", "Esponja em Áudio · aula 22"], ["Se não for convertida, perde a eficácia desde a edição, e o Congresso disciplina as relações. A banca diz que perde eficácia só dali em diante. É vedada medida provisória em matéria de nacionalidade, direitos políticos, direito penal e processual, lei complementar e outras, parágrafo 1º.", "Esponja em Áudio · aula 22"], ["A pegadinha é dizer que o Tribunal susta contrato diretamente. Primeiro vem o Legislativo. A Súmula Vinculante 3 exige contraditório e ampla defesa nos atos do Tribunal que afetem interessado, salvo na apreciação da concessão inicial de aposentadoria.", "Esponja em Áudio · aula 22"], ["Não se criam novos tribunais de contas municipais. A Súmula 347 do Supremo diz que os tribunais de contas podem afastar lei inconstitucional no caso concreto, sem declaração com efeitos gerais. E o Tema 899 diz que é prescritível o ressarcimento ao erário fundado em decisão de Tribunal de Contas.", "Esponja em Áudio · aula 22"]]}, {"n": 11, "nome": "Poder Executivo, Poder Judiciário e CNJ", "sub": "", "a": [["O Presidente da República é eleito em dois turnos, por maioria absoluta dos votos válidos. Se ninguém alcança, há nova eleição em até 20 dias da proclamação, com os dois mais votados. O mandato é de 4 anos e, desde a Emenda 111, de 2021, a posse é em 5 de janeiro.", "Esponja em Áudio · aula 26"], ["Esse foi o ponto da prova do MP de São Paulo: a banca disse 1º de janeiro. Errado. Os governadores tomam posse em 6 de janeiro. A vacância tem duas regras. Se os cargos de Presidente e Vice vagarem nos 2 primeiros anos, a eleição é direta, em 90 dias.", "Esponja em Áudio · aula 26"], ["Se vagarem nos 2 últimos anos, a eleição é indireta, pelo Congresso, em 30 dias. Em qualquer caso, o eleito apenas completa o período do antecessor, o chamado mandato-tampão. A banca inverte direta e indireta.", "Esponja em Áudio · aula 26"], ["Na linha de substituição, em caso de impedimento, assumem o Vice, o Presidente da Câmara, o do Senado e o do Supremo. A ausência do País por mais de 15 dias exige licença do Congresso, sob pena de perda do cargo. A Câmara autoriza a instauração do processo por dois terços.", "Esponja em Áudio · aula 26"], ["O Supremo, na ADI 5540, decidiu que elas não se estendem aos governadores, e que a licença da Assembleia não é condição para o STJ receber denúncia contra governador. A banca diz que a Constituição estadual pode copiar a regra. Errado.", "Esponja em Áudio · aula 26"], ["A definição dos crimes de responsabilidade é competência legislativa privativa da União. É a Súmula Vinculante 46 e a Súmula 722. O Prefeito responde por crimes comuns no Tribunal de Justiça, e a Câmara Municipal julga as infrações político-administrativas, previstas no Decreto-Lei 201, de 1967.", "Esponja em Áudio · aula 26"], ["O decreto autônomo, art. 84, inciso 6, só cabe para dispor sobre organização e funcionamento da administração, sem aumento de despesa nem criação ou extinção de órgãos, e para extinguir funções ou cargos públicos vagos: a banca amplia o alcance. Errado.", "Esponja em Áudio · aula 26"], ["A medida provisória, art. 62, vigora por 60 dias, prorrogáveis por mais 60: tranca a pauta a partir do quadragésimo sexto dia. Se rejeitada ou perder a eficácia, não pode ser reeditada na mesma sessão legislativa. E o Supremo veda os jabutis, as emendas sem pertinência temática, na conversão em lei.", "Esponja em Áudio · aula 26"], ["O ingresso exige concurso, com a OAB em todas as fases, e 3 anos de atividade jurídica. A banca troca 3 por 5. O Supremo tem 11 ministros, brasileiros natos, com 35 a 70 anos, de notável saber jurídico, nomeados pelo Presidente após aprovação por maioria absoluta do Senado.", "Esponja em Áudio · aula 26"], ["No quinto constitucional, vagas de advogados e membros do Ministério Público com mais de 10 anos de carreira, por lista sêxtupla, depois tríplice, com nomeação em 20 dias. Na promoção por merecimento, o juiz precisa de 2 anos na entrância e integrar a primeira quinta parte da lista de antiguidade.", "Esponja em Áudio · aula 26"], ["É presidido pelo Presidente do Supremo. O Corregedor Nacional é Ministro do STJ e fica excluído da distribuição de processos lá.", "Esponja em Áudio · aula 26"], ["Há ainda membros de vários ramos do Judiciário, um do Ministério Público da União, um do Ministério Público estadual, 2 advogados indicados pela OAB e 2 cidadãos, um da Câmara e outro do Senado. Os nomes são aprovados por maioria absoluta do Senado.", "Esponja em Áudio · aula 26"], ["Recebe reclamações, avoca processos disciplinares e revê processos disciplinares julgados há menos de 1 ano. A banca troca por 5 anos. Errado. A competência disciplinar do CNJ é concorrente à dos tribunais, e não subsidiária.", "Esponja em Áudio · aula 26"], ["Foi a ADI 4638. A banca diz que o CNJ só atua depois de esgotada a corregedoria local. Errado. O CNJ não exerce jurisdição, não revê decisões judiciais e não controla o Supremo. É a ADI 3367. Os atos do CNJ são questionados no próprio Supremo, art. 102, inciso 1, letra r.", "Esponja em Áudio · aula 26"]]}, {"n": 12, "nome": "Funções essenciais à Justiça, Advocacia Pública e a PGM de Curitiba", "sub": "", "a": [["A Constituição reúne, entre os art. 127 e 135, o Ministério Público, a Advocacia Pública, a Advocacia e a Defensoria Pública. Não integram o Judiciário, mas são indispensáveis ao seu funcionamento, porque o juiz é inerte.", "Esponja em Áudio · aula 30"], ["O Ministério Público é instituição permanente, essencial à função jurisdicional, defensora da ordem jurídica, do regime democrático e dos interesses sociais e individuais indisponíveis.", "Esponja em Áudio · aula 30"], ["Princípios: unidade, indivisibilidade e independência funcional. A banca troca o último por hierarquia funcional. Errado. Há hierarquia só administrativa. Tem autonomia funcional, administrativa e financeira e iniciativa de lei para sua organização.", "Esponja em Áudio · aula 30"], ["O advogado é indispensável à administração da justiça e inviolável por seus atos e manifestações no exercício da profissão, nos limites da lei. A Defensoria Pública presta orientação jurídica e defesa dos necessitados, com autonomia funcional e administrativa e iniciativa de proposta orçamentária.", "Esponja em Áudio · aula 30"], ["A Advocacia-Geral da União representa a União judicial e extrajudicialmente e faz a consultoria do Poder Executivo. O Advogado-Geral é de livre nomeação, entre cidadãos maiores de 35 anos, de notável saber jurídico.", "Esponja em Áudio · aula 30"], ["O art. 132 só cita Estados e Distrito Federal: mesmo assim, o Supremo considera os procuradores municipais parte da advocacia pública.", "Esponja em Áudio · aula 30"], ["No Tema 510, decidiu que o termo procuradores, do art. 37, inciso 11, abrange os procuradores municipais, que se submetem ao teto de 90,25% do subsídio dos Ministros do Supremo, e não ao subsídio do Prefeito. Essa é uma das pegadinhas mais cobradas.", "Esponja em Áudio · aula 30"], ["Os honorários de sucumbência dos advogados públicos, art. 85, parágrafo 19, do CPC, foram declarados constitucionais na ADI 6.053, mas sujeitos ao teto remuneratório.", "Esponja em Áudio · aula 30"], ["O art. 74 da Lei Orgânica de Curitiba diz que a representação judicial e extrajudicial, o assessoramento e a consultoria jurídica do Município cabem aos Procuradores do Município, membros da Procuradoria-Geral, instituição essencial à justiça, órgão central do sistema jurídico municipal, diretamente vinculada ao Prefeito: o Procurador-Geral é de livre nomeação do Prefeito, preferencialmente entre os integrantes da carreira, com tratamento e prerrogativas de Secretário Municipal. A banca diz obrigatoriamente da carreira.", "Esponja em Áudio · aula 30"], ["A Procuradoria atua obrigatoriamente no controle interno da legalidade dos atos do Executivo. A cobrança judicial e extrajudicial da dívida ativa é exclusiva da Procuradoria, e as atribuições são exclusivas dos procuradores da carreira, vedadas a terceiros, servidores ou não.", "Esponja em Áudio · aula 30"], ["A Lei 15.461 de 2019 repete essa exclusividade. A Lei 16.200 de 2023 trata da carreira dos Procuradores. A carreira é permanente e essencial à representação judicial e à consultoria jurídica. O concurso tem prova escrita eliminatória e prova de títulos classificatória.", "Esponja em Áudio · aula 30"], ["Agora o desenvolvimento na carreira, ponto muito cobrado. O crescimento horizontal, para a referência seguinte no mesmo nível, ocorre só em anos pares, com até 40% dos procuradores, e pontuação de 80% de avaliação funcional e 20% de títulos.", "Esponja em Áudio · aula 30"], ["O crescimento vertical por merecimento, para o nível seguinte, ocorre só em anos ímpares, com até 20% das vagas, e pontuação de 80% de títulos e 20% de avaliação. A banca inverte anos e pesos. Cumprir os requisitos não gera direito subjetivo, as vagas não se acumulam, e aposentados não participam.", "Esponja em Áudio · aula 30"], ["Os art. 35 a 52 da Lei 1.656 de 1958 não se aplicam aos procuradores, e o Estatuto da Advocacia é fonte subsidiária.", "Esponja em Áudio · aula 30"]]}, {"n": 13, "nome": "Administração Pública e servidores na CF: arts. 37 a 41 e teto remuneratório", "sub": "", "a": [["O art. 37 traz os princípios expressos, que a gente lembra pela sigla LIMPE: legalidade, impessoalidade, moralidade, publicidade e eficiência. A razoabilidade e a supremacia do interesse público são implícitos.", "Esponja em Áudio · aula 34"], ["Durante o prazo, o aprovado tem prioridade sobre novos concursados. A banca troca por 5 anos ou por prorrogações sucessivas. As funções de confiança são exercidas exclusivamente por servidores efetivos. Os cargos em comissão são para direção, chefia e assessoramento. A banca inverte essas regras.", "Esponja em Áudio · aula 34"], ["A Súmula Vinculante 13 veda o nepotismo nos três Poderes, até o terceiro grau. O direito de greve será exercido nos termos de lei específica. Na omissão, o Supremo manda aplicar a Lei 7.783.", "Esponja em Áudio · aula 34"], ["No Tema 531, decidiu que a Administração deve descontar os dias parados, ressalvada a compensação por acordo e a greve provocada por conduta ilícita do próprio Poder Público.", "Esponja em Áudio · aula 34"], ["A remuneração só pode ser fixada ou alterada por lei específica, com revisão geral anual, sempre na mesma data e sem distinção de índices. É vedada a vinculação e a equiparação, e a Súmula Vinculante 37 diz que o Judiciário não pode aumentar vencimentos por isonomia. A remuneração é irredutível.", "Esponja em Áudio · aula 34"], ["O teto geral é o subsídio mensal dos Ministros do Supremo. Nos Municípios, o teto é o subsídio do Prefeito. Nos Estados, é o do Governador no Executivo, o dos Deputados no Legislativo e o dos Desembargadores no Judiciário, que corresponde a 90,25% do subsídio do Supremo.", "Esponja em Áudio · aula 34"], ["Esse limite de 90,25% vale também para procuradores, defensores e membros do Ministério Público. Aqui está a pegadinha clássica. Procurador municipal não se submete ao teto do Prefeito.", "Esponja em Áudio · aula 34"], ["No Tema 510, o Supremo entendeu que o termo procuradores abrange os municipais, que ficam no teto de 90,25% do subsídio dos Ministros do Supremo.", "Esponja em Áudio · aula 34"], ["O subteto único, igual ao subsídio dos Desembargadores, é facultado a Estados e ao Distrito Federal, por emenda às Constituições estaduais ou à Lei Orgânica do DF. Os Municípios não têm subteto.", "Esponja em Áudio · aula 34"], ["E, pela Emenda 135 de 2024, as parcelas indenizatórias só ficam fora do teto se previstas em lei ordinária nacional. A banca diz lei complementar ou lei local. Errado. A acumulação remunerada é vedada, salvo havendo compatibilidade de horários e respeitado o teto.", "Esponja em Áudio · aula 34"], ["As hipóteses são: dois cargos de professor; um cargo de professor com outro de qualquer natureza, redação dada pela Emenda 138 de 2025, que ampliou a antiga hipótese de cargo técnico ou científico; e dois cargos privativos de profissionais de saúde, com profissões regulamentadas.", "Esponja em Áudio · aula 34"], ["A proibição alcança autarquias, fundações, empresas públicas, sociedades de economia mista, e também subsidiárias e controladas. Pelo Tema 384, o teto incide sobre cada vínculo isoladamente, e não sobre a soma. A banca diz que a soma limita o teto. Errado.", "Esponja em Áudio · aula 34"], ["Na improbidade, o ressarcimento ao erário só é imprescritível quando decorre de ato doloso de improbidade, Tema 897. O ilícito civil comum prescreve, Tema 666. A responsabilidade do Estado é objetiva, com direito de regresso contra o agente em caso de dolo ou culpa.", "Esponja em Áudio · aula 34"], ["A estabilidade vem após 3 anos de efetivo exercício, e depende de avaliação especial de desempenho. O estável perde o cargo por sentença transitada em julgado, por processo administrativo com ampla defesa ou por avaliação periódica de desempenho. A banca esquece a avaliação periódica.", "Esponja em Áudio · aula 34"]]}, {"n": 14, "nome": "Tributação e finanças na CF: EC 132, repartição de receitas e precatórios", "sub": "", "a": [["A Emenda Constitucional 132 de 2023 criou o IBS, compartilhado entre Estados, Distrito Federal e Municípios, a CBS, federal, e o Imposto Seletivo. O IBS substitui o ICMS e o ISS. A CBS substitui o PIS e a Cofins.", "Esponja em Áudio · aula 54"], ["A regulamentação veio com a Lei Complementar 214 de 2025, e o IBS é gerido por um Comitê Gestor nacional. A banca diz que o IBS substitui o IPTU. Errado. IPTU e ITBI continuam municipais. A transição: dois mil e vinte e seis é ano de testes, com CBS a zero vírgula 9% e IBS a zero vírgula 1%.", "Esponja em Áudio · aula 54"], ["A CBS vale plenamente em dois mil e vinte e sete. O IBS cresce de dois mil e vinte e nove a dois mil e trinta e dois, enquanto ICMS e ISS diminuem. Em dois mil e trinta e três, ICMS e ISS são extintos. A banca antecipa ou atrasa um ano.", "Esponja em Áudio · aula 54"], ["O novo sistema, art. 156-A, tem não cumulatividade ampla, tributação no destino, alíquota única por ente e não incidência sobre exportações: competência municipal, art. 156: IPTU, ITBI e ISS.", "Esponja em Áudio · aula 54"], ["O ITBI incide sobre transmissão entre vivos de imóveis, e não incide em integralização de capital nem em fusão e incorporação, salvo atividade preponderante imobiliária. O IPTU pode ser progressivo no tempo e em razão do valor, e a Emenda 132 permitiu também por localização e uso.", "Esponja em Áudio · aula 54"], ["Taxas se vinculam a serviço específico e divisível ou poder de polícia. Contribuição de melhoria exige obra e valorização. A COSIP, art. 149-A, custeia a iluminação pública e, desde a Emenda 132, também sistemas de monitoramento: repartição, art. 157 a 162.", "Esponja em Áudio · aula 54"], ["Pertencem aos Municípios 100% do imposto de renda retido na fonte de seus servidores, 50% do ITR, 50% do IPVA dos veículos licenciados no território e 25% do ICMS. A banca troca por vinte ou cinquenta no ICMS. Errado. É vinte e cinco.", "Esponja em Áudio · aula 54"], ["O Fundo de Participação dos Municípios é de vinte e dois vírgula 5% do IR e do IPI, mais 1% em dezembro, um em julho e um em setembro, art. 159. Artigo 160: é vedada a retenção ou restrição da entrega das receitas partilhadas.", "Esponja em Áudio · aula 54"], ["O art. 167 veda iniciar programas não previstos na lei orçamentária, despesa acima dos créditos e vinculação de impostos, salvo exceções como saúde e educação: despesa com pessoal no Município: 60% da receita corrente líquida, seis para o Legislativo e cinquenta e quatro para o Executivo.", "Esponja em Áudio · aula 54"], ["Artigo 100: o pagamento se faz na ordem cronológica de apresentação, depois do trânsito em julgado. Os precatórios apresentados até primeiro de fevereiro entram no orçamento do ano seguinte e são pagos até o fim desse exercício. Esse prazo foi antecipado pela Emenda 136 de 2025.", "Esponja em Áudio · aula 54"], ["Antes era dois de abril. A banca antiga cobra dois de abril. Hoje, primeiro de fevereiro. Créditos alimentares têm preferência, parágrafo primeiro. Idosos, doentes graves e pessoas com deficiência têm superpreferência, parágrafo segundo. Requisição de pequeno valor não se submete a precatório.", "Esponja em Áudio · aula 54"], ["O valor é fixado em lei do ente, com piso igual ao maior benefício do regime geral de previdência. É vedado fracionar a execução para enquadrar parte em requisição de pequeno valor, parágrafo oitavo. O tribunal pede à Fazenda informação sobre débitos que impeçam a expedição, em trinta dias.", "Esponja em Áudio · aula 54"], ["O credor pode usar precatório para comprar imóveis públicos do ente devedor, se a lei local previr. O credor pode ceder o precatório sem anuência do devedor, parágrafo treze. A banca exige concordância da Fazenda. Errado.", "Esponja em Áudio · aula 54"], ["A atualização seguiu a Emenda 113, com a Selic, e a Emenda 136 fixou o IPCA a partir de primeiro de agosto de dois mil e vinte e cinco, com ajuste pela regra da Selic. Atenção à data que a questão pergunta.", "Esponja em Áudio · aula 54"]]}, {"n": 15, "nome": "Ordem econômica, política urbana e função social da propriedade", "sub": "", "a": [["O art. 170 funda a ordem econômica na valorização do trabalho humano e na livre iniciativa, para assegurar existência digna, conforme a justiça social: entre os princípios: propriedade privada e sua função social, livre concorrência, defesa do consumidor e do meio ambiente, e tratamento favorecido às empresas de pequeno porte.", "Esponja em Áudio · aula 58"], ["Artigo 173: a exploração direta de atividade econômica pelo Estado é exceção, só por segurança nacional ou relevante interesse coletivo.", "Esponja em Áudio · aula 58"], ["As estatais econômicas seguem o regime das empresas privadas e não podem ter privilégios fiscais não extensivos ao setor privado. A banca diz que a exploração direta é regra. Errado. Artigo 174: como agente normativo e regulador, o Estado fiscaliza, incentiva e planeja.", "Esponja em Áudio · aula 58"], ["O planejamento é determinante para o setor público e indicativo para o setor privado. A banca inverte: errado. A lei reprime o abuso do poder econômico: dominação de mercados, eliminação da concorrência e aumento arbitrário dos lucros.", "Esponja em Áudio · aula 58"], ["A pessoa jurídica responde, sem prejuízo da responsabilidade dos dirigentes. Monopólio da União, art. 177: pesquisa e lavra de petróleo e gás, refinação, importação e exportação, transporte por conduto e minerais nucleares.", "Esponja em Áudio · aula 58"], ["Os radioisótopos de meia-vida curta podem ser produzidos sob regime de permissão, pela Emenda 49. Serviços públicos: concessão ou permissão, sempre com licitação. Artigo 182: a política urbana é executada pelo Município.", "Esponja em Áudio · aula 58"], ["O plano diretor, aprovado pela Câmara Municipal, é obrigatório para cidades com mais de vinte mil habitantes, e é o instrumento básico. A propriedade urbana cumpre sua função social quando atende ao plano diretor. A desapropriação urbana comum exige prévia e justa indenização em dinheiro.", "Esponja em Áudio · aula 58"], ["Contra o solo urbano não edificado, subutilizado ou não utilizado, o parágrafo quarto permite que lei municipal específica, com base no plano diretor, exija sucessivamente: parcelamento ou edificação compulsórios, imposto predial e territorial urbano progressivo no tempo e, por fim, desapropriação com pagamento em títulos da dívida pública, de emissão previamente aprovada pelo Senado, com resgate em até dez anos. A banca pula etapas. Errado.", "Esponja em Áudio · aula 58"], ["Usucapião, art. 183 e 191: a urbana é de até duzentos e cinquenta metros quadrados, cinco anos, para moradia. A rural é de até cinquenta hectares, cinco anos, com trabalho e moradia. Imóveis públicos não são usucapidos. O direito não é reconhecido ao mesmo possuidor mais de uma vez.", "Esponja em Áudio · aula 58"], ["Reforma agrária, art. 184 a 186: compete à União desapropriar por interesse social o imóvel que não cumpre função social, com indenização em títulos da dívida agrária, resgatáveis em até vinte anos. As benfeitorias úteis e necessárias são pagas em dinheiro.", "Esponja em Áudio · aula 58"], ["Decreto presidencial declara o interesse, e o rito sumário é fixado por lei complementar. A banca diz que o Município faz reforma agrária. Errado. Não podem ser desapropriadas a pequena e média propriedade rural, se o proprietário não tiver outra, e a propriedade produtiva.", "Esponja em Áudio · aula 58"], ["A função social rural exige quatro requisitos simultâneos: aproveitamento racional e adequado, utilização adequada dos recursos naturais e preservação do meio ambiente, observância das normas trabalhistas e exploração que favoreça o bem-estar de proprietários e trabalhadores. A banca diz que basta a produtividade. Errado.", "Esponja em Áudio · aula 58"], ["Súmula vinculante 49: lei municipal que proíbe a instalação de estabelecimento do mesmo ramo em determinada área ofende a livre concorrência. Súmula vinculante 38: é competente o Município para fixar o horário de funcionamento do comércio local.", "Esponja em Áudio · aula 58"]]}]}, {"id": "TRI", "nome": "Direito Tributário", "c": "#FB8C00", "t": "#FFF3E0", "t2": "#FFE0B2", "d": "#BF360C", "topicos": [{"n": 1, "nome": "Princípios tributários, limitações ao poder de tributar e imunidades", "sub": "", "a": [["A legalidade, art. 150, inciso 1, da Constituição, e art. 97 do CTN, exige lei para instituir ou majorar tributo, taxas inclusive: a atualização monetária da base de cálculo pelo índice oficial não é majoração, art. 97, parágrafo segundo.", "Esponja em Áudio · aula 51"], ["A Súmula 160 do Superior Tribunal de Justiça veda só a atualização acima do índice oficial.", "Esponja em Áudio · aula 51"], ["O art. 97 do CTN não reserva à lei a fixação do prazo de recolhimento, e a alteração desse prazo não se sujeita à anterioridade, Súmula Vinculante 50: a exceção à legalidade está no art. 153, parágrafo primeiro: o Executivo pode alterar as alíquotas do imposto de importação, do de exportação, do IPI e do IOF, atendidas as condições e os limites da lei.", "Esponja em Áudio · aula 51"], ["Só esses quatro. Taxa não pode ser instituída por decreto. A medida provisória pode tratar de impostos, art. 62, parágrafo segundo. O imposto instituído ou majorado só produz efeitos no exercício seguinte se a medida for convertida em lei até o último dia do exercício em que foi editada.", "Esponja em Áudio · aula 51"], ["Essa condição não vale para os impostos dos art. 153, incisos 1, 2, 4 e 5, e 154, inciso 2. Dizer que a medida provisória não pode tratar de imposto em nenhuma hipótese é errado.", "Esponja em Áudio · aula 51"], ["Há a anterioridade anual, que exige o exercício financeiro seguinte, e a nonagesimal, a noventena, de 90 dias, art. 150, inciso 3, alíneas b e c. Escapam das duas: o imposto de importação, o de exportação, o IOF, o imposto extraordinário de guerra e o empréstimo compulsório por guerra ou calamidade.", "Esponja em Áudio · aula 51"], ["Mas o compulsório de investimento respeita a anterioridade. Escapam só da anual, e respeitam a noventena: o IPI, as contribuições sociais do art. 195, parágrafo sexto, e o restabelecimento de alíquotas do ICMS monofásico e da CIDE-combustíveis.", "Esponja em Áudio · aula 51"], ["A imunidade recíproca, art. 150, inciso 6, alínea a, e parágrafos segundo e terceiro, vale para a União, os Estados, o Distrito Federal e os Municípios, e se estende às autarquias e fundações instituídas e mantidas pelo Poder Público, quanto ao patrimônio, à renda e aos serviços vinculados às suas finalidades essenciais ou delas decorrentes: não vale para a atividade econômica regida pelo direito privado, nem quando há contraprestação ou pagamento de preço ou tarifa pelo usuário.", "Esponja em Áudio · aula 51"], ["Alcança só impostos, e não taxas nem contribuição de melhoria. Decorre diretamente da Constituição, sem precisar de lei complementar. E, segundo o Supremo, a sociedade de economia mista de capital aberto, voltada à remuneração dos acionistas, não é alcançada.", "Esponja em Áudio · aula 51"], ["A imunidade dos templos, art. 150, inciso 6, alínea b, e parágrafo quarto, veda impostos sobre templos de qualquer culto, inclusive suas organizações assistenciais e beneficentes, na redação da Emenda 132 de 2023. Alcança patrimônio, renda e serviços relacionados às finalidades essenciais.", "Esponja em Áudio · aula 51"], ["O Supremo a estende ao cemitério que seja extensão da entidade religiosa, RE 578.562. O IPTU do imóvel é imune, mas a taxa de coleta de lixo é devida, Súmula Vinculante 19, porque a imunidade só alcança impostos.", "Esponja em Áudio · aula 51"], ["Segundo o Supremo, não alcança a importação de suportes produzidos fora do Brasil.", "Esponja em Áudio · aula 51"], ["Os regimes especiais de fiscalização, para grandes contribuintes e devedores contumazes, fundamentam-se na isonomia material, na capacidade contributiva e na livre concorrência, porque o devedor contumaz distorce a concorrência.", "Esponja em Áudio · aula 51"], ["Devem respeitar a proporcionalidade e não podem inviabilizar a atividade econômica. O Supremo veda sanções políticas para forçar o pagamento de tributo, Súmulas 70, 323 e 547.", "Esponja em Áudio · aula 51"]]}, {"n": 2, "nome": "Competência, legislação, vigência, aplicação e interpretação no CTN", "sub": "", "a": [["A competência tributária é indelegável, art. 7º. O que se pode atribuir a outra pessoa jurídica de direito público são as funções de arrecadar ou fiscalizar tributos, ou de executar leis, serviços, atos ou decisões administrativas em matéria tributária. É a capacidade tributária ativa.", "Esponja em Áudio · aula 47"], ["A pessoa que recebe a atribuição tem as garantias e os privilégios processuais da atribuinte, parágrafo primeiro. A atribuição pode ser revogada a qualquer tempo, por ato unilateral da pessoa que a conferiu, parágrafo segundo. A banca diz que só por lei. Errado.", "Esponja em Áudio · aula 47"], ["E, pelo art. 8º, o não exercício da competência tributária não a defere a outra pessoa jurídica de direito público: competência não exercida não passa a outro ente.", "Esponja em Áudio · aula 47"], ["O art. 96 define legislação tributária como as leis, os tratados e as convenções internacionais, os decretos e as normas complementares que versem, no todo ou em parte, sobre tributos e relações jurídicas a eles pertinentes: isso inclui as obrigações acessórias, art. 113, parágrafo segundo.", "Esponja em Áudio · aula 47"], ["O art. 98 diz que os tratados e as convenções internacionais revogam ou modificam a legislação tributária interna, e serão observados pela que lhes sobrevenha: a lei posterior não revoga o tratado.", "Esponja em Áudio · aula 47"], ["A Súmula 575 do Supremo estende à mercadoria importada de país signatário do GATT ou membro da ALALC a isenção ou redução do imposto dada ao similar nacional. O art. 99 diz que o conteúdo e o alcance dos decretos restringem-se aos da lei em função da qual sejam expedidos: Decreto não inova.", "Esponja em Áudio · aula 47"], ["O art. 100 lista as normas complementares: os atos normativos expedidos pelas autoridades administrativas; as decisões dos órgãos singulares ou coletivos de jurisdição administrativa a que a lei atribua eficácia normativa; as práticas reiteradamente observadas pelas autoridades administrativas; e os convênios que entre si celebrem a União, os Estados, o Distrito Federal e os Municípios.", "Esponja em Áudio · aula 47"], ["A observância dessas normas exclui a imposição de penalidades, a cobrança de juros de moratórios e a atualização do valor monetário da base de cálculo do tributo. Não apenas a penalidade. E lei complementar e tratado não são normas complementares do art. 100.", "Esponja em Áudio · aula 47"], ["Nos art. 101 a 104, a vigência da legislação tributária segue as regras gerais da LINDB, ressalvado o capítulo: no espaço, art. 102, a lei de um Estado só vigora fora de seu território nos limites de convênios ou de lei da União.", "Esponja em Áudio · aula 47"], ["No tempo, art. 103, os atos normativos entram em vigor na data da publicação; as decisões com eficácia normativa, 30 dias após a publicação; e os convênios, na data neles prevista: e o art. 104 manda que dispositivos de lei que instituem ou majoram impostos sobre o patrimônio ou a renda, definem novos fatos geradores ou extinguem ou reduzem isenções entrem em vigor no primeiro dia do exercício seguinte.", "Esponja em Áudio · aula 47"], ["Na aplicação, art. 105 e 106, a legislação se aplica imediatamente aos fatos geradores futuros e aos pendentes, os iniciados mas não completos: a lei expressamente interpretativa retroage, mas não para aplicar penalidade.", "Esponja em Áudio · aula 47"], ["E a Constituição, no art. 150, inciso 3, alínea a, veda retroagir para majorar tributo. Na ausência de disposição expressa, a autoridade aplica sucessivamente a analogia, os princípios gerais de direito tributário, os princípios gerais de direito público e a equidade, art. 108.", "Esponja em Áudio · aula 47"], ["O art. 109 diz que os princípios gerais de direito privado utilizam-se para pesquisa da definição, do conteúdo e do alcance de seus institutos, conceitos e formas, mas não para definição dos respectivos efeitos tributários: o art. 110 diz que a lei tributária não pode alterar a definição, o conteúdo e o alcance de institutos de direito privado utilizados pela Constituição para definir competências tributárias.", "Esponja em Áudio · aula 47"], ["O art. 111 manda interpretar literalmente a legislação que disponha sobre suspensão ou exclusão do crédito tributário, outorga de isenção e dispensa do cumprimento de obrigações acessórias: a extinção do crédito não está nessa lista.", "Esponja em Áudio · aula 47"]]}, {"n": 3, "nome": "Tributos, espécies tributárias e regra-matriz de incidência", "sub": "", "a": [["O art. 3º do Código Tributário Nacional define tributo como toda prestação pecuniária compulsória, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída em lei e cobrada mediante atividade administrativa plenamente vinculada: a multa não é tributo, porque o tributo não é sanção.", "Esponja em Áudio · aula 43"], ["Mas atenção: a ilicitude do fato praticado é irrelevante para a incidência, conforme o art. 118, inciso 1. É o princípio pecunia non olet. A banca diz que fato gerador ilícito afasta o tributo.", "Esponja em Áudio · aula 43"], ["Falso: o Supremo adota a teoria pentapartida, com cinco espécies: impostos, taxas, contribuição de melhoria, empréstimos compulsórios e contribuições especiais.", "Esponja em Áudio · aula 43"], ["O empréstimo compulsório, art. 148 da Constituição, é de competência exclusiva da União, e por lei complementar: as hipóteses são guerra externa ou sua iminência, calamidade pública, sem anterioridade, e investimento público de caráter urgente e relevante interesse nacional, com anterioridade.", "Esponja em Áudio · aula 43"], ["Os recursos ficam vinculados à despesa que fundamentou a instituição, e o empréstimo é restituível. A banca diz lei ordinária. Errado. As taxas exigem serviço público específico e divisível, ou exercício do poder de polícia.", "Esponja em Áudio · aula 43"], ["A Súmula Vinculante 19 admite a taxa de coleta domiciliar de lixo, e diz que a limpeza de vias públicas é serviço geral, que não pode ser remunerado por taxa.", "Esponja em Áudio · aula 43"], ["A Súmula Vinculante 29 admite que a taxa use um ou mais elementos da base de cálculo de imposto, desde que não haja identidade integral. A banca diz que proíbe qualquer elemento. Errado. A Súmula Vinculante 41 diz que a iluminação pública não pode ser remunerada por taxa.", "Esponja em Áudio · aula 43"], ["Para isso existe a contribuição do art. 149-A, dos Municípios e do Distrito Federal, a COSIP. E segurança pública também não pode ser taxa. A contribuição de melhoria, art. 145, inciso 3, e art. 81 e 82 do CTN, é de competência comum. Exige obra pública e valorização imobiliária.", "Esponja em Áudio · aula 43"], ["Tem dois limites: o total, que é a despesa realizada com a obra, e o individual, que é o acréscimo de valor que da obra resultar para cada imóvel. Exige edital prévio com memorial descritivo e orçamento. Sem valorização, não há contribuição. E ela não é cobrada pelo custo total da obra.", "Esponja em Áudio · aula 43"], ["As contribuições do art. 149 são, em regra, de competência da União: a CIDE é da União, e a COSIP é dos Municípios e do Distrito Federal. Nas contribuições de seguridade social, aplica-se a noventena, e não a anterioridade anual, art. 195, parágrafo sexto.", "Esponja em Áudio · aula 43"], ["E novas fontes de custeio exigem lei complementar, art. 195, parágrafo quarto, combinado com o art. 154, inciso 1. A regra-matriz tem uma hipótese e uma consequência. Na hipótese, estão o critério material, que é o verbo mais o complemento, o espacial, que é o local, e o temporal, que é o momento.", "Esponja em Áudio · aula 43"], ["Na consequência, estão o critério pessoal, com sujeito ativo e passivo, e o quantitativo, com base de cálculo e alíquota. No IPTU, ser proprietário de bem imóvel urbano é o critério material. A banca troca os critérios entre si. Decore: material, o verbo. Espacial, onde: temporal, quando.", "Esponja em Áudio · aula 43"], ["Pessoal, quem: quantitativo, quanto.", "Esponja em Áudio · aula 43"]]}, {"n": 4, "nome": "Obrigação tributária e responsabilidade tributária: CTN, artigos 113 a 138", "sub": "", "a": [["O art. 113 divide a obrigação em principal e acessória: a principal tem por objeto o pagamento de tributo ou de penalidade pecuniária. A acessória é prestação positiva ou negativa, prevista na legislação, no interesse da arrecadação ou da fiscalização.", "Esponja em Áudio · aula 39"], ["O sujeito passivo é o contribuinte, que tem relação pessoal e direta com o fato gerador, ou o responsável, que, sem ser contribuinte, tem obrigação decorrente de disposição expressa de lei, art. 121.", "Esponja em Áudio · aula 39"], ["A capacidade tributária passiva independe da capacidade civil e da regularidade jurídica da pessoa, art. 126. E, pelo art. 123, as convenções particulares sobre responsabilidade valem entre as partes, mas não podem ser opostas à Fazenda: a banca inverte isso.", "Esponja em Áudio · aula 39"], ["A solidariedade, no art. 124, existe entre as pessoas que tenham interesse comum na situação que constitua o fato gerador e entre as expressamente designadas por lei: não comporta benefício de ordem. E o interesse comum é jurídico. O interesse meramente econômico não basta.", "Esponja em Áudio · aula 39"], ["No art. 130, os tributos que incidem sobre a propriedade, as taxas pela prestação de serviços referentes ao imóvel e a contribuição de melhoria sub-rogam-se na pessoa do adquirente, salvo se constar do título a prova de sua quitação: na arrematação em hasta pública, a sub-rogação ocorre sobre o respectivo preço.", "Esponja em Áudio · aula 39"], ["Nos art. 132 e 133 vem a sucessão empresarial: a pessoa jurídica resultante de fusão, transformação ou incorporação responde pelos tributos devidos pelas sucedidas.", "Esponja em Áudio · aula 39"], ["Se o alienante cessar a exploração, a responsabilidade do adquirente é integral. Se o alienante prosseguir na exploração, ou iniciar nova atividade em seis meses, a responsabilidade é subsidiária. A banca troca as duas.", "Esponja em Áudio · aula 39"], ["O art. 134 trata da responsabilidade de terceiros, que é subsidiária: ela só surge quando for impossível exigir o cumprimento da obrigação do contribuinte, e se refere aos atos em que intervieram ou às omissões de que forem responsáveis.", "Esponja em Áudio · aula 39"], ["O art. 135 é diferente, e a banca adora confundir os dois: são pessoalmente responsáveis pelos créditos resultantes de atos praticados com excesso de poderes ou infração de lei, contrato social ou estatutos os mandatários, prepostos e empregados, e os diretores, gerentes ou representantes de pessoas jurídicas de direito privado.", "Esponja em Áudio · aula 39"], ["O 134 é subsidiário. O 135 é pessoal. A Súmula 430 do Superior Tribunal de Justiça diz que o inadimplemento da obrigação tributária pela sociedade não gera, por si só, a responsabilidade solidária do sócio-gerente. A mera falta de pagamento não responsabiliza.", "Esponja em Áudio · aula 39"], ["O que responsabiliza é o excesso de poderes, a infração de lei ou a dissolução irregular. E a Súmula 435 presume dissolvida irregularmente a empresa que deixa de funcionar no seu domicílio fiscal, sem comunicação aos órgãos competentes, o que autoriza o redirecionamento.", "Esponja em Áudio · aula 39"], ["Nos art. 136 a 138, a responsabilidade por infrações à legislação tributária é, em regra, objetiva: independe da intenção do agente.", "Esponja em Áudio · aula 39"], ["A denúncia espontânea, do art. 138, exclui a responsabilidade pela infração, desde que acompanhada do pagamento do tributo devido e dos juros de mora, e feita antes de qualquer procedimento administrativo ou medida de fiscalização.", "Esponja em Áudio · aula 39"], ["Sobre a substituição tributária para frente, o art. 150, parágrafo sétimo, da Constituição assegura a restituição da quantia paga se o fato gerador presumido não se realizar. O Supremo entende que a restituição também é devida quando a base de cálculo efetiva for menor que a presumida.", "Esponja em Áudio · aula 39"]]}, {"n": 5, "nome": "Crédito tributário: lançamento, suspensão, extinção, exclusão, decadência e prescrição", "sub": "", "a": [["As modalidades são três. O lançamento de ofício, art. 149, feito pela autoridade por iniciativa própria. O lançamento por declaração, art. 147, com base em declaração do contribuinte.", "Esponja em Áudio · aula 19"], ["E o lançamento por homologação, art. 150, em que o contribuinte antecipa o pagamento e a autoridade posteriormente o homologa.", "Esponja em Áudio · aula 19"], ["A Súmula 436 do STJ afirma que a entrega de declaração pelo contribuinte, como a DCTF ou a GIA, reconhecendo o débito, constitui o crédito tributário, dispensada qualquer outra providência por parte do Fisco. A banca exige lançamento expresso. Está errado.", "Esponja em Áudio · aula 19"], ["Pelo art. 144, o lançamento reporta-se à data do fato gerador e rege-se pela lei então vigente, com ressalvas quanto a critérios de apuração, poderes de fiscalização e garantias: e o art. 146 diz que a mudança de critério jurídico só se aplica a fatos futuros.", "Esponja em Áudio · aula 19"], ["O art. 151 lista as causas de suspensão da exigibilidade: o macete é MORTAL: Moratória, depósito do montante integral, Reclamações e recursos administrativos, Liminar em mandado de segurança, tutela de urgência em outras ações, e Parcelamento. Atenção ao depósito: deve ser integral e em dinheiro, como diz a Súmula 112 do STJ.", "Esponja em Áudio · aula 19"], ["A Súmula Vinculante 21 veda a exigência de depósito ou arrolamento prévio de bens para admissibilidade de recurso administrativo. A banca troca suspensão por extinção: moratória, depósito e parcelamento suspendem. Remissão e compensação extinguem.", "Esponja em Áudio · aula 19"], ["Os juros de mora são, em regra, de 1% ao mês, se a lei não dispuser de modo diverso, art. 161, parágrafo 1º. Sobre a repetição do indébito, o art. 165 assegura o direito à restituição do pagamento indevido, independentemente de protesto. O prazo é de cinco anos, contados da extinção do crédito.", "Esponja em Áudio · aula 19"], ["Nos tributos por homologação, conta-se do pagamento antecipado, conforme o art. 3º da LC 118, de 2005.", "Esponja em Áudio · aula 19"], ["A ação anulatória da decisão administrativa que denegar a restituição prescreve em dois anos, art. 169, e lei estadual não pode alterar esse prazo. A banca diz cinco anos, ou que a lei local pode fixar outro prazo. A compensação depende de lei autorizadora, art. 170.", "Esponja em Áudio · aula 19"], ["O art. 170-A veda a compensação mediante aproveitamento de tributo objeto de contestação judicial antes do trânsito em julgado: a Súmula 212 do STJ diz que a compensação de créditos tributários não pode ser deferida em ação cautelar ou por medida liminar.", "Esponja em Áudio · aula 19"], ["O mandado de segurança serve para declarar o direito à compensação, como diz a Súmula 213 do STJ, mas não para convalidá-la, porque a extinção do crédito depende de homologação pelo Fisco. A banca afirma que o mandado de segurança extingue o crédito. Está errado. Distinga os dois institutos.", "Esponja em Áudio · aula 19"], ["A decadência, art. 173, tem prazo de cinco anos contados do primeiro dia do exercício seguinte àquele em que o lançamento poderia ter sido efetuado, da data em que se tornar definitiva a decisão que anular o lançamento por vício formal, ou da medida preparatória: nos tributos por homologação com pagamento antecipado, o prazo conta do fato gerador, nos termos do art. 150, parágrafo 4º.", "Esponja em Áudio · aula 19"], ["Se não houve pagamento nem declaração, ou se houve dolo, fraude ou simulação, aplica-se o art. 173, inciso 1, como diz a Súmula 555 do STJ. A decadência não se suspende nem se interrompe.", "Esponja em Áudio · aula 19"], ["A prescrição, art. 174, tem prazo de cinco anos contados da constituição definitiva do crédito: a prescrição se interrompe pelo despacho do juiz que ordena a citação em execução fiscal, pelo protesto judicial, por qualquer ato judicial que constitua em mora o devedor e por ato inequívoco do devedor que importe reconhecimento do débito. A banca inverte, dizendo que a decadência se interrompe e a prescrição não.", "Esponja em Áudio · aula 19"]]}, {"n": 6, "nome": "Reforma tributária: IBS, CBS, Imposto Seletivo e LC 214/2025", "sub": "", "a": [["Comece pelo problema que a reforma quis resolver. O sistema anterior tributava o consumo em cinco tributos diferentes: PIS, Cofins, IPI, ICMS e ISS.", "Esponja em Áudio · aula 7"], ["A Emenda Constitucional 132/2023 respondeu com um modelo de IVA dual. IVA, ou imposto sobre valor agregado, é o imposto em que cada empresa paga sobre o valor que acrescentou, descontando o imposto pago nas etapas anteriores.", "Esponja em Áudio · aula 7"], ["Dual porque são dois tributos: um federal e um compartilhado entre Estados, Distrito Federal e Municípios. A regulamentação veio com a Lei Complementar 214/2025. Vamos fixar o quadro de substituições, porque a banca adora trocar.", "Esponja em Áudio · aula 7"], ["IBS substitui ICMS e ISS, e não IPI e IOF. A banca costuma incluir IRPJ, IOF ou Imposto de Renda na lista, o que está errado, porque a reforma do consumo não mexeu nesses tributos. Também é errado dizer que a CBS é compartilhada. Ela é só da União. Já o IBS é do conjunto dos entes subnacionais.", "Esponja em Áudio · aula 7"], ["Em vez de olhar para o que foi diretamente incorporado ao produto, o crédito alcança tudo o que foi adquirido para a atividade econômica, ressalvadas as hipóteses de uso e consumo pessoal e outras exceções previstas. A banca diz que o crédito é restrito, físico, ou limitado à produção. Está errado.", "Esponja em Áudio · aula 7"], ["Quarto, vale o princípio do destino. O imposto pertence ao local onde ocorre o consumo, e não onde o bem foi produzido.", "Esponja em Áudio · aula 7"], ["Para entender, lembre-se da famosa discussão do ICMS na base do PIS e da Cofins, que o Supremo decidiu no Tema 69, quando afirmou que o ICMS não compõe a base de cálculo dessas contribuições. A lógica é parecida: o tributo não deve incidir sobre si mesmo. Sexto, a neutralidade e a uniformidade.", "Esponja em Áudio · aula 7"], ["A alíquota é uniforme para todas as operações, de modo que o imposto não influencie as escolhas econômicas. As exceções são apenas as previstas na própria Constituição ou na lei complementar, como os regimes diferenciados. Quem fixa as alíquotas?", "Esponja em Áudio · aula 7"], ["Prevê redução de 60% da alíquota para serviços de saúde, de educação, produtos hortícolas, dispositivos médicos e outros bens e serviços essenciais.", "Esponja em Áudio · aula 7"], ["E prevê redução de 30% para as profissões intelectuais de natureza científica, literária ou artística, os chamados profissionais liberais, desde que respeitados os critérios legais. Guarde os números: zero para a cesta básica, 60% de redução para saúde e educação, 30% para profissionais liberais.", "Esponja em Áudio · aula 7"], ["É um mecanismo de arrecadação para reduzir a sonegação e a inadimplência. Voltemos ao Imposto Seletivo. Ele incide, em regra, uma única vez na cadeia, no modelo monofásico.", "Esponja em Áudio · aula 7"], ["Outra regra importante: a Constituição, agora, veda incentivos e benefícios fiscais de IBS e CBS fora dos previstos nela própria. Não é mais possível conceder benefício livremente.", "Esponja em Áudio · aula 7"], ["E a reforma também alcançou o IPVA, agora incidente também sobre veículos aquáticos e aéreos, com exceções, e o ITCMD, que passou a ter regras de progressividade e de competência. Para revisar a transição, que já vimos com detalhe: 2026, fase de teste, com CBS de 0,9% e IBS de 0,1%, compensáveis.", "Esponja em Áudio · aula 7"], ["Dois: CBS substitui PIS e Cofins, IBS substitui ICMS e ISS. Três: não cumulatividade ampla, destino, cobrança por fora. Quatro: Imposto Seletivo federal, extrafiscal, em regra uma só vez. Cinco: sem benefícios fora da Constituição, com cashback e split payment como instrumentos novos.", "Esponja em Áudio · aula 7"]]}, {"n": 7, "nome": "Comitê Gestor do IBS, transição e processo do IBS (LC 227/2026)", "sub": "", "a": [["A Emenda Constitucional 132/2023, trocou cinco tributos sobre o consumo por um modelo de IVA dual. IVA quer dizer imposto sobre valor agregado, que é um imposto não cumulativo, em que cada empresa paga o imposto sobre o valor que agregou, e o imposto pago na etapa anterior vira crédito.", "Esponja em Áudio · aula 3"], ["O segundo é o IBS, o Imposto sobre Bens e Serviços, que substitui o ICMS estadual e o ISS municipal, e é compartilhado entre Estados, Distrito Federal e Municípios. Além disso, nasce o Imposto Seletivo, federal, sobre bens e serviços prejudiciais à saúde e ao meio ambiente.", "Esponja em Áudio · aula 3"], ["A Lei Complementar 214/2025, regulamentou esses tributos. E a Lei Complementar 227, sancionada em 13 de janeiro de 2026, instituiu o Comitê Gestor do IBS, tratou de fiscalização, cobrança e contencioso, alterou a Lei Complementar 214 e trouxe normas gerais sobre o ITCMD.", "Esponja em Áudio · aula 3"], ["A base constitucional é o art. 156-B. Ele diz que Estados, Distrito Federal e Municípios exercem de forma integrada, exclusivamente por meio do Comitê Gestor, três grandes atribuições. A primeira: editar o regulamento único do imposto e uniformizar a interpretação e a aplicação da legislação.", "Esponja em Áudio · aula 3"], ["A segunda: arrecadar o imposto, efetuar as compensações e distribuir o produto da arrecadação entre os entes. A terceira: decidir o contencioso administrativo. Repare na palavra exclusivamente. Isso quer dizer que cada Município não regulamenta nem julga, por conta própria, o IBS.", "Esponja em Áudio · aula 3"], ["A gestão é integrada e nacional. Memorize o trio: regulamentar, arrecadar e distribuir, e julgar o contencioso. Qual a natureza do Comitê? A Lei Complementar 214, no art. 480, o define como entidade pública com caráter técnico e operacional, sob regime especial, com sede no Distrito Federal.", "Esponja em Áudio · aula 3"], ["As decisões exigem maioria qualificada, para que nenhum grupo imponha sua vontade sozinho. A Lei Complementar 227 ajustou algumas regras sobre a indicação dos representantes municipais. E o que o Comitê não faz? Primeiro, ele não fixa alíquotas.", "Esponja em Áudio · aula 3"], ["Segue a neutralidade: o imposto não deve influenciar as escolhas econômicas, e por isso a alíquota é uniforme para todas as operações, ressalvadas as exceções previstas na própria Constituição.", "Esponja em Áudio · aula 3"], ["Começa a cobrança da CBS com alíquota de 0,9%, e do IBS com 0,1%, valores simbólicos, compensáveis com outros tributos, para que as empresas e o sistema se adaptem.", "Esponja em Áudio · aula 3"], ["Eles diminuem gradualmente, enquanto o IBS aumenta na mesma proporção. Em 2029, são 90% das alíquotas antigas e 10% do novo imposto. A cada ano, a proporção muda em dez pontos percentuais, chegando a 60% do antigo e 40% do novo em 2032.", "Esponja em Áudio · aula 3"], ["Por isso, o Ato das Disposições Constitucionais Transitórias, no art. 131 e seguintes, prevê mecanismos de retenção e redistribuição baseados na receita histórica, que vão diminuindo ao longo de décadas, até o destino pleno. Resumindo: na transição, o destino não é puro.", "Esponja em Áudio · aula 3"], ["E, enquanto convivem os dois sistemas, pode haver cumulatividade residual, que é um efeito temporário e tolerado pelo desenho da reforma. Chegamos ao processo: pelo art. 156-B, quem decide o contencioso administrativo do IBS é o Comitê Gestor.", "Esponja em Áudio · aula 3"], ["E, depois de esgotada a cobrança administrativa, o crédito segue para cobrança pela procuradoria, conforme a lei. Vamos revisar: comitê Gestor: previsto no art. 156-B, com gestão integrada de Estados, Distrito Federal e Municípios.", "Esponja em Áudio · aula 3"], ["Conselho Superior: 54 membros, 27 dos Estados e 27 dos Municípios. Não fixa alíquota: cada ente fixa a sua. Lei Complementar 227, de 13 de janeiro de 2026, instituiu o Comitê. Transição: 2026, teste. 2027, CBS plena e fim de PIS e Cofins. 2029 a 2032, ICMS e ISS caem. 2033, IBS pleno.", "Esponja em Áudio · aula 3"]]}, {"n": 8, "nome": "IPTU: regra-matriz, base de cálculo, progressividade e imunidades", "sub": "", "a": [["Vamos organizar o estudo pela regra-matriz, que responde a cinco perguntas. O quê, onde, quando, quem e quanto. O quê: ser proprietário, titular do domínio útil ou possuidor. Onde: na zona urbana. Quando: primeiro de janeiro, data fixada em lei.", "Esponja em Áudio · aula 11"], ["Quem: o Município é o sujeito ativo; o proprietário, o titular do domínio útil ou o possuidor é o sujeito passivo. Quanto: valor venal vezes alíquota. O fato gerador é a propriedade, o domínio útil ou a posse de bem imóvel por natureza ou por acessão física, localizado na zona urbana do Município.", "Esponja em Áudio · aula 11"], ["A zona urbana é definida em lei municipal, e o CTN exige que haja pelo menos dois melhoramentos entre cinco: meio-fio ou calçamento com canalização de águas pluviais; abastecimento de água; sistema de esgotos sanitários; rede de iluminação pública, com ou sem posteamento para distribuição domiciliar; e escola primária ou posto de saúde a menos de três quilômetros do imóvel. A banca troca dois por três, ou diz que basta um.", "Esponja em Áudio · aula 11"], ["Uma observação com jurisprudência. O imóvel situado em zona urbana, mas com destinação rural comprovada, ou seja, usado em extração vegetal, atividade agrícola, pecuária ou agroindustrial, paga ITR e não IPTU, segundo o STJ, aplicando o art. 15 do Decreto-lei 57, de 1966.", "Esponja em Áudio · aula 11"], ["O STJ, no Tema 122, decidiu que tanto o promitente comprador quanto o promitente vendedor podem ser contribuintes, e que o Município escolhe quem cobrar. Isso significa que não há litisconsórcio necessário entre os possíveis sujeitos passivos. O Município pode cobrar de um deles, ou dos dois.", "Esponja em Áudio · aula 11"], ["Agora o contraponto: o locatário não é contribuinte. Ele tem posse direta, mas sem ânimo de dono. E o contrato que transfere ao locatário o ônus do imposto vale entre as partes, mas não vale contra o Fisco, conforme o art. 123 do CTN. Se o inquilino não pagar, o Município cobra do proprietário.", "Esponja em Áudio · aula 11"], ["A base de cálculo é o valor venal do imóvel, que se apura pela planta genérica de valores, aprovada por lei. A atualização do valor venal pelo índice oficial de correção monetária pode ser feita por decreto, porque não é majoração. Acima desse índice, só por lei. É a Súmula 160 do STJ.", "Esponja em Áudio · aula 11"], ["Majorar acima da correção é aumentar tributo, e tributo só se aumenta por lei, art. 150, inciso 1. Agora o tema mais cobrado: as progressividades. São três. A primeira é a progressividade pelo valor do imóvel, art. 156, parágrafo 1º, inciso 1, introduzida pela Emenda 29, de 2000.", "Esponja em Áudio · aula 11"], ["Tem natureza fiscal. Antes da Emenda, o Supremo entendia que era inconstitucional a progressividade fiscal do IPTU, como diz a Súmula 668, salvo para assegurar o cumprimento da função social da propriedade. A segunda é por localização e uso do imóvel, art. 156, parágrafo 1º, inciso 2.", "Esponja em Áudio · aula 11"], ["Tem natureza de seletividade. São alíquotas diferentes, e não progressivas. Atenção
